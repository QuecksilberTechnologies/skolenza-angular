<div
  class="animate-pulse px-1 py-2"
  role="status"
  aria-label="Loading menu">
  @for (section of sections; track $index) {
  <div class="mb-1.5">
    <div class="px-4 pt-3 pb-1">
      <p-skeleton
        height="0.7rem"
        [width]="section.headerWidth" />
    </div>
    <ul
      class="space-y-0.5"
      role="list">
      @for (w of section.items; track $index) {
      <li class="flex items-center px-4 py-2.5">
        <p-skeleton
          shape="circle"
          width="1.25rem"
          height="1.25rem" />
        <p-skeleton
          height="0.85rem"
          [width]="w"
          styleClass="ms-3" />
      </li>
      }
    </ul>
  </div>
  }
</div>
