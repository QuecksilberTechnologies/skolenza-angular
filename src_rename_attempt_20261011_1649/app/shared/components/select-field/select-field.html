<p-select
  [id]="selectId()"
  [inputId]="inputId()"
  [invalid]="invalid()"
  [formControlName]="controlName()"
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [loading]="loading()"
  [showClear]="showClear()"
  [placeholder]="placeholder()"
  [appendTo]="'body'"
  class="w-full"
  (onChange)="selectionChange.emit($event)">
  <ng-template #empty>
    <div class="flex max-w-full flex-col items-center justify-center text-center text-gray-500">
      <span class="pi pi-info-circle mb-2 !text-3xl text-primary"></span>
      <div class="mb-1 text-base font-semibold">{{ emptyTitle() }}</div>
      @if (emptyDetail() || emptyActionText()) {
      <div class="text-sm">
        {{ emptyDetail() }} @if (emptyActionText()) {
        <br />
        <span class="font-medium text-primary">{{ emptyActionText() }}</span>
        {{ emptyActionSuffix() }} }
      </div>
      }
    </div>
  </ng-template>
  <ng-template #emptyfilter>
    <div class="flex items-center gap-2 text-gray-500">
      <span class="pi pi-search"></span>
      {{ emptyFilterMessage() }}
    </div>
  </ng-template>
</p-select>
