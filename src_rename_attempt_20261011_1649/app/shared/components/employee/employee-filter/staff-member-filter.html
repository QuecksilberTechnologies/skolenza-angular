<div class="flex h-full flex-col">
  <!-- Header -->
  <section class="flex items-center justify-between border-b border-zinc-200 px-4 py-3 dark:border-zinc-700">
    <div class="flex items-center justify-between gap-2">
      <span
        class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-primary-100 sm:h-10 sm:w-10 dark:bg-primary-900">
        <i class="pi pi-filter text-xl text-primary-600 sm:text-2xl dark:text-primary-300"></i>
      </span>
      <div>
        <div class="text-lg font-semibold text-gray-800 dark:text-zinc-100">StaffMember Filter</div>
        <div class="hidden text-sm text-gray-500 sm:block dark:text-zinc-400">
          Use the filters below to find specific staffMember in your team.
        </div>
      </div>
    </div>
    <p-button
      type="button"
      icon="pi pi-times"
      rounded="true"
      [variant]="'text'"
      [size]="'small'"
      [severity]="'secondary'"
      (onClick)="onCancel()" />
  </section>

  <!-- Content -->
  <section class="min-h-0 flex-1 overflow-y-auto bg-gray-50 p-4 dark:bg-zinc-900">
    <form
      [formGroup]="staffMemberFilterForm"
      class="grid grid-cols-1 gap-4">
      <!-- StaffMember Id -->
      <div class="space-y-1">
        <label
          for="staffMemberId"
          class="block font-semibold">
          StaffMember Code
        </label>
        <input
          pInputText
          appTrimInput
          id="staffMemberId"
          type="text"
          formControlName="staffMemberId"
          placeholder="Enter StaffMember Code"
          class="w-full" />
      </div>

      <!-- Employment Name -->
      <!-- <div class="space-y-1">
        <label for="status" class="font-semibold block">StaffMember Name</label>
        <input
          pInputText
          id="staffMemberName"
          type="text"
          formControlName="staffMemberName"
          placeholder="Enter StaffMember Name"
          class="w-full"
        />
      </div> -->

      <!-- StaffMember Type -->
      <div class="space-y-1">
        <label
          for="staffEmploymentType"
          class="block font-semibold">
          StaffMember Type
        </label>
        <app-select-field
          selectId="staffEmploymentType"
          controlName="staffEmploymentType"
          optionLabel="typeName"
          optionValue="id"
          placeholder="Select StaffMember Type"
          emptyDetail="There are no staffMember types configured."
          emptyActionText=""
          emptyActionSuffix=""
          emptyFilterMessage="No matching staffMember types found."
          [options]="staffEmploymentTypeOptions()"
          [loading]="isLoadingStaffEmploymentTypes()" />
      </div>

      <!-- Department -->
      <div class="space-y-1">
        <label
          for="department"
          class="block font-semibold">
          Department
        </label>
        <app-select-field
          selectId="department"
          controlName="department"
          optionLabel="departmentName"
          optionValue="id"
          placeholder="Select Department"
          [options]="departmentOptions()"
          [loading]="isLoadingDepartments()"
          (selectionChange)="onDepartmentChange($event.value)" />
      </div>

      <!-- Designation -->
      <div class="space-y-1">
        <label
          for="designation"
          class="block font-semibold">
          Designation
        </label>
        <app-select-field
          selectId="designation"
          controlName="designation"
          optionLabel="designationName"
          optionValue="id"
          placeholder="Select Designation"
          [options]="designationOptions()"
          [loading]="isLoadingDesignation()" />
      </div>

      <!-- Document Status -->
      <!-- <div class="space-y-1">

        </p-select>
      </div> -->

      </div> -->
    </form>
  </section>

  <!-- Footer -->
  <section
    class="mt-auto flex flex-col-reverse gap-2 border-t border-zinc-200 px-4 py-3 sm:flex-row sm:justify-between dark:border-zinc-700">
    <div class="w-full sm:w-auto">
      <p-button
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        [label]="isSaving() ? 'Resetting...' : 'Reset Filters'"
        [loading]="isSaving()"
        styleClass="w-full sm:w-auto justify-center"
        (onClick)="onReset()" />
    </div>

    <div class="flex w-full justify-end gap-2 sm:w-auto">
      <p-button
        label="Cancel"
        severity="secondary"
        styleClass="flex-1 sm:flex-none justify-center"
        (onClick)="onCancel()" />
      <p-button
        [label]="isSaving() ? 'Applying...' : 'Apply'"
        [loading]="isSaving()"
        [disabled]="staffMemberFilterForm.invalid || isSaving()"
        styleClass="flex-1 sm:flex-none justify-center"
        (onClick)="onApply()" />
    </div>
  </section>
</div>
