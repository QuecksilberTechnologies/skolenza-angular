<p-card styleClass="h-full dark:bg-zinc-900 dark:border-zinc-800 dark:shadow-none">
  <ng-template #header>
    <div class="flex items-center justify-between px-5 pt-5">
      <h4 class="text-xl font-semibold text-color-emphasis dark:text-zinc-100">{{ title() }}</h4>
      <div>
        <p-button
          icon="pi pi-refresh"
          [rounded]="true"
          [text]="true"
          size="small"
          [loading]="loading()"
          pTooltip="Refresh Data"
          tooltipPosition="left"
          [ariaLabel]="'Refresh ' + (title() ?? '')"
          styleClass="dark:bg-zinc-800 dark:text-gray-200 hover:dark:bg-zinc-700"
          (onClick)="refresh.emit()" />
      </div>
    </div>
  </ng-template>
  <ng-template #content>
    @if (loading() && !statistics()) {
    <div class="flex min-h-72 flex-col gap-3 dark:bg-zinc-900">
      <div class="mx-auto h-36 w-36 animate-pulse rounded-full bg-gray-100 dark:bg-zinc-800"></div>
      @for (row of skeletonRows; track row) {
      <div class="h-11 animate-pulse rounded-lg bg-gray-100 dark:bg-zinc-800"></div>
      }
    </div>
    } @else if (!statistics()) {
    <div class="flex min-h-72 items-center justify-center dark:bg-zinc-900">
      <app-table-empty-message
        icon="pi pi-users"
        message="No staffMember data"
        subMessage="Active, inactive and on-leave totals show here" />
    </div>
    } @else {
    <div class="flex min-h-72 flex-col items-center dark:bg-zinc-900">
      <!-- Donut Chart -->
      <div class="relative my-2 h-44 w-44">
        <svg
          viewBox="0 0 128 128"
          class="h-full w-full -rotate-90"
          aria-hidden="true">
          <!-- Background ring -->
          <circle
            cx="64"
            cy="64"
            r="54"
            fill="none"
            stroke-width="14"
            class="stroke-gray-100 dark:stroke-zinc-700" />
          <!-- Segments -->
          @for (seg of segments(); track seg.label) {
          <circle
            cx="64"
            cy="64"
            r="54"
            fill="none"
            stroke-width="14"
            stroke-linecap="round"
            [class]="seg.strokeClass"
            [attr.stroke-dasharray]="seg.dashArray"
            [attr.stroke-dashoffset]="seg.dashOffset" />
          }
        </svg>
        <!-- Center text -->
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-3xl font-bold text-gray-900 dark:text-zinc-100">{{ totalCount() }}</span>
          <span class="text-xs text-gray-500 dark:text-gray-400">Total</span>
        </div>
      </div>

      <!-- Legend -->
      <div class="mt-2 w-full space-y-2">
        @for (seg of segments(); track seg.label) {
        <div class="flex items-center justify-between rounded-lg bg-primary-contrast px-3 py-2.5 dark:bg-zinc-800">
          <div class="flex items-center gap-3">
            <div
              class="flex h-9 w-9 items-center justify-center rounded-lg"
              [class]="seg.bgClass">
              <lucide-angular
                [img]="seg.icon"
                size="16"
                [class]="seg.colorClass" />
            </div>
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400">{{ seg.label }}</span>
          </div>
          <div class="text-right">
            <span class="text-lg font-semibold text-gray-900 dark:text-zinc-100">{{ seg.count }}</span>
            <span class="ml-1 text-xs text-gray-400 dark:text-gray-500">{{ seg.percent }}%</span>
          </div>
        </div>
        }
      </div>
    </div>
    }
  </ng-template>
</p-card>
