<app-dashboard-card [title]="title()">
  <div class="dash-list">
    @for (occasion of occasions; track occasion.name) {
      <div class="dash-list-item">
        <img
          [src]="occasion.image"
          [alt]="occasion.name"
          class="dash-avatar" />
        <div class="flex flex-col space-y-1">
          <p class="text-base font-semibold text-color-emphasis dark:text-zinc-100">
            {{ occasion.name }}
          </p>
          <p class="text-xs text-gray-600 dark:text-gray-300">
            <i class="pi pi-clock mr-2 !text-xs text-gray-400 dark:text-gray-500"></i>
            {{ occasion.date }} :
            {{ occasion.time }}
          </p>
          <p class="text-xs text-gray-600 dark:text-gray-300">
            <i class="pi pi-map-marker mr-2 !text-xs text-gray-400 dark:text-gray-500"></i>
            {{ occasion.location }}
          </p>
          <p class="text-xs text-gray-600 dark:text-gray-300">
            <i class="pi pi-tag mr-2 !text-xs text-gray-400 dark:text-gray-500"></i>
            {{ occasion.attire }}
          </p>
        </div>
      </div>
    }
  </div>
</app-dashboard-card>
