<app-dashboard-card [title]="title()">
  <p-table
    #projectTable
    [showLoader]="false"
    [value]="projects">
    <ng-template #header>
      <tr>
        <th>Item</th>
        <th>Budget</th>
        <th>Progress</th>
        <th>Status</th>
        <th>View</th>
      </tr>
    </ng-template>
    <ng-template
      #body
      let-project>
      <tr>
        <td>
          <div class="flex w-full justify-start">
            <div class="flex w-full">
              <img
                [src]="'images/teams/' + project.item.image"
                [alt]="project.item.name"
                class="h-12 w-12 rounded-lg object-cover shadow-sm"
                (error)="onImageError($event, project.item.name)" />
              <div>
                <h4 class="text-base font-medium">{{ project.item.name }}</h4>
                <p class="text-sm text-muted-color">{{ project.item.user }}</p>
              </div>
            </div>
          </div>
        </td>
        <td>{{ project.budget }}</td>
        <td>
          <div class="flex items-center justify-center gap-2">
            @if (project.progress.trend === 'up') {
              <i
                class="pi pi-caret-up text-green-600"
                style="font-size: 1rem"></i>
            } @else {
              <i
                class="pi pi-sort-down text-red-600"
                style="font-size: 1rem"></i>
            }
            {{ project.progress.value }}
          </div>
        </td>
        <td>
          @switch (project.status) {
            @case ('active') {
              <p-tag
                [severity]="'info'"
                [value]="'In Process'" />
            }
            @case ('on-hold') {
              <p-tag
                [severity]="'warn'"
                [value]="'On Hold'" />
            }
            @case ('completed') {
              <p-tag
                [severity]="'success'"
                [value]="'Completed'" />
            }
          }
        </td>
        <td>
          <p-button
            icon="pi pi-arrow-right"
            [rounded]="true"
            severity="secondary" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</app-dashboard-card>
