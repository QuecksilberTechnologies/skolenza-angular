<div class="flex flex-wrap gap-4 md:gap-4">
  @for (item of [0, 1, 2, 3]; track item) {
  <p-card
    class="h-[7.4rem] max-w-full min-w-[180px] flex-1 overflow-hidden rounded-xl border-0 shadow sm:max-w-[calc(50%-0.5rem)] md:max-w-none">
    <div class="relative z-10 flex items-center gap-4 p-2">
      <p-skeleton
        shape="circle"
        width="39px"
        height="39px"
        class="!rounded-xl" />
      <div class="flex flex-1 flex-col">
        <p-skeleton
          width="48px"
          height="33px"
          class="mb-2"
          style="border-radius: 8px" />
        <p-skeleton
          width="80px"
          height="10px"
          style="border-radius: 8px" />
      </div>
    </div>
  </p-card>
  }
</div>
