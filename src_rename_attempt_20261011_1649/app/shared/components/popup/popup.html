<button
  type="button"
  class="absolute top-2 right-2 z-10 inline-flex h-7 w-7 items-center justify-center rounded-full text-zinc-500 transition-colors hover:bg-zinc-100 hover:text-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-700 dark:hover:text-zinc-100"
  [attr.aria-label]="closeAriaLabel()"
  (click)="hide()">
  <i
    class="pi pi-times text-xs"
    aria-hidden="true"></i>
</button>
<div [class]="contentClass()">
  <ng-content />
</div>
