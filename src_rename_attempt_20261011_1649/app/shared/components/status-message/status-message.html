<!--
  One `gap-4` column: the projected action is a flex child, so a caller that projects nothing gets
  no trailing gap. Geometry matches `table-empty-message` so the two read as one family; the error
  palette is the one from `pricing.html` - `red-600` is 4.83:1 on white, `red-400` 6.40:1 on
  zinc-900. The empty halo carries a dark-theme ring: `zinc-800` alone vanishes on a page ground
  of the same shade, and dark surfaces are separated by borders, not fills.
-->
<div class="flex flex-col items-center gap-4 text-center">
  <div
    class="flex h-16 w-16 items-center justify-center rounded-full"
    [class]="
      severity() === 'error'
        ? 'bg-red-50 dark:bg-red-950'
        : 'bg-primary-50 dark:bg-zinc-800 dark:ring-1 dark:ring-zinc-700'
    ">
    <i
      [class]="
        icon() +
        ' text-3xl! ' +
        (severity() === 'error'
          ? 'text-red-600 dark:text-red-400'
          : 'text-primary dark:text-primary-400')
      "
      aria-hidden="true"></i>
  </div>
  <div>
    @if (headingLevel() === 1) {
    <h1 [class]="headingClass">{{ message() }}</h1>
    } @else {
    <h3 [class]="headingClass">{{ message() }}</h3>
    }
    @if (subMessage(); as sub) {
    <p class="text-sm text-gray-500 dark:text-zinc-400">{{ sub }}</p>
    }
  </div>
  <ng-content />
</div>
