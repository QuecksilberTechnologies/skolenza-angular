<section class="flex flex-col items-center justify-center gap-4">
  <div>
    @if (isProfilePicLoading()) {
    <p-blockui
      [target]="pnl"
      [blocked]="isProfilePicLoading()" />
    <p-panel
      #pnl
      class="relative flex h-24 w-24 flex-col items-center justify-center">
      <span class="absolute inset-0 top-0 right-0 bottom-0 left-0 flex flex-col items-center justify-center gap-2">
        <p-progress-spinner
          strokeWidth="3"
          fill="transparent"
          animationDuration=".5s"
          class="h-8! w-8!" />
        <div class="text-sm text-gray-700 dark:text-zinc-100">Loading...</div>
      </span>
    </p-panel>
    } @else { @let profileImg = profileImage(); @let filePath = profileImg?.filePath || '';

    <div class="group relative h-24 w-24">
      <!-- Profile Pic -->
      @if (filePath) {
      <img
        [src]="filePath"
        alt="profile"
        class="h-full w-full rounded-lg border border-gray-200 bg-gray-100 object-cover p-0.5 dark:border-zinc-600 dark:bg-zinc-800" />
      } @else {
      <div
        [appAvatarColor]="staffMemberName()"
        class="flex h-full w-full items-center justify-center rounded-lg border border-gray-200 bg-gray-100 p-0.5 text-4xl text-white! dark:border-zinc-600 dark:bg-zinc-800"></div>
      }

      <!-- Edit and Delete Pic -->
      <div
        class="absolute inset-0 flex items-center justify-center gap-2 rounded-lg bg-black/40 opacity-0 transition-opacity duration-300 group-hover:opacity-100">
        <p-button
          icon="pi pi-pencil"
          [rounded]="true"
          [size]="'small'"
          severity="secondary"
          (click)="fileInputs.click()" />
        @if (profileImg?.filePath) {
        <p-button
          icon="pi pi-trash"
          [rounded]="true"
          [size]="'small'"
          severity="danger"
          (click)="removeImage(profileImg!)" />
        }
      </div>
    </div>

    <!-- Hidden file input -->
    <input
      type="file"
      accept="image/*"
      (change)="onFileSelected($event, profileImg!)"
      #fileInputs
      style="display: none" />
    }
  </div>
</section>
