<!--
  Sub-header navigation component.

  - Displays either a breadcrumb or a page header (icon, title, description) based on isBreadcrumbShow().
  - Accepts projected content via <ng-content> for additional actions or controls.
  - Responsive and styled for light/dark themes.
-->
<nav
  class="flex min-h-[50px] flex-wrap items-center justify-between gap-4 border-b border-gray-200 bg-white px-5 py-2.5 lg:sticky lg:top-[55px] lg:z-10 dark:border-zinc-700 dark:bg-zinc-900">
  @if (isBreadcrumbShow()) {
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2.5 overflow-hidden">
      @let pageIco = pageIcon(); @if (pageIco) {
      <i [class]="`${pageIco} !font-semibold text-gray-700 dark:text-zinc-100`"></i>
      }
      <h4 class="text-lg font-bold whitespace-nowrap text-gray-900 dark:text-zinc-100">{{ pageTitle() }}</h4>
    </div>

    <div class="flex items-center gap-1">
      <p-breadcrumb
        styleClass="!p-0 text-sm"
        [model]="breadcrumbItems()" />
      <p class="text-gray-500 dark:text-zinc-400">
        <ng-content select="left-action" />
      </p>
    </div>
  </div>
  } @if (!isBreadcrumbShow()) {
  <div class="flex items-center gap-2.5 overflow-hidden">
    @let pageIco = pageIcon(); @if (pageIco) {
    <i [class]="`${pageIco} !font-semibold text-gray-700 dark:text-zinc-100`"></i>
    }
    <h4 class="text-lg font-bold whitespace-nowrap text-gray-900 dark:text-zinc-100">{{ pageTitle() }}</h4>
    <p class="hidden overflow-hidden text-ellipsis whitespace-nowrap text-gray-500 md:block dark:text-zinc-400">
      {{ pageDescription() }}
    </p>
  </div>
  }

  <div class="flex flex-grow flex-wrap justify-end gap-3 sm:flex-grow-0 sm:flex-nowrap">
    <ng-content />
  </div>
</nav>
