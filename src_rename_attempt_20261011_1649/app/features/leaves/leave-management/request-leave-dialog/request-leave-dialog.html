<section class="max-h-[calc(100vh-16rem)] overflow-y-auto">
  <form
    [formGroup]="leaveRequestForm"
    (ngSubmit)="onSubmit()"
    class="grid grid-cols-1 gap-4">
    <!-- Leave Type -->
    <div class="space-y-1">
      <label
        for="leaveType"
        class="block font-semibold">
        Leave Type
        <span
          class="text-red-600 dark:text-red-400"
          aria-hidden="true">
          *
        </span>
      </label>
      <p-select
        id="leaveType"
        formControlName="leaveType"
        [invalid]="isInvalid('leaveType')"
        [options]="leaveTypeCards()"
        optionLabel="name"
        optionValue="id"
        placeholder="e.g. Sick Leave"
        [appendTo]="'body'"
        class="w-full" />
    </div>

    <!-- Dates -->
    <div class="grid gap-4 md:grid-cols-2">
      <!-- Start Date -->
      <div class="space-y-1">
        <label
          for="startDate"
          class="block font-semibold">
          Start Date
          <span
            class="text-red-600 dark:text-red-400"
            aria-hidden="true">
            *
          </span>
        </label>
        <p-datepicker
          id="startDate"
          formControlName="startDate"
          [invalid]="isInvalid('startDate')"
          placeholder="Select date"
          inputStyleClass="w-full"
          class="w-full"
          appendTo="body" />
      </div>

      <!-- End Date -->
      <div class="space-y-1">
        <label
          for="endDate"
          class="block font-semibold">
          End Date
          <span
            class="text-red-600 dark:text-red-400"
            aria-hidden="true">
            *
          </span>
        </label>
        <p-datepicker
          id="endDate"
          formControlName="endDate"
          [invalid]="isInvalid('endDate')"
          placeholder="Select date"
          inputStyleClass="w-full"
          class="w-full"
          appendTo="body" />
      </div>
    </div>

    <!-- Duration -->
    <div class="space-y-1">
      <label
        for="duration"
        class="block font-semibold">
        Duration
        <span
          class="text-red-600 dark:text-red-400"
          aria-hidden="true">
          *
        </span>
      </label>
      <p-select
        id="duration"
        formControlName="duration"
        [invalid]="isInvalid('duration')"
        [options]="leaveDurations()"
        optionLabel="name"
        optionValue="value"
        placeholder="e.g. Full Day"
        [appendTo]="'body'"
        class="w-full">
        <ng-template
          #selectedItem
          let-selectedOption>
          @if (selectedOption) {
          <div class="flex items-center gap-2">
            <lucide-angular
              [img]="selectedOption.icon"
              size="16" />
            <div>{{ selectedOption.name }}</div>
          </div>
          }
        </ng-template>
        <ng-template
          let-duration
          #item>
          <div class="flex items-center gap-2">
            <lucide-angular
              [img]="duration.icon"
              size="16" />
            <div>{{ duration.name }}</div>
          </div>
        </ng-template>
      </p-select>
    </div>

    <!-- Reason -->
    <div class="space-y-1">
      <label
        for="reason"
        class="block font-semibold">
        Reason
        <span
          class="text-red-600 dark:text-red-400"
          aria-hidden="true">
          *
        </span>
      </label>
      <textarea
        pTextarea
        formControlName="reason"
        [invalid]="isInvalid('reason')"
        id="reason"
        placeholder="e.g. Medical leave due to illness"
        class="w-full"></textarea>
    </div>

    <!-- Document -->
    <div class="space-y-1">
      <label
        for="document"
        class="block font-semibold">
        Document
      </label>
      <textarea
        pTextarea
        formControlName="document"
        [invalid]="isInvalid('document')"
        id="document"
        placeholder="e.g. Doctor's note"
        class="w-full"></textarea>
    </div>
    @if (hasDateRangeError && leaveRequestForm.get('endDate')?.touched) {
    <p-message
      severity="error"
      text="End date must be on or after start date." />
    } @if (balanceError(); as err) {
    <p-message
      severity="error"
      [text]="err" />
    }

    <div class="mt-6 flex justify-end gap-2">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        (onClick)="onCancel()" />
      <p-button
        type="submit"
        label="Submit request"
        [loading]="isSaving()"
        [disabled]="leaveRequestForm.invalid || isSaving()" />
    </div>
  </form>
</section>
