<section class="flex flex-col gap-4 p-4 pb-6">
  <app-host-kpi-cards
    [kpis]="kpiCards()"
    [loading]="store.isLoading()" />

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    <app-host-bar-list-card
      cardTitle="Institution status"
      [subtitle]="institutionStatusSubtitle()"
      [groups]="store.institutionStatusGroups()"
      [loading]="store.isLoading()"
      emptyMessage="No institutions yet" />
    <app-host-donut-card
      cardTitle="Institutions by country"
      subtitle="Top 6 countries, remainder grouped as Other"
      [data]="countryDonutData()"
      [options]="countryDonutOptions()"
      [legend]="countryLegend()"
      [centerValue]="countryTotal()"
      centerLabel="institutions"
      [hasData]="countryLegend().length > 0"
      [loading]="store.isLoading()"
      emptyMessage="No institutions yet" />
    <app-host-list-card
      cardTitle="Recent institutions"
      subtitle="Most recently returned institutions"
      [items]="recentInstitutionItems()"
      [loading]="store.isLoading()"
      emptyMessage="No institutions yet" />
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <app-host-chart-card
      cardTitle="Plan pricing ladder"
      [subtitle]="ladderSubtitle()"
      type="bar"
      [data]="ladderData()"
      [options]="ladderOptions()"
      [summary]="ladderSummary()"
      [hasData]="store.planLadder().labels.length > 0"
      [loading]="store.isLoading()"
      emptyMessage="No active plans in the catalog" />
    <app-host-list-card
      cardTitle="Plan catalog"
      [subtitle]="planCatalogSubtitle()"
      [items]="planCatalogItems()"
      [loading]="store.isLoading()"
      emptyMessage="No active plans in the catalog" />
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    <app-host-chart-card
      cardTitle="Host users by role"
      subtitle="Includes roles with no users assigned"
      type="bar"
      [data]="roleChartData()"
      [options]="countOptions()"
      [summary]="roleSummary()"
      [hasData]="store.hostUsersByRole().labels.length > 0"
      [loading]="store.isLoading()"
      emptyMessage="No host roles yet" />
    <app-host-chart-card
      cardTitle="Host user signups"
      subtitle="New host users per month, last 6 months"
      type="line"
      [data]="signupChartData()"
      [options]="countOptions()"
      [summary]="signupSummary()"
      [hasData]="store.hostUsers().length > 0"
      [loading]="store.isLoading()"
      emptyMessage="No host users yet" />
    <app-host-list-card
      cardTitle="Recent host activity"
      subtitle="Latest host user and role changes"
      [items]="activityItems()"
      [loading]="store.isLoading()"
      emptyMessage="No host activity yet" />
  </div>

  <!-- Appended below the grids, never inserted above them: an alert that pushes loaded content
       down is itself a layout shift. The failure is announced through the global toaster. -->
  @if (store.hasLoadErrors()) {
  <div
    role="alert"
    class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900 dark:border-amber-700/50 dark:bg-amber-900/20 dark:text-amber-200">
    <span>Some data could not be loaded: {{ store.failedSources().join(', ') }}.</span>
    <p-button
      label="Retry"
      icon="pi pi-refresh"
      size="small"
      [text]="true"
      (onClick)="reload()" />
  </div>
  }
</section>
