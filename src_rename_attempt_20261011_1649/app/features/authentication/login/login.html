<app-auth-card
  heading="Welcome Back!"
  subheading="Please sign in to access your account."
  [logoLink]="null">
  <form
    (submit)="login(); $event.preventDefault()"
    class="grid grid-cols-1 gap-4">
    <div class="space-y-1">
      <label
        for="txtEmail"
        class="block font-medium text-zinc-700 dark:text-zinc-200">
        Email
      </label>
      <p-iconfield>
        <p-inputicon class="pi pi-user text-zinc-400 dark:text-zinc-500" />
        <input
          [formField]="f.email"
          appTrimInput
          pInputText
          id="txtEmail"
          type="text"
          autocomplete="username"
          placeholder="e.g. user@example.com"
          class="w-full border border-zinc-300 bg-white text-zinc-900 placeholder-zinc-400 focus:border-primary dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder-zinc-500 focus:dark:border-primary" />
      </p-iconfield>
      @if (f.email().touched() && f.email().errors().length) {
        <p-message
          severity="error"
          size="small"
          variant="simple">
          <span>{{ f.email().errors()[0].message }}</span>
        </p-message>
      }
    </div>

    <div class="space-y-1">
      <label
        for="txtPassword"
        class="block font-medium text-zinc-700 dark:text-zinc-200">
        Password
      </label>
      <p-iconfield>
        <p-inputicon class="pi pi-lock text-zinc-400 dark:text-zinc-500" />
        <p-password
          [formField]="$any(f.password)"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="current-password"
          inputId="txtPassword"
          inputStyleClass="w-full"
          class="w-full"
          placeholder="Enter your password" />
      </p-iconfield>
      @if (f.password().touched() && f.password().errors().length) {
        <p-message
          severity="error"
          size="small"
          variant="simple">
          <span>{{ f.password().errors()[0].message }}</span>
        </p-message>
      }
    </div>

    <div class="mb-3 flex w-full items-center justify-end">
      <a
        [routerLink]="['/auth/forgot-password']"
        class="rounded-sm text-primary-600 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 dark:text-primary-300">
        Forgot Password?
      </a>
    </div>

    <p-button
      type="submit"
      label="Login"
      [loading]="isSaving()"
      [disabled]="f().invalid() || isSaving()"
      [fluid]="true" />

    <div class="w-full text-center">
      <p class="text-zinc-700 dark:text-zinc-200">
        Don't have an account?
        <a
          id="btnCreateAccount"
          [routerLink]="['/auth/plan']"
          class="rounded-sm text-primary-600 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 dark:text-primary-300">
          Create an account
        </a>
      </p>
    </div>
  </form>
</app-auth-card>
