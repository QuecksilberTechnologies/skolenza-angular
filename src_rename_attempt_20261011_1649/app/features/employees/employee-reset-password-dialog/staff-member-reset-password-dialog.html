<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <p class="text-sm text-zinc-600 dark:text-zinc-400">
    Set a new password for
    <strong class="font-medium">{{ staffMemberName }}</strong>
    ({{ staffMember.officialEmail }}).
  </p>

  <app-form-password
    label="New Password"
    inputId="newPassword"
    icon="pi pi-lock"
    placeholder="8 to 20 characters"
    autocomplete="new-password"
    required
    [field]="f.newPassword"
    [submitted]="submitted()" />

  <app-form-password
    label="Confirm Password"
    inputId="confirmPassword"
    icon="pi pi-lock"
    placeholder="Re-enter the new password"
    autocomplete="new-password"
    required
    [field]="f.confirmPassword"
    [submitted]="submitted()" />

  <div class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
    <p-button
      type="button"
      label="Cancel"
      variant="text"
      severity="secondary"
      (onClick)="onCancel()" />
    <p-button
      type="submit"
      [label]="isSaving() ? 'Resetting...' : 'Reset Password'"
      icon="pi pi-key"
      [loading]="isSaving()"
      [disabled]="isSaving()" />
  </div>
</form>
