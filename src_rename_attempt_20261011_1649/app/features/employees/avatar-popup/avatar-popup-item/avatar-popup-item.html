<div
  class="-mx-2 flex items-center justify-between gap-2 rounded-md px-2 py-1.5 transition-colors hover:bg-gray-50 dark:hover:bg-zinc-800/60">
  <div class="flex min-w-0 shrink-0 items-center gap-2">
    <lucide-angular
      [img]="icon()"
      size="14"
      class="inline-block shrink-0 text-gray-400 dark:text-zinc-500" />
    <span
      class="text-[13px] whitespace-nowrap text-gray-500 dark:text-zinc-400"
      [pTooltip]="label()"
      tooltipPosition="bottom"
      showDelay="500">
      {{ label() }}
    </span>
  </div>
  <span
    class="truncate text-right text-[13px] font-medium text-gray-800 dark:text-zinc-200"
    [pTooltip]="(value() || '-')?.toString()"
    tooltipPosition="bottom"
    showDelay="500">
    <ng-content>{{ value() || '-' }}</ng-content>
  </span>
</div>
