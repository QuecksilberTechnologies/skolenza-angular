<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex h-full min-h-0 w-full flex-col">
  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-1 pt-1 pb-4">
    <app-form-text
      label="Stage name"
      inputId="stageName"
      placeholder="e.g. HR Review"
      required
      [field]="f.stageName" />

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-form-select
        label="Category"
        inputId="policyCategoryId"
        placeholder="Every category"
        hint="Leave empty for a stage that applies to every policy category."
        [showClear]="true"
        optionLabel="name"
        optionValue="id"
        [options]="categories"
        [field]="f.policyCategoryId" />

      <app-form-select
        label="Approver role"
        inputId="approverRoleId"
        placeholder="Select a role"
        required
        filter
        optionLabel="roleName"
        optionValue="id"
        [options]="roles"
        [field]="f.approverRoleId" />
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-form-number
        label="Stage order"
        inputId="stageOrder"
        placeholder="e.g. 1"
        hint="Stages run in ascending order."
        required
        [min]="1"
        [field]="f.stageOrder" />

      <app-form-number
        label="Minimum approvals"
        inputId="minimumApprovals"
        placeholder="e.g. 2"
        hint="How many approvers of that role must sign off."
        required
        [min]="1"
        [field]="f.minimumApprovals" />
    </div>

    <app-form-switch
      label="Mandatory"
      inputId="isMandatory"
      hint="A mandatory stage cannot be skipped on the way to publish."
      [field]="f.isMandatory" />

    @if (isEditing) {
      <app-form-switch
        label="Active"
        inputId="isActive"
        hint="An inactive stage no longer gates new submissions."
        [field]="f.isActive" />
    }
  </div>

  <app-form-action-bar
    dialog
    [submitLabel]="isEditing ? 'Save Changes' : 'Add Stage'"
    [saving]="isSaving()"
    (cancelled)="onCancel()" />
</form>
