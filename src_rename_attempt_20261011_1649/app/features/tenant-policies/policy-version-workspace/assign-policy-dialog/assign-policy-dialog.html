<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex h-full min-h-0 w-full flex-col">
  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-1 pt-1 pb-4">
    <app-form-multiselect
      label="StaffMembers"
      inputId="staffMemberIds"
      placeholder="Select staffMembers"
      required
      optionLabel="fullName"
      optionValue="staffMemberId"
      [options]="staffMemberOptions()"
      [loading]="isLoadingStaffMembers()"
      [field]="f.staffMemberIds" />

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-form-date
        label="Effective from"
        inputId="effectiveFrom"
        placeholder="Select a date"
        required
        [field]="f.effectiveFrom" />

      <app-form-date
        label="Effective to"
        inputId="effectiveTo"
        placeholder="Leave empty for open ended"
        hint="Leave empty to keep the assignment open ended."
        [field]="f.effectiveTo" />
    </div>

    <app-form-switch
      label="Mandatory"
      inputId="isMandatory"
      hint="Mandatory assignments must be acknowledged by the staffMember."
      [field]="f.isMandatory" />
  </div>

  <app-form-action-bar
    dialog
    submitLabel="Assign"
    submitIcon="pi pi-user-plus"
    savingLabel="Assigning..."
    [saving]="isSaving()"
    (cancelled)="onCancel()" />
</form>
