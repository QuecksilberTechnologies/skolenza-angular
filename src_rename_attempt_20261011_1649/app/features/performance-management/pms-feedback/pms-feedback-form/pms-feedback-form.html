<form
  class="p-1 sm:p-2"
  (submit)="$event.preventDefault(); save()"
  novalidate>
  <div class="grid grid-cols-1 gap-4">
    <div>
      <label
        for="fb-to"
        class="mb-1 block text-sm font-medium">
        To
        <span
          class="text-red-600 dark:text-red-400"
          aria-hidden="true">
          *
        </span>
      </label>
      <input
        id="fb-to"
        pInputText
        class="w-full"
        placeholder="Recipient name"
        [formField]="f.toName"
        autocomplete="off" />
      @if (f.toName().touched() && f.toName().invalid()) {
      <small class="mt-1 block text-red-500">{{ f.toName().errors()[0]?.message }}</small>
      }
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label
          for="fb-type"
          class="mb-1 block text-sm font-medium">
          Type
        </label>
        <p-select
          inputId="fb-type"
          class="w-full"
          [options]="typeOptions"
          [appendTo]="'body'"
          [formField]="$any(f.type)" />
      </div>
      <div>
        <label
          for="fb-visibility"
          class="mb-1 block text-sm font-medium">
          Visibility
        </label>
        <p-select
          inputId="fb-visibility"
          class="w-full"
          [options]="visibilityOptions"
          [appendTo]="'body'"
          [formField]="$any(f.visibility)" />
      </div>
    </div>

    <div>
      <label
        for="fb-message"
        class="mb-1 block text-sm font-medium">
        Message
        <span
          class="text-red-600 dark:text-red-400"
          aria-hidden="true">
          *
        </span>
      </label>
      <textarea
        id="fb-message"
        rows="4"
        class="p-inputtext w-full"
        placeholder="Share appreciation or a suggestion"
        [formField]="f.message"></textarea>
      @if (f.message().touched() && f.message().invalid()) {
      <small class="mt-1 block text-red-500">{{ f.message().errors()[0]?.message }}</small>
      }
    </div>
  </div>

  <div class="mt-5 flex justify-end gap-2">
    <p-button
      type="button"
      label="Cancel"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()" />
    <p-button
      type="submit"
      label="Send Feedback"
      icon="pi pi-send"
      [loading]="isSaving()" />
  </div>
</form>
