<p-card class="block rounded-xl border-0 bg-white shadow dark:bg-zinc-900">
  @if (!isHr()) {
  <p class="mb-3 text-sm text-gray-500 dark:text-zinc-400">
    <i
      class="pi pi-info-circle mr-1"
      aria-hidden="true"></i>
    Showing your performance history.
  </p>
  }

  <!-- Filters -->
  <div class="mb-5 flex flex-wrap items-center gap-3">
    <p-select
      [options]="store.staffMembers()"
      optionLabel="label"
      optionValue="value"
      placeholder="All staffMembers"
      [showClear]="true"
      [ngModel]="selectedStaffMember()"
      (ngModelChange)="onStaffMemberChange($event)"
      styleClass="w-52"
      ariaLabel="Filter by staffMember" />
    <p-select
      [options]="typeOptions"
      placeholder="All types"
      [showClear]="true"
      [ngModel]="selectedType()"
      (ngModelChange)="onTypeChange($event)"
      styleClass="w-44"
      ariaLabel="Filter by event type" />
  </div>

  @if (store.isLoading()) {
  <app-table-loader />
  } @else if (!store.filteredEvents().length) {
  <app-table-empty-message
    icon="pi pi-history"
    message="No history yet"
    subMessage="Reviews, promotions, achievements, and awards will appear here." />
  } @else {
  <app-pms-timeline [events]="store.filteredEvents()" />
  }
</p-card>
