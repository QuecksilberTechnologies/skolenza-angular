<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex h-full min-h-0 w-full flex-col">
  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-1 pt-1 pb-4">
    <p class="text-sm text-gray-600 dark:text-zinc-300">
      Move {{ deviceName }} to another of your locations.
      @if (currentLocationName) {
        <span>It is at {{ currentLocationName }} today.</span>
      }
    </p>

    <app-form-select
      label="New location"
      inputId="campusId"
      placeholder="Select location"
      hint="StaffMember enrollments on this device are not moved, disabled or rechecked. Review them after the move."
      required
      filter
      filterBy="locationName"
      optionLabel="locationName"
      optionValue="id"
      emptyTitle="No other active locations"
      emptyDetail="This device is already at your only active location."
      [options]="locations()"
      [loading]="isLoadingLocations()"
      [submitted]="submitted()"
      [field]="f.campusId" />
  </div>

  <app-form-action-bar
    dialog
    submitLabel="Move device"
    submitIcon="pi pi-arrow-right-arrow-left"
    savingLabel="Moving..."
    [saving]="isSaving()"
    (cancelled)="onCancel()" />
</form>
