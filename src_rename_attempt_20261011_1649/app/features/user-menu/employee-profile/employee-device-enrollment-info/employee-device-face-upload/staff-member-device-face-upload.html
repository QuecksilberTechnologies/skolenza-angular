<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <p class="text-sm text-gray-500 dark:text-zinc-400">
    Queue a face image for this staffMember on {{ deviceName }}. The device picks it up on its next
    heartbeat. JPEG or PNG, 2 MB or smaller.
  </p>

  <div class="space-y-1">
    <label
      for="faceImage"
      class="block font-medium">
      Face image
      <span class="text-red-600 dark:text-red-400">*</span>
    </label>
    <input
      id="faceImage"
      type="file"
      accept="image/jpeg,image/png"
      class="border-surface-300 dark:border-surface-600 w-full rounded-md border p-2 text-sm"
      aria-describedby="faceImage-help"
      (change)="onFileChange($event)" />
    <div
      id="faceImage-help"
      class="min-h-5"
      aria-live="polite">
      @if (error()) {
        <p-message
          severity="error"
          size="small"
          variant="simple">
          <span>{{ error() }}</span>
        </p-message>
      }
    </div>
  </div>

  @if (previewUrl(); as preview) {
    <div class="flex items-center gap-3">
      <img
        [src]="preview"
        [alt]="'Preview of ' + fileName()"
        class="border-surface-200 dark:border-surface-700 h-24 w-24 rounded-md border object-cover" />
      <span class="truncate text-sm text-gray-500 dark:text-zinc-400">{{ fileName() }}</span>
    </div>
  }

  <div class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
    <p-button
      type="button"
      label="Cancel"
      [variant]="'text'"
      [severity]="'secondary'"
      (onClick)="onCancel()" />
    <p-button
      type="submit"
      label="Upload face"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="!canSubmit()" />
  </div>
</form>
