<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <app-form-select
      class="md:col-span-2"
      inputId="staffMemberId"
      label="StaffMember"
      required
      placeholder="Select staffMember"
      optionLabel="fullName"
      optionValue="staffMemberId"
      filter
      filterBy="fullName"
      panelStyleClass="select-option-truncate"
      [options]="staffMembers.options()"
      [loading]="staffMembers.isLoading()"
      [submitted]="submitted()"
      [field]="f.staffMemberId" />

    <app-form-select
      class="md:col-span-2"
      inputId="campusId"
      label="Location"
      required
      placeholder="Select location"
      optionLabel="locationName"
      optionValue="id"
      filter
      filterBy="locationName"
      panelStyleClass="select-option-truncate"
      [options]="locations()"
      [loading]="isLoadingLocations()"
      [submitted]="submitted()"
      [field]="f.campusId" />

    <app-form-date
      inputId="effectiveFrom"
      label="Effective from"
      required
      placeholder="dd/mm/yyyy"
      [submitted]="submitted()"
      [field]="f.effectiveFrom" />

    <app-form-date
      inputId="effectiveTo"
      label="Effective to"
      placeholder="dd/mm/yyyy"
      hint="Leave empty for an open-ended assignment"
      hintIcon
      [submitted]="submitted()"
      [field]="f.effectiveTo" />

    <app-form-switch
      inputId="isPrimary"
      label="Primary location"
      hint="The staffMember's default work location"
      [field]="f.isPrimary" />

    <app-form-switch
      inputId="isAttendanceAllowed"
      label="Attendance allowed"
      hint="Attendance may be marked from this location"
      [field]="f.isAttendanceAllowed" />

    <app-form-switch
      class="md:col-span-2"
      inputId="isActive"
      label="Active"
      hint="Inactive assignments stop granting access"
      [field]="f.isActive" />
  </div>

  <app-form-action-bar
    dialog
    [submitLabel]="isEditMode ? 'Save changes' : 'Add assignment'"
    [saving]="isSaving()"
    [disabled]="isBusy()"
    [errorMessage]="submitted() && f().invalid() ? 'Fix the highlighted fields before saving.' : ''"
    (cancelled)="onCancel()" />
</form>
