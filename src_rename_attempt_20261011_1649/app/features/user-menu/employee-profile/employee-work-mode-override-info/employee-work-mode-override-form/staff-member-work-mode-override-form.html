<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <app-form-select
      class="md:col-span-2"
      inputId="staffMemberId"
      label="StaffMember"
      required
      placeholder="Select staffMember"
      optionLabel="fullName"
      optionValue="staffMemberId"
      filter
      filterBy="fullName"
      panelStyleClass="select-option-truncate"
      [options]="staffMembers.options()"
      [loading]="staffMembers.isLoading()"
      [submitted]="submitted()"
      [field]="f.staffMemberId"
      (selectionChange)="onStaffMemberChange()" />

    <app-form-select
      inputId="requestedWorkMode"
      label="Requested work mode"
      required
      placeholder="Select work mode"
      optionLabel="label"
      optionValue="id"
      [options]="workModeOptions"
      [submitted]="submitted()"
      [field]="f.requestedWorkMode"
      (selectionChange)="onWorkModeChange()" />

    <app-form-select
      inputId="staffMemberWorkArrangementId"
      label="Work arrangement"
      placeholder="Select arrangement"
      optionLabel="attendancePolicyName"
      optionValue="id"
      showClear
      hint="Optional. Leave empty for a standalone override."
      [options]="arrangements()"
      [loading]="isLoadingArrangements()"
      [submitted]="submitted()"
      [field]="f.staffMemberWorkArrangementId" />

    <app-form-date
      inputId="fromDate"
      label="From date"
      required
      placeholder="dd/mm/yyyy"
      [submitted]="submitted()"
      [field]="f.fromDate" />

    <app-form-date
      inputId="toDate"
      label="To date"
      required
      placeholder="dd/mm/yyyy"
      [submitted]="submitted()"
      [field]="f.toDate" />

    <app-form-select
      class="md:col-span-2"
      inputId="campusId"
      label="Location"
      placeholder="Select location"
      optionLabel="locationName"
      optionValue="id"
      filter
      filterBy="locationName"
      showClear
      [required]="isLocationRequired()"
      [options]="locations()"
      [loading]="isLoadingLocations()"
      [submitted]="submitted()"
      [field]="f.campusId" />

    <app-form-textarea
      class="md:col-span-2"
      inputId="reason"
      label="Reason"
      placeholder="Why the usual work mode does not apply"
      [maxlength]="500"
      [submitted]="submitted()"
      [field]="f.reason" />

    <app-form-switch
      class="md:col-span-2"
      inputId="isActive"
      label="Active"
      hint="Inactive overrides stop applying"
      [field]="f.isActive" />
  </div>

  <div class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
    @if (submitted() && f().invalid()) {
      <p class="mr-auto text-sm text-red-500 dark:text-red-400">
        Fix the highlighted fields before saving.
      </p>
    }
    <p-button
      type="button"
      label="Cancel"
      [variant]="'text'"
      [severity]="'secondary'"
      (onClick)="onCancel()" />
    <p-button
      type="submit"
      [label]="isEditMode ? 'Save changes' : 'Add override'"
      icon="pi pi-check"
      [loading]="isSaving() || isLoadingRecord()"
      [disabled]="isSaving() || isLoadingRecord()" />
  </div>
</form>
