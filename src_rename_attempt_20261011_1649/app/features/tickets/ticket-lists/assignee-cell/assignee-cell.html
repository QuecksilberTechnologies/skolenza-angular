<button
  type="button"
  class="group inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs font-medium transition-colors hover:cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
  [class.border-primary-100]="ticket().assignedTo"
  [class.dark:border-primary-700]="ticket().assignedTo"
  [class.bg-primary-50]="ticket().assignedTo"
  [class.dark:bg-primary-900/30]="ticket().assignedTo"
  [class.text-primary-700]="ticket().assignedTo"
  [class.dark:text-primary-200]="ticket().assignedTo"
  [class.hover:bg-primary-100]="ticket().assignedTo"
  [class.dark:hover:bg-primary-900/50]="ticket().assignedTo"
  [class.border-dashed]="!ticket().assignedTo"
  [class.border-gray-300]="!ticket().assignedTo"
  [class.dark:border-zinc-600]="!ticket().assignedTo"
  [class.text-gray-500]="!ticket().assignedTo"
  [class.dark:text-zinc-400]="!ticket().assignedTo"
  [class.hover:bg-gray-50]="!ticket().assignedTo"
  [class.dark:hover:bg-zinc-800]="!ticket().assignedTo"
  ngMenuTrigger
  #trigger="ngMenuTrigger"
  [menu]="menuRef()"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [attr.aria-label]="
    ticket().assignedTo ? 'Change assignee: ' + ticket().assignedTo : 'Assign ticket'
  ">
  @if (ticket().assignedTo) {
  <app-user-avatar class="shrink-0" [name]="ticket().assignedToInitial" avatarClass="h-6! w-6!" />
  <span class="text-zinc-700 dark:text-zinc-300">{{ ticket().assignedTo }}</span>
  } @else {
  <span
    class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full border border-dashed border-zinc-300 text-zinc-400 transition-colors group-hover:border-primary group-hover:text-primary dark:border-zinc-600 dark:text-zinc-500"
    aria-hidden="true">
    <i class="pi pi-plus text-[10px]"></i>
  </span>
  <span class="text-gray-500 dark:text-zinc-400">Assign</span>
  }
  <i class="pi pi-chevron-down text-xs text-zinc-400 opacity-50 transition-opacity group-hover:opacity-100"></i>
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="trigger.expanded()"
  [cdkConnectedOverlayOffsetY]="6"
  [cdkConnectedOverlayScrollStrategy]="closeOnScroll"
  (overlayOutsideClick)="trigger.close()">
  <app-popup
    ngMenu
    #assigneeMenu="ngMenu"
    ariaLabel="Assign agent"
    closeAriaLabel="Close assignee picker"
    (closed)="trigger.close()">
    <app-assign-ticket-popup
      [agents]="agents()"
      [currentAssignee]="ticket().assignedTo || null"
      (agentSelected)="agentSelected.emit($event); trigger.close()"
      (unassigned)="unassigned.emit(); trigger.close()" />
  </app-popup>
</ng-template>
