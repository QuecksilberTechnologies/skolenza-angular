<p-card styleClass="!flex flex-col items-center justify-center min-h-[80vh]">
  <div class="mx-auto min-h-full w-full max-w-2xl p-6">
    <div class="space-y-6 text-center">
      <div class="inline-block rounded-full bg-primary/10 p-4">
        <i class="pi pi-chart-line !text-4xl text-primary"></i>
      </div>
      <h1 class="text-3xl font-bold text-primary">Timeline View Coming Soon</h1>
      <p class="text-lg leading-relaxed text-gray-600">
        We're working hard to bring you a powerful timeline chart view for better project timeline management. Stay
        tuned for updates!
      </p>
      <div class="flex flex-col items-center justify-center gap-4 pt-4 sm:flex-row">
        <p-button
          label="Get Notified"
          icon="pi pi-bell"
          severity="primary"
          class="w-full sm:w-auto"
          [outlined]="true" />
        <p-button
          label="Learn More"
          icon="pi pi-info-circle"
          severity="secondary"
          class="w-full sm:w-auto"
          [outlined]="true" />
      </div>
    </div>
  </div>
</p-card>
