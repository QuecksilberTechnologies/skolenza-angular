<app-sub-header
  [pageIcon]="'pi pi-folder'"
  [pageTitle]="project()?.name || 'Loading...'"
  [pageDescription]="'View and manage project details, tasks, and team members'"
  [isBreadcrumbShow]="false"
  [breadcrumbItems]="[]">
  <div class="flex items-center justify-between gap-4">
    @if (isLoading()) {
      <p-avatar-group>
        @for (skeleton of [1]; track skeleton) {
          <p-skeleton
            shape="circle"
            size="2rem" />
        }
      </p-avatar-group>
    } @else {
      <p-avatar-group>
        @for (member of project()?.team; track member) {
          <p-avatar
            [appAvatarColor]="member"
            styleClass="!size-9 !text-base"
            image="https://images.unsplash.com/photo-1739413323915-2a289cc024f0?q=70&w=100&auto=format&fit=crop"
            size="normal"
            shape="circle"
            pTooltip="{{ member }}"
            tooltipPosition="top" />
        }
        <p-avatar
          label="+2"
          styleClass="!size-9 !text-base"
          size="normal"
          shape="circle" />
      </p-avatar-group>
    }

    <p-button
      label="Back to Projects"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      routerLink="/app/projects" />
  </div>
</app-sub-header>

<div class="h-[calc(100vh-8.2rem)] overflow-hidden overflow-y-auto">
  <p-tabs
    [value]="activeTabIndex()"
    class="sticky top-0 z-10">
    <p-tablist>
      @for (tab of tabs; track tab.route) {
        <p-tab
          [value]="tab.route"
          [routerLink]="['./', tab.route]"
          routerLinkActive="active-tab"
          class="flex items-center !gap-2">
          <lucide-angular
            [img]="tab.icon"
            size="14" />
          <span>{{ tab.label }}</span>
        </p-tab>
      }
    </p-tablist>
  </p-tabs>

  <div class="min-h-[calc(100vh-12rem)] p-4 bg-emphasis">
    <router-outlet />
  </div>
</div>
