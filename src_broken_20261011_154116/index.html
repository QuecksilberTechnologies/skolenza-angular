<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <title>Skolenza - Next-Gen HRMS for Innovative Teams | Built by Quecksilber</title>
    <base href="/" />

    <!-- Standard SEO Meta Tags -->
    <meta
      name="description"
      content="Skolenza - Empowering HR teams to manage people, departments, and performance with ease and clarity." />
    <meta
      name="keywords"
      content="HR, Human Resources, StaffMember Management, Performance, Payroll, Attendance, Onboarding, Departments, Skolenza" />
    <meta
      name="author"
      content="Skolenza Team" />

    <!-- Open Graph Meta Tags: for rich sharing on Facebook, LinkedIn, etc. -->
    <meta
      property="og:title"
      content="Skolenza HRMS" />
    <meta
      property="og:description"
      content="Skolenza helps organizations streamline HR processes, engage staff members, and simplify everyday people management." />
    <meta
      property="og:type"
      content="website" />
    <meta
      property="og:image"
      content="brand/skolenza-logo-system/skolenza-horizontal-full-color-1024.png" />
    <meta
      property="og:url"
      content="https://skolenza.example.com/" />

    <!-- Twitter Card Meta Tags: for optimized Twitter sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Skolenza HRMS" />
    <meta
      name="twitter:description"
      content="Make HR simpler and smarter with Skolenza - the all-in-one solution for your organization's people and workforce needs." />
    <meta
      name="twitter:image"
      content="brand/skolenza-logo-system/skolenza-horizontal-full-color-1024.png" />

    <!-- PWA related: favicon, manifest, and theme color -->
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico" />
    <link
      rel="manifest"
      href="manifest.webmanifest" />
    <meta
      name="theme-color"
      content="#4287f5" />

    <script>
      // Apply the persisted theme before first paint so the boot splash below never renders in
      // the wrong one. Mirrors ThemeApi.setTheme / App.initTheme; Angular re-applies it on boot.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('skolenza/theme');
        } catch (e) {
          // localStorage throws when site data is blocked - fall through to the OS preference.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.className = theme;
        document.documentElement.setAttribute('data-color-scheme', theme);
      })();
    </script>

    <style>
      html {
        background-color: #fafafa;
        color-scheme: light;
      }
      html.dark {
        background-color: #09090b;
        color-scheme: dark;
      }
      .root-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        text-align: center;
      }
      .root-loader p {
        font-size: 1.2rem;
        text-align: center;
        color: #71717a;
      }
      html.dark .root-loader p {
        color: #a1a1aa;
      }
      .root-loader img {
        height: 4.2rem;
        animation: flash 1.2s linear infinite;
        margin-bottom: 0.9rem;
      }
      html:not(.dark) .root-loader img {
        mix-blend-mode: multiply;
      }
      @keyframes flash {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="root-loader">
        <img
          src="brand/skolenza-logo-system/skolenza-horizontal-full-color-256.png"
          alt="logo" />
        <p>
          Preparing your Skolenza experience
          <span aria-hidden="true">...</span>
        </p>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
