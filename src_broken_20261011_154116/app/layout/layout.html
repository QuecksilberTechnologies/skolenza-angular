<main class="relative flex h-screen overflow-hidden">
  <!-- App Side Menu -->
  <aside
    class="app-aside-menu relative z-10 h-screen w-full max-w-xs border-e border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900"
    [class.menu-collapsed]="layoutStore.sidebarCollapsed()"
    [class.transition-enabled]="isTransitionEnabled()">
    <div class="border-b border-zinc-200 py-0 dark:border-zinc-800">
      <app-logo
        [isLeftmenuCollapsed]="layoutStore.sidebarCollapsed()"
        (logoClick)="redirectToDashboard()" />
    </div>
    @defer {
    <app-aside-menu
      [isLeftmenuCollapsed]="layoutStore.sidebarCollapsed()"
      (navClick)="hideLeftMenu()" />
    } @placeholder {
    <app-aside-menu-loader />
    }
  </aside>

  <div class="flex flex-1 flex-col overflow-x-hidden overflow-y-auto [scrollbar-gutter:stable]">
    <!-- App Header -->
    <div class="sticky top-0 z-10">
      @defer {
      <app-header (leftmenuToggleEvent)="toggleLeftMenu()" />
      } @placeholder {
      <app-header-loader />
      }
    </div>

    <!-- Router Outlet -->
    <div class="relative min-h-0 w-full flex-1">
      <router-outlet />
    </div>
  </div>
</main>

@if (layoutStore.sidebarCollapsed()) {
<div
  class="mobile-overlay bg-black/40 dark:bg-black/60"
  (click)="hideLeftMenu()"
  (keydown.enter)="hideLeftMenu()"
  tabindex="0"
  role="button"
  aria-label="Close menu overlay"></div>
}
