<p-card class="m-4">
  <p-table
    #dt
    [value]="leaveStatus()"
    [showLoader]="false"
    [loading]="isLoadingStatus()"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [rowsPerPageOptions]="[10, 25, 50]">
    <ng-template #caption>
      <app-table-inline-filters>
        <!-- Basic filter -->

        <!-- Advance filter -->
        <!-- <app-table-search-filter [filterCount]="0" /> -->

        <div
          ngProjectAs="right"
          class="flex gap-2">
          <app-table-search-input [debounceMs]="0" (searchTerm)="searchLeaves(dt, $event)" />
          @if (permissionsStore.canPerform('Leaves', 'Add')) {
          <p-button
            label="Add Leave Status"
            icon="pi pi-plus"
            (onClick)="openNew()" />
          }
        </div>
      </app-table-inline-filters>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template
      #body
      let-status>
      <tr>
        <td>
          <span class="inline-flex items-center gap-2">
            <span
              class="h-3 w-3 rounded-full"
              [style.background]="status.color"
              [style.border]="status.color ? '1px solid #e5e7eb' : ''"
              [style.display]="'inline-block'"
              aria-hidden="true"></span>
            <span>{{ status.statusName }}</span>
          </span>
        </td>
        <td>{{ status.description }}</td>
        <td>
          @if (actionMenuItems.length > 0) {
          <app-table-action-button (action)="selectedRow = status; actionMenu.toggle($event)" />
          }
        </td>
      </tr>
    </ng-template>
    <ng-template #loadingbody>
      <tr>
        <td colspan="3">
          <app-table-loader />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">
          <app-table-empty-message
            icon="pi pi-folder"
            message=" No Status types found"
            subMessage="Add a new status to get started" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-menu
  #actionMenu
  [model]="actionMenuItems"
  [popup]="true"
  appendTo="body" />

<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems"
  appendTo="body" />

<p-confirmDialog
  acceptButtonStyleClass="p-button-danger" />
