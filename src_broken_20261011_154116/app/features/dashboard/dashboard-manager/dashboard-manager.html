<section class="flex h-[calc(100vh-4.6rem)] flex-col gap-4 overflow-hidden overflow-y-auto p-3 sm:p-4">
  <app-dashboard-greeting subtitle="Here's what's happening with your team today.">
    @if (store.allPlaceholder()) {
      <span
        class="inline-flex items-center gap-1 rounded-full border border-zinc-200 bg-white px-2.5 py-1 text-sm font-medium whitespace-nowrap text-zinc-600 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-400">
        <i class="pi pi-info-circle" aria-hidden="true"></i>
        Showing sample data
      </span>
    }
  </app-dashboard-greeting>

  @if (store.hasError() && !store.isLoading()) {
    <div
      class="flex flex-col items-center rounded-[0.8rem] bg-white p-6 shadow-sm dark:border dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none"
      role="alert">
      <app-table-empty-message
        icon="pi pi-exclamation-triangle"
        message="Couldn't load your team dashboard"
        subMessage="Check your connection, then try again." />
      <p-button
        label="Try again"
        icon="pi pi-refresh"
        [outlined]="true"
        size="small"
        (onClick)="store.reload()" />
    </div>
  } @else {
    <div
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-6 2xl:grid-cols-5"
      [attr.aria-busy]="store.isLoading()">
      @if (store.isLoading() && !overviewTiles().length) {
        @for (span of skeletonSpans; track $index) {
          <app-stat-card [class]="span" [loading]="true" />
        }
      } @else {
        @for (tile of overviewTiles(); track tile.key) {
          <app-stat-card
            [class]="tile.spanClass"
            [icon]="tile.icon"
            [value]="tile.value"
            [label]="tile.label"
            [tone]="tile.tone"
            [link]="tile.link" />
        }
      }
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 2xl:grid-cols-4">
      <app-notice-period-card
        title="Team Members On Notice"
        [skeletonCount]="1"
        [staff members]="store.teamMembersOnNotice()?.data ?? null"
        [placeholder]="!store.allPlaceholder() && (store.teamMembersOnNotice()?.isPlaceholder ?? false)"
        [loading]="store.isSectionLoading('notice')"
        (refresh)="store.reload('notice')" />

      <app-widget-list-card
        title="Team Leave Requests"
        [skeletonCount]="1"
        icon="pi pi-calendar"
        [showAvatar]="true"
        emptyMessage="No team leave"
        emptySubMessage="Leave requests from your team show here"
        [section]="store.teamLeave()"
        [viewAllLink]="leaveHistoryLink()"
        [loading]="store.isSectionLoading('leave')"
        (refresh)="store.reload('leave')"
        [placeholderBadge]="!store.allPlaceholder()" />

      <app-widget-list-card
        title="Team Birthdays"
        [skeletonCount]="1"
        icon="pi pi-gift"
        [relativeDate]="true"
        [showAvatar]="true"
        emptyMessage="No upcoming birthdays"
        emptySubMessage="Upcoming team birthdays show here"
        [section]="store.teamBirthdays()"
        [loading]="store.isSectionLoading('birthdays')"
        (refresh)="store.reload('birthdays')"
        [placeholderBadge]="!store.allPlaceholder()" />

      <app-widget-list-card
        title="Recent Team Onboarding"
        [skeletonCount]="1"
        icon="pi pi-user-plus"
        [showAvatar]="true"
        emptyMessage="No recent onboarding"
        emptySubMessage="New joiners in your team show here"
        [section]="store.recentTeamOnboarding()"
        [viewAllLink]="staff membersLink()"
        [loading]="store.isSectionLoading('onboarding')"
        (refresh)="store.reload('onboarding')"
        [placeholderBadge]="!store.allPlaceholder()" />
    </div>
  }
</section>
