@if (result(); as registered) {
  <div class="flex w-full flex-col gap-4">
    <!-- `alert` rather than `status`: a lost credential cannot be recovered, only re-registered. -->
    <div
      role="alert"
      class="flex items-start gap-3 rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900 dark:border-amber-700 dark:bg-amber-950 dark:text-amber-200">
      <i
        class="pi pi-exclamation-triangle mt-0.5 shrink-0"
        aria-hidden="true"></i>
      <span>
        This credential is shown only once. Copy it into the desktop agent before closing. It
        cannot be retrieved again.
      </span>
    </div>

    <div class="flex flex-col gap-1">
      <label
        for="agentCredential"
        class="text-sm font-medium text-gray-700 dark:text-zinc-200">
        Agent credential
      </label>
      <div class="flex items-start gap-2">
        <textarea
          id="agentCredential"
          readonly
          rows="2"
          class="w-full resize-none rounded-md border border-zinc-300 bg-zinc-50 p-2 font-mono text-xs break-all text-gray-800 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100"
          >{{ registered.agentCredential }}</textarea
        >
        <p-button
          type="button"
          [icon]="hasCopied() ? 'pi pi-check' : 'pi pi-clipboard'"
          [severity]="hasCopied() ? 'success' : 'secondary'"
          [ariaLabel]="hasCopied() ? 'Agent credential copied' : 'Copy agent credential'"
          [pTooltip]="hasCopied() ? 'Copied' : 'Copy'"
          tooltipPosition="bottom"
          [rounded]="true"
          [text]="true"
          (onClick)="copyCredential(registered.agentCredential)" />
      </div>
    </div>

    <dl class="m-0 flex flex-col gap-1 text-sm">
      <dt
        class="text-[11px] font-semibold tracking-wider text-gray-500 uppercase dark:text-zinc-400">
        Agent instance ID
      </dt>
      <dd class="m-0 font-mono text-xs break-all text-gray-800 dark:text-zinc-100">
        {{ registered.agentInstanceId }}
      </dd>
    </dl>

    <div
      class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
      <p-button
        type="button"
        label="Done"
        icon="pi pi-check"
        (onClick)="onClose()" />
    </div>
  </div>
} @else {
  <form
    (submit)="onSubmit(); $event.preventDefault()"
    class="flex w-full flex-col gap-4">
    <app-form-select
      label="StaffMember"
      inputId="registerStaffMember"
      required
      [filter]="true"
      filterBy="staffMemberFullName,departmentName"
      [options]="staff members"
      optionLabel="staffMemberFullName"
      optionValue="staffMemberId"
      placeholder="Select staffMember"
      [field]="f.staffMemberId"
      [submitted]="submitted()" />

    <app-form-text
      label="Device name"
      inputId="deviceName"
      placeholder="e.g. EMP-LAPTOP-01"
      hint="The PC's name, so admins can tell an staffMember's devices apart"
      required
      [field]="f.deviceName"
      [submitted]="submitted()" />

    <div
      class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
      <p-button
        type="button"
        label="Cancel"
        variant="text"
        severity="secondary"
        (onClick)="onClose()" />
      <p-button
        type="submit"
        [label]="isSaving() ? 'Registering...' : 'Register agent'"
        icon="pi pi-plus"
        [loading]="isSaving()"
        [disabled]="isSaving()" />
    </div>
  </form>
}
