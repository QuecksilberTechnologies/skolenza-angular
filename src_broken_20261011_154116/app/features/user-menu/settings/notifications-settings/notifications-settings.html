<section
  class="bg-surface-light p-3 sm:p-4 dark:bg-surface-dark"
  aria-labelledby="settings-panel-heading">
  <div class="max-w-3xl space-y-3">
    <!-- Approvals & Requests -->
    <button
      type="button"
      class="flex w-full cursor-pointer items-center justify-between gap-3 rounded-lg border border-transparent bg-zinc-50 p-3 text-left transition-all hover:border-border-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:gap-4 sm:p-4 dark:bg-zinc-800/40 dark:hover:border-border-dark"
      (click)="onToggle('approvals', !notifications().approvals)"
      [attr.aria-pressed]="notifications().approvals">
      <div class="flex min-w-0 gap-3 sm:gap-4">
        <div
          class="h-fit shrink-0 rounded-lg bg-blue-100 p-2 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400"
          aria-hidden="true">
          <span class="pi pi-user-edit !text-[18px] sm:!text-[20px]"></span>
        </div>
        <div class="min-w-0">
          <h3 class="text-sm font-medium text-text-primary-light sm:text-base dark:text-text-primary-dark">
            Approvals &amp; Requests
          </h3>
          <p class="mt-0.5 line-clamp-2 text-xs text-text-secondary-light sm:text-sm dark:text-text-secondary-dark">
            Get notified instantly when an staffMember submits a leave or expense request.
          </p>
        </div>
      </div>
      <p-toggleswitch
        [ngModel]="notifications().approvals"
        (click)="$event.stopPropagation()"
        (ngModelChange)="onToggle('approvals', $event)"
        aria-label="Toggle approvals notifications"
        class="shrink-0" />
    </button>

    <!-- Recruitment Updates -->
    <button
      type="button"
      class="flex w-full cursor-pointer items-center justify-between gap-3 rounded-lg border border-transparent bg-zinc-50 p-3 text-left transition-all hover:border-border-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:gap-4 sm:p-4 dark:bg-zinc-800/40 dark:hover:border-border-dark"
      (click)="onToggle('recruitment', !notifications().recruitment)"
      [attr.aria-pressed]="notifications().recruitment">
      <div class="flex min-w-0 gap-3 sm:gap-4">
        <div
          class="h-fit shrink-0 rounded-lg bg-purple-100 p-2 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400"
          aria-hidden="true">
          <span class="pi pi-user-plus !text-[18px] sm:!text-[20px]"></span>
        </div>
        <div class="min-w-0">
          <h3 class="text-sm font-medium text-text-primary-light sm:text-base dark:text-text-primary-dark">
            Recruitment Updates
          </h3>
          <p class="mt-0.5 line-clamp-2 text-xs text-text-secondary-light sm:text-sm dark:text-text-secondary-dark">
            Receive email alerts for new candidate applications and interview schedules.
          </p>
        </div>
      </div>
      <p-toggleswitch
        [ngModel]="notifications().recruitment"
        (click)="$event.stopPropagation()"
        (ngModelChange)="onToggle('recruitment', $event)"
        aria-label="Toggle recruitment notifications"
        class="shrink-0" />
    </button>

    <!-- Compliance & Deadlines -->
    <button
      type="button"
      class="flex w-full cursor-pointer items-center justify-between gap-3 rounded-lg border border-red-100 bg-red-50 p-3 text-left transition-all hover:bg-red-100/50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:gap-4 sm:p-4 dark:border-red-900/30 dark:bg-red-900/10 dark:hover:bg-red-900/20"
      (click)="onToggle('compliance', !notifications().compliance)"
      [attr.aria-pressed]="notifications().compliance">
      <div class="flex min-w-0 gap-3 sm:gap-4">
        <div
          class="h-fit shrink-0 rounded-lg bg-red-100 p-2 text-red-600 dark:bg-red-900/30 dark:text-red-400"
          aria-hidden="true">
          <span class="pi pi-exclamation-triangle !text-[18px] sm:!text-[20px]"></span>
        </div>
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="text-sm font-medium text-text-primary-light sm:text-base dark:text-text-primary-dark">
              Compliance &amp; Deadlines
            </h3>
            <span
              class="rounded-full bg-red-100 px-2 py-0.5 text-[10px] font-bold tracking-wide text-red-700 uppercase dark:bg-red-900 dark:text-red-300">
              Critical
            </span>
          </div>
          <p class="mt-0.5 line-clamp-2 text-xs text-text-secondary-light sm:text-sm dark:text-text-secondary-dark">
            Reminders for document expirations, performance reviews, and policy updates.
          </p>
        </div>
      </div>
      <p-toggleswitch
        [ngModel]="notifications().compliance"
        (click)="$event.stopPropagation()"
        (ngModelChange)="onToggle('compliance', $event)"
        aria-label="Toggle compliance notifications"
        class="shrink-0" />
    </button>

    <!-- Payroll Processed -->
    <button
      type="button"
      class="flex w-full cursor-pointer items-center justify-between gap-3 rounded-lg border border-transparent bg-zinc-50 p-3 text-left transition-all hover:border-border-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:gap-4 sm:p-4 dark:bg-zinc-800/40 dark:hover:border-border-dark"
      (click)="onToggle('payroll', !notifications().payroll)"
      [attr.aria-pressed]="notifications().payroll">
      <div class="flex min-w-0 gap-3 sm:gap-4">
        <div
          class="h-fit shrink-0 rounded-lg bg-green-100 p-2 text-green-600 dark:bg-green-900/30 dark:text-green-400"
          aria-hidden="true">
          <span class="pi pi-indian-rupee !text-[18px] sm:!text-[20px]"></span>
        </div>
        <div class="min-w-0">
          <h3 class="text-sm font-medium text-text-primary-light sm:text-base dark:text-text-primary-dark">
            Payroll Processed
          </h3>
          <p class="mt-0.5 line-clamp-2 text-xs text-text-secondary-light sm:text-sm dark:text-text-secondary-dark">
            Notify me when the monthly payroll run has been successfully completed.
          </p>
        </div>
      </div>
      <p-toggleswitch
        [ngModel]="notifications().payroll"
        (click)="$event.stopPropagation()"
        (ngModelChange)="onToggle('payroll', $event)"
        aria-label="Toggle payroll notifications"
        class="shrink-0" />
    </button>
  </div>
</section>
