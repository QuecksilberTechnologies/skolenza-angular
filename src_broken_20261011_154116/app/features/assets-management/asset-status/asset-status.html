<div class="h-[calc(100vh-4.6rem)] overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4">
    <p-table
      #dt
      [value]="assetStatuses()"
      [loading]="isLoadingStatus()"
      [showLoader]="false"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      paginatorDropdownAppendTo="body"
      [globalFilterFields]="['statusName', 'description', 'colorKey']"
      [(contextMenuSelection)]="selectedRow"
      [contextMenu]="
        (loginInfo?.user?.primaryRole?.roleTypeId ?? 2) !== 2 ? actionContextMenu : null
      ">
      <ng-template #caption>
        <app-table-inline-filters>
          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input [debounceMs]="0" (searchTerm)="searchAssets(dt, $event)" />
            @if ((loginInfo?.user?.primaryRole?.roleTypeId ?? 2) !== 2) {
            <p-button
              label="Add Asset Status"
              icon="pi pi-plus"
              class="w-full lg:w-auto"
              styleClass="w-full lg:w-auto"
              (onClick)="upsertAssetStatus()" />
            }
          </div>
        </app-table-inline-filters>
      </ng-template>

      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Color</th>
          <th>
            <div class="flex justify-center">Actions</div>
          </th>
        </tr>
      </ng-template>

      <ng-template
        #body
        let-status>
        <tr [pContextMenuRow]="status">
          <td>{{ status.statusName }}</td>
          <td>
            <div
              class="max-w-[12rem] truncate"
              [title]="status.description || '-'">
              {{ status.description || '-' }}
            </div>
          </td>
          <td>
            <div class="flex items-center gap-2">
              <div
                class="h-4 w-4 rounded"
                [style.background]="status?.colorKey"></div>
              <span>{{ status.colorKey || '-' }}</span>
            </div>
          </td>

          <td>
            <div class="flex justify-center gap-2">
              <p-button
                type="button"
                icon="pi pi-ellipsis-h"
                severity="secondary"
                [rounded]="false"
                [loading]="status?.isDeleting"
                (click)="selectedRow = status; actionMenu.toggle($event)" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #loadingbody>
        @if (assetStatuses().length === 0) {
        <tr>
          <td colspan="4">
            <app-table-loader />
          </td>
        </tr>
        }
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <app-table-empty-message
              icon="pi pi-folder"
              message="No asset statuses found"
              subMessage="Add a new status to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems"
  appendTo="body" />

<p-confirmDialog
  acceptButtonStyleClass="p-button-danger" />
