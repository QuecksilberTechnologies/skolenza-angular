<div class="flex flex-wrap gap-4 md:gap-4">
  @for (_ of [1, 2, 3, 4]; track $index) {
  <div
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border border-surface bg-white sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-4 p-5">
      <p-skeleton
        shape="square"
        width="48px"
        height="48px"
        class="rounded-xl!" />
      <div class="flex flex-col gap-2">
        <p-skeleton
          width="48px"
          height="32px"
          class="rounded-md!" />
        <p-skeleton
          width="64px"
          height="16px"
          class="rounded-md!" />
      </div>
    </div>
  </div>
  }
</div>
