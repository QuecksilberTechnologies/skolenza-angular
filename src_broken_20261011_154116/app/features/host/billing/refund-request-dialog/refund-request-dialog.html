<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex h-full min-h-0 w-full flex-col">
  <!-- `-mx-1 px-1` keeps the body flush with the dialog title while leaving room for focus rings
       inside the scroll container. -->
  <div class="-mx-1 flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-1 pt-1 pb-4">
    <p-message
      severity="info"
      size="small"
      icon="pi pi-info-circle">
      Refunds are queued and sent to the payment gateway later. The amount can't exceed what's left
      to refund on the payment.
    </p-message>

    @if (fixedTransaction; as fixed) {
      <div class="flex flex-col">
        <span
          class="text-[11px] font-semibold tracking-wider text-gray-500 uppercase dark:text-zinc-400">
          Transaction
        </span>
        <span class="mt-1 text-gray-800 tabular-nums dark:text-zinc-100">
          {{ fixed.label }}
        </span>
      </div>
    } @else {
      <app-form-autocomplete
        label="Transaction"
        inputId="paymentTransaction"
        placeholder="Search by institution, order or payment ID"
        optionLabel="label"
        emptyMessage="No refundable payments found"
        required
        [suggestions]="transactionSuggestions()"
        [field]="f.transaction"
        [submitted]="submitted()"
        (completeMethod)="searchTransactions($event)" />
    }

    <app-form-number
      label="Amount"
      inputId="amount"
      placeholder="e.g. 250.00"
      required
      [mode]="currencyCode() ? 'currency' : 'decimal'"
      [currency]="currencyCode()"
      [min]="0.01"
      [max]="transaction()?.amount ?? undefined"
      [minFractionDigits]="2"
      [maxFractionDigits]="2"
      [hint]="amountHint()"
      [field]="f.amount"
      [submitted]="submitted()" />

    <app-form-textarea
      label="Reason"
      inputId="reason"
      placeholder="Why is this payment being refunded?"
      required
      [hint]="reasonHint()"
      [rows]="3"
      [maxlength]="reasonMaxLength"
      [field]="f.reason"
      [submitted]="submitted()" />
  </div>

  <app-form-action-bar
    dialog
    submitLabel="Request Refund"
    submitIcon="pi pi-replay"
    savingLabel="Requesting..."
    [saving]="isSaving()"
    (cancelled)="onCancel()" />
</form>
