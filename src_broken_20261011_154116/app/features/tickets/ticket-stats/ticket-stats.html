<div class="flex flex-wrap gap-4 md:gap-4">
  <!-- New Tickets -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:shadow-none">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-ticket text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ newTickets() || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">New Tickets</span>
      </div>
    </div>
  </p-card>

  <!-- Open Tickets -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:shadow-none">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-folder-open text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ openTickets() || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Open Tickets</span>
      </div>
    </div>
  </p-card>

  <!-- Solved Tickets -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:shadow-none">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-check-circle text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ solvedTickets() || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Solved Tickets</span>
      </div>
    </div>
  </p-card>

  <!-- Pending Tickets -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:shadow-none">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-hourglass text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ pendingTickets() || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Pending Tickets</span>
      </div>
    </div>
  </p-card>
</div>
