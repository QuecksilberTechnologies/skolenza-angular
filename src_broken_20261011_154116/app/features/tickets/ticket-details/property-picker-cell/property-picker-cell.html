<button
  type="button"
  class="group inline-flex items-center gap-1 rounded-md transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 active:scale-95"
  ngMenuTrigger
  #trigger="ngMenuTrigger"
  [menu]="menuRef()"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [attr.aria-label]="'Change ' + label()">
  @if (currentOption(); as opt) {
  <span
    [class]="opt.pillClass"
    class="transition-opacity group-hover:opacity-80">
    <span [class]="opt.dotClass"></span>
    {{ opt.value }}
  </span>
  } @else {
  <span class="text-sm text-zinc-400">—</span>
  }
  <i class="pi pi-chevron-down text-[10px] text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-300"></i>
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="trigger.expanded()"
  [cdkConnectedOverlayOffsetY]="6"
  [cdkConnectedOverlayScrollStrategy]="closeOnScroll"
  (overlayOutsideClick)="trigger.close()">
  <app-popup
    ngMenu
    #menu="ngMenu"
    [ariaLabel]="'Change ' + label()"
    [closeAriaLabel]="'Close ' + label() + ' picker'"
    (closed)="trigger.close()">
    <div class="w-56">
      <div class="px-4 pt-3 pb-2">
        <p class="text-[11px] font-semibold tracking-wider text-zinc-400 uppercase dark:text-zinc-500">{{ label() }}</p>
      </div>
      <ul
        ngListbox
        selectionMode="explicit"
        [value]="selectedValues()"
        (valueChange)="onValuesChange($event)"
        class="max-h-64 overflow-y-auto pb-1"
        [attr.aria-label]="'Select ' + label()">
        @for (opt of options(); track opt.value) { @let selected = isSelected(opt.value);
        <li
          ngOption
          [value]="opt.value"
          [label]="opt.value"
          class="flex cursor-pointer items-center gap-2.5 px-3 py-2 text-left transition-colors hover:bg-zinc-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 dark:hover:bg-zinc-800"
          [class.bg-primary-50]="selected"
          [class.dark:bg-primary-900/10]="selected">
          <span [class]="opt.pillClass">
            <span [class]="opt.dotClass"></span>
            {{ opt.value }}
          </span>
          @if (selected) {
          <i
            class="pi pi-check ml-auto text-xs text-primary"
            aria-hidden="true"></i>
          }
        </li>
        }
      </ul>
    </div>
  </app-popup>
</ng-template>
