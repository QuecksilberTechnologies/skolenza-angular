<div
  class="overflow-hidden rounded-xl border transition-colors"
  [class]="
    isInternalNote()
      ? 'border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/10'
      : 'border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900'
  ">
  @if (isInternalNote()) {
  <div
    class="flex items-center gap-2 border-b border-amber-200 bg-amber-100/60 px-3 py-2 dark:border-amber-800/40 dark:bg-amber-900/20">
    <i
      class="pi pi-lock text-xs text-amber-700 dark:text-amber-400"
      aria-hidden="true"></i>
    <span class="text-xs font-medium text-amber-800 dark:text-amber-300">Internal note — visible only to agents</span>
  </div>
  }
  <textarea
    pTextarea
    rows="4"
    [ngModel]="message()"
    (ngModelChange)="message.set($event)"
    [attr.aria-label]="
      isInternalNote() ? 'Write an internal note for agents' : 'Write a reply to the requester'
    "
    [placeholder]="
      isInternalNote() ? 'Write a private note for agents...' : 'Write a reply to the requester...'
    "
    class="w-full resize-none !rounded-none !border-0 !bg-transparent !p-3 !text-sm !shadow-none"></textarea>
  <div
    class="flex items-center justify-between border-t px-2 py-1.5"
    [class]="
      isInternalNote()
        ? 'border-amber-200 dark:border-amber-800/40'
        : 'border-zinc-200 dark:border-zinc-700'
    ">
    <div class="flex items-center gap-0">
      <p-button
        icon="pi pi-paperclip"
        variant="text"
        severity="secondary"
        size="small"
        rounded
        aria-label="Attach file" />
      <p-button
        icon="pi pi-at"
        variant="text"
        severity="secondary"
        size="small"
        rounded
        aria-label="Mention someone" />
      <p-button
        icon="pi pi-face-smile"
        variant="text"
        severity="secondary"
        size="small"
        rounded
        aria-label="Insert emoji" />
      <div class="ml-1 flex items-center gap-1.5">
        <input
          type="checkbox"
          id="internal-note"
          [checked]="isInternalNote()"
          (change)="toggleInternalNote()"
          class="cursor-pointer rounded accent-amber-500" />
        <label
          for="internal-note"
          class="cursor-pointer text-xs text-zinc-500 select-none">
          Internal note
        </label>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="discard()"
        class="cursor-pointer px-2 py-1 text-xs text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300">
        Discard
      </button>
      @if (isInternalNote()) {
      <p-button
        label="Add internal note"
        icon="pi pi-lock"
        severity="warn"
        size="small"
        [disabled]="!message().trim()" />
      } @else {
      <p-button
        label="Send reply"
        icon="pi pi-send"
        severity="primary"
        size="small"
        [disabled]="!message().trim()" />
      }
    </div>
  </div>
</div>
