<form (submit)="onSubmit(); $event.preventDefault()" class="form-invalid-visible flex flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    @for (toggle of toggleFields; track toggle.id) {
      <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 p-3 dark:border-zinc-700">
        <label [for]="toggle.id" class="font-medium">{{ toggle.label }}</label>
        <p-toggleswitch [inputId]="toggle.id" [formField]="$any(toggle.field)" />
      </div>
    }
  </div>

  @if (!model().dhcpEnabled) {
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      @for (item of textFields; track item.id) {
        <div class="space-y-1">
          <label [for]="item.id" class="block font-medium">{{ item.label }}</label>
          <input
            [formField]="item.field"
            pInputText
            type="text"
            [id]="item.id"
            class="w-full"
            [placeholder]="item.placeholder" />
        </div>
      }
    </div>
  }

  <div class="flex justify-end">
    <p-button type="submit" label="Push ethernet settings" icon="pi pi-cloud-upload" [loading]="isSaving()" />
  </div>
</form>
