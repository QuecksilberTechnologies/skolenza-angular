<div class="h-[calc(100vh-4.6rem)] overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4 dark:border-zinc-800 dark:bg-zinc-900">
    <p-table
      dataKey="id"
      [value]="store.institutionDevices()"
      [loading]="store.isLoading()"
      [showGridlines]="false"
      [rowHover]="true"
      [showLoader]="false"
      [lazy]="true"
      [paginator]="true"
      [rows]="store.pageSize()"
      [totalRecords]="store.totalRecords()"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} devices"
      [rowsPerPageOptions]="[10, 25, 50]"
      paginatorDropdownAppendTo="body"
      [tableStyle]="{ width: '100%', 'table-layout': 'fixed' }"
      [style]="{ background: 'transparent' }"
      (onLazyLoad)="loadInstitutionDevices($event)">
      <ng-template #caption>
        <app-table-inline-filters>
          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input
              class="min-w-0 flex-1 lg:flex-none"
              (searchTerm)="searchInstitutionDevices($event)" />
          </div>
        </app-table-inline-filters>
      </ng-template>

      <ng-template #header>
        <tr class="bg-gray-50 dark:bg-zinc-800">
          <th scope="col" class="px-3! py-2.5! align-middle whitespace-nowrap text-gray-700 lg:w-[38%] dark:text-zinc-100">
            Device
          </th>
          <th scope="col" class="hidden px-3! py-2.5! align-middle whitespace-nowrap text-gray-700 md:table-cell md:w-[30%] dark:text-zinc-100">
            Location
          </th>
          <th scope="col" class="hidden px-3! py-2.5! align-middle whitespace-nowrap text-gray-700 sm:table-cell sm:w-[14%] sm:min-w-[100px] dark:text-zinc-100">
            Status
          </th>
          <th scope="col" class="w-[18%] min-w-[210px] px-3! py-2.5! align-middle whitespace-nowrap text-gray-700 dark:text-zinc-100">
            <div class="flex justify-center">Actions</div>
          </th>
        </tr>
      </ng-template>

      <ng-template #body let-device>
        <tr>
          <td class="px-3! py-2.5! align-middle text-gray-700 dark:text-zinc-100">
            <div class="flex min-w-0 items-center gap-2">
              <span
                class="size-2 shrink-0 rounded-full sm:hidden"
                [class.bg-green-500]="device.isActive"
                [class.bg-red-500]="!device.isActive"
                aria-hidden="true"></span>
              <span class="sr-only sm:hidden">{{ device.isActive ? 'Active' : 'Inactive' }}</span>
              <div class="flex min-w-0 flex-col">
                <span class="min-w-0 truncate font-medium text-gray-800 dark:text-zinc-100" [pTooltip]="device.deviceName || '-'" tooltipPosition="bottom">
                  {{ device.deviceName || '-' }}
                </span>
                <span class="min-w-0 truncate text-xs text-gray-500 dark:text-zinc-400">
                  {{ device.deviceCode || '-' }}
                </span>
              </div>
            </div>
          </td>
          <td class="hidden px-3! py-2.5! align-middle text-gray-700 md:table-cell dark:text-zinc-100">
            <span
              class="block min-w-0 truncate"
              [pTooltip]="device.institutionLocationName || '-'"
              tooltipPosition="bottom">
              {{ device.institutionLocationName || '-' }}
            </span>
          </td>
          <td class="hidden px-3! py-2.5! align-middle whitespace-nowrap text-gray-700 sm:table-cell dark:text-zinc-100">
            <p-tag
              [value]="device.isActive ? 'Active' : 'Inactive'"
              [icon]="device.isActive ? 'pi pi-check-circle' : 'pi pi-ban'"
              [severity]="device.isActive ? 'success' : 'danger'" />
          </td>
          <td class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center justify-center gap-2">
              <p-button
                label="Settings"
                icon="pi pi-sliders-h"
                size="small"
                variant="outlined"
                [ariaLabel]="'Open settings for ' + (device.deviceName || 'device')"
                (onClick)="openDeviceSettings(device)" />
              <p-button
                label="Move"
                icon="pi pi-arrows-alt"
                size="small"
                variant="outlined"
                severity="secondary"
                [ariaLabel]="'Move ' + (device.deviceName || 'device') + ' to another location'"
                (onClick)="moveDevice(device)" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #loadingbody>
        @if (store.institutionDevices().length === 0) {
          <tr>
            <td colspan="4"><app-table-loader /></td>
          </tr>
        }
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <app-table-empty-message
              icon="pi pi-sitemap"
              message="No devices found"
              subMessage="Devices assigned to your locations will show up here" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
