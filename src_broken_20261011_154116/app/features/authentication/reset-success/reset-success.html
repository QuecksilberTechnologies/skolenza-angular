<app-auth-card
  heading="Password reset!"
  subheading="You've successfully created a new password, click below to login">
  <div
    card-icon
    class="mb-4 flex w-full justify-center">
    <div class="flex size-16 items-center justify-center rounded-full bg-green-50 dark:bg-green-950">
      <lucide-angular
        [img]="Check"
        size="28"
        [strokeWidth]="1.5"
        aria-hidden="true"
        class="text-green-700 dark:text-green-400" />
    </div>
  </div>

  <p-button
    label="Login"
    routerLink="/auth/login"
    [fluid]="true" />
</app-auth-card>
