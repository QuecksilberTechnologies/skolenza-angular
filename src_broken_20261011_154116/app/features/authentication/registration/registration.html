<app-auth-card
  width="lg"
  logoLink="/"
  heading="Create Your Account"
  subheading="Set up your institution workspace.">
  <!-- No `form-invalid-visible` here: `[formField]` writes validity straight into Optimus' own
         `invalid` input, so opting into the red border would paint every empty select on arrival.
         The `p-message` under each field is what reports an error. -->
    <form
      class="mb-4 grid grid-cols-1 gap-4 md:grid-cols-2"
      (submit)="onRegister(); $event.preventDefault()">
      <app-form-text
        label="Institution Name"
        inputId="companyName"
        icon="pi pi-building"
        placeholder="Greenfield International School"
        autocomplete="organization"
        required
        [field]="f.companyName"
        [submitted]="submitted()" />

      <app-form-text
        label="Institution Website"
        inputId="companyEmailDomain"
        icon="pi pi-globe"
        placeholder="greenfield.edu"
        hint="Exclude http://, https:// or www."
        required
        [field]="f.companyEmailDomain"
        [submitted]="submitted()" />

      <app-form-text
        type="email"
        label="Institution Email"
        inputId="institutionEmail"
        icon="pi pi-envelope"
        placeholder="admin@greenfield.edu"
        hint="Personal email addresses are not recommended."
        autocomplete="email"
        required
        [field]="f.institutionEmail"
        [submitted]="submitted()" />

      <app-form-text
        label="Contact Name"
        inputId="contactPersonName"
        icon="pi pi-user"
        placeholder="John Doe"
        autocomplete="name"
        required
        [field]="f.contactPersonName"
        [submitted]="submitted()" />

      <app-form-country
        label="Country"
        inputId="countryId"
        filter
        required
        [options]="countries()"
        [loading]="isLoadingCountries()"
        [field]="f.countryId"
        [submitted]="submitted()" />

      <app-form-phone
        label="Mobile Number"
        inputId="contactNumber"
        placeholder="98765 43210"
        hint="The dial code comes from the country"
        required
        [dialCode]="dialCode()"
        [field]="f.contactNumber"
        [submitted]="submitted()" />

      <app-form-select
        label="Gender"
        inputId="genderId"
        optionLabel="genderName"
        optionValue="id"
        placeholder="Select Gender"
        required
        [options]="genders()"
        [loading]="isLoadingGenders()"
        [field]="f.genderId"
        [submitted]="submitted()" />

      <app-form-select
        label="Institution Type"
        inputId="institutionTypeId"
        optionLabel="institutionTypeName"
        optionValue="id"
        placeholder="Select institution type"
        emptyTitle="No institution types available"
        emptyDetail="No active institution types are available for this plan."
        required
        [options]="industries()"
        [loading]="isLoadingIndustries()"
        [field]="f.institutionTypeId"
        [submitted]="submitted()" />

      <app-form-text
        label="Prefix"
        inputId="prefix"
        icon="pi pi-users"
        placeholder="Enter prefix (e.g. EXMPL)"
        hint="Used to build your staff codes."
        required
        [field]="f.prefix"
        [submitted]="submitted()" />

      <div class="md:col-span-2">
        <p-button
          type="submit"
          id="btnRegister"
          label="Create Account"
          [loading]="isLoading() || isLoadingLookups()"
          [fluid]="true" />
      </div>
    </form>

    <div class="flex items-center justify-center">
      <a
        routerLink="/auth/login"
        class="font-medium text-primary hover:underline">
        Already have an account?
      </a>
    </div>
  </app-auth-card>
