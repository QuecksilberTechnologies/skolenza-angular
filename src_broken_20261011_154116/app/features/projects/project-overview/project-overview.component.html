<div class="mb-4 grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-2">
  <!-- Project Burndown Chart -->
  @defer (on viewport) {
    <app-project-burndown [title]="'dashboard.ProjectBurndown' | translate" />
  } @placeholder {
    <app-dashboard-card-placeholder [title]="'dashboard.ProjectBurndown' | translate" />
  }

  <!-- Project Burndown Chart -->
  @defer (on viewport) {
    <app-project-burndown [title]="'dashboard.TeamProgress' | translate" />
  } @placeholder {
    <app-dashboard-card-placeholder [title]="'dashboard.TeamProgress' | translate" />
  }

  <!-- Projects Stats Card -->
  @defer {
    <app-projects-stats-card [title]="'dashboard.ProjectsStats' | translate" />
  } @placeholder {
    <app-dashboard-card-placeholder [title]="'dashboard.ProjectsStats' | translate" />
  }

  <!-- Request Status Card -->
  @defer (on viewport) {
    <app-request-status-card [title]="'dashboard.RequestStatus' | translate" />
  } @placeholder {
    <app-dashboard-card-placeholder [title]="'dashboard.RequestStatus' | translate" />
  }
