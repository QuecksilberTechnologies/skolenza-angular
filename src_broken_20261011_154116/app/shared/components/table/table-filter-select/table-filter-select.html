<p-select
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel()"
  [disabled]="disabled()"
  [loading]="loading()"
  [filter]="filter()"
  [filterBy]="filterBy() ?? optionLabel()"
  [showClear]="true"
  [appendTo]="'body'"
  [pTooltip]="tooltip()"
  tooltipPosition="bottom"
  [showDelay]="300"
  [tooltipDisabled]="!tooltip()"
  panelStyleClass="select-option-truncate"
  class="filter-select-trigger w-full"
  [ngModel]="value()"
  (onChange)="valueChange.emit($event.value)">
  <!-- The panel clips a long label to one line, so the whole value lives in the tooltip. -->
  <ng-template
    #item
    let-option>
    <span
      class="block truncate"
      [pTooltip]="label(option)"
      tooltipPosition="right"
      [showDelay]="300">
      {{ label(option) }}
    </span>
  </ng-template>
</p-select>
