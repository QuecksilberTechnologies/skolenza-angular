<p-card styleClass="h-full">
  <ng-template #header>
    <div class="flex items-center justify-between px-5 pt-5">
      <h3 class="text-xl font-semibold text-color-emphasis">{{ title() }}</h3>
      <div class="flex gap-2">
        <p-button
          icon="pi pi-filter"
          [rounded]="true"
          [text]="true"
          size="small"
          pTooltip="Filter"
          tooltipPosition="left" />
        <p-button
          icon="pi pi-refresh"
          [rounded]="true"
          [text]="true"
          size="small"
          pTooltip="Refresh"
          tooltipPosition="left" />
      </div>
    </div>
  </ng-template>

  <div class="relative h-64 w-full sm:h-72 md:h-80">
    <p-chart
      type="line"
      [data]="chartData"
      [options]="chartOptions"
      styleClass="!h-full" />
  </div>
</p-card>
