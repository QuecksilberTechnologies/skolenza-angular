<p-card styleClass="h-full dark:bg-zinc-900 dark:border-zinc-800 dark:shadow-none">
  <ng-template #header>
    <div class="flex items-center justify-between px-5 pt-5">
      <h4 class="text-xl font-semibold text-color-emphasis dark:text-zinc-100">{{ title() }}</h4>
      <div>
        <p-button
          icon="pi pi-refresh"
          [rounded]="true"
          [text]="true"
          size="small"
          [loading]="loading()"
          pTooltip="Refresh Data"
          tooltipPosition="left"
          [ariaLabel]="'Refresh ' + (title() ?? '')"
          styleClass="dark:bg-zinc-800 dark:text-gray-200 hover:dark:bg-zinc-700"
          (onClick)="refresh.emit()" />
      </div>
    </div>
  </ng-template>
  <ng-template #content>
    <div class="min-h-72 space-y-3 dark:bg-zinc-900">
      <div class="flex items-center justify-between rounded-lg bg-primary-contrast px-3 py-3 dark:bg-zinc-800">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary-50 dark:bg-primary-900/30">
            <lucide-angular
              [img]="Building2"
              size="18"
              class="text-primary-500 dark:text-primary-200"
              aria-hidden="true" />
          </div>
          <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Total Headcount</span>
        </div>
        <span class="text-2xl font-bold text-gray-900 dark:text-zinc-100">{{ totalHeadcount() }}</span>
      </div>

      @if (loading() && !departments().length) {
      @for (row of skeletonRows; track row) {
      <div class="h-12 animate-pulse rounded-lg bg-gray-100 dark:bg-zinc-800"></div>
      }
      } @else {
      @for (dept of departments(); track dept.id) {
      <div class="rounded-lg bg-primary-contrast px-3 py-2.5 dark:bg-zinc-800">
        <div class="mb-1.5 flex items-center justify-between">
          <span class="text-sm font-medium text-gray-600 dark:text-gray-400">{{ dept.name }}</span>
          <span
            class="text-sm font-semibold"
            [class]="dept.colorClass">
            {{ dept.count }}
          </span>
        </div>
        <div
          class="h-1.5 w-full overflow-hidden rounded-full bg-gray-100 dark:bg-zinc-700"
          role="progressbar"
          [attr.aria-valuenow]="dept.barWidth"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-label]="dept.name + ' headcount ' + dept.count">
          <div
            class="h-full rounded-full transition-all duration-500"
            [class]="dept.barClass"
            [style.width.%]="dept.barWidth"></div>
        </div>
      </div>
      } @empty {
      <app-table-empty-message
        icon="pi pi-sitemap"
        message="No departments yet"
        subMessage="Active departments and their headcount show here" />
      }
      }
    </div>
  </ng-template>
</p-card>
