<p-card styleClass="dash-card-shell">
  <ng-template #header>
    <div class="flex items-center justify-between gap-3 px-5 pt-5">
      <div class="flex items-center gap-3">
        <h4 class="text-xl font-semibold text-color-emphasis dark:text-zinc-100">{{ title() }}</h4>
        @if (badge()) {
        <span
          class="rounded-full bg-primary-100 px-3 py-1 text-sm font-medium text-primary-700 dark:bg-primary-900 dark:text-primary-200">
          {{ badge() }}
        </span>
        }
      </div>
      @if (showActions()) {
      <div class="flex items-center gap-2">
        <p-button
          icon="pi pi-filter"
          [rounded]="true"
          [text]="true"
          size="small"
          pTooltip="Filter"
          tooltipPosition="left"
          [ariaLabel]="'Filter ' + (title() ?? '')"
          styleClass="dark:bg-zinc-800 dark:text-gray-200 hover:dark:bg-zinc-700" />
        <p-button
          icon="pi pi-refresh"
          [rounded]="true"
          [text]="true"
          size="small"
          pTooltip="Refresh Data"
          tooltipPosition="left"
          [ariaLabel]="'Refresh ' + (title() ?? '')"
          styleClass="dark:bg-zinc-800 dark:text-gray-200 hover:dark:bg-zinc-700" />
      </div>
      }
    </div>
  </ng-template>
  <ng-template #content>
    <div class="dash-card-body">
      <ng-content />
    </div>
  </ng-template>
</p-card>
