<app-form-field-shell
  #shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()">
  <p-select
    class="w-full"
    [class.pointer-events-none]="loading()"
    [class.opacity-60]="loading()"
    [attr.aria-busy]="loading()"
    appendTo="body"
    [formField]="$any(field())"
    [inputId]="inputId()"
    [options]="options()"
    [optionLabel]="optionLabel()"
    [optionValue]="optionValue()"
    [placeholder]="placeholder()"
    [loading]="loading()"
    [showClear]="showClear()"
    [filter]="filter()"
    [filterBy]="filterBy()"
    [panelStyleClass]="panelStyleClass()"
    [invalid]="shell.showError()"
    [pt]="{ label: aria() }"
    (onChange)="selectionChange.emit($event)">
    <ng-template #empty>
      <div class="flex max-w-full flex-col items-center justify-center text-center text-gray-500">
        <span class="pi pi-info-circle mb-2 text-3xl! text-primary"></span>
        <div class="mb-1 text-base font-semibold">{{ emptyTitle() }}</div>
        <div class="text-sm">{{ emptyDetail() }}</div>
      </div>
    </ng-template>
    <ng-template #emptyfilter>
      <div class="flex items-center gap-2 text-gray-500">
        <span class="pi pi-search"></span>
        {{ emptyFilterMessage() }}
      </div>
    </ng-template>
  </p-select>
</app-form-field-shell>
