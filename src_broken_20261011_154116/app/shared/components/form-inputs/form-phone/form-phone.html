<app-form-field-shell
  #shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()">
  <p-inputgroup>
    @if (dialCode()) {
      <p-inputgroup-addon>{{ dialCode() }}</p-inputgroup-addon>
    }
    <input
      pInputText
      appTrimInput
      type="tel"
      class="w-full"
      [formField]="field()"
      [id]="inputId()"
      [placeholder]="placeholder() ?? ''"
      [class.p-invalid]="shell.showError()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="shell.showError()"
      [attr.aria-describedby]="inputId() + '-help'" />
  </p-inputgroup>
</app-form-field-shell>
