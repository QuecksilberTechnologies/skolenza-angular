<div class="flex items-start gap-2">
  <p-checkbox
    binary
    [formField]="$any(field())"
    [inputId]="inputId()"
    [invalid]="showError()"
    [pt]="{ input: aria() }" />
  <label
    [for]="inputId()"
    class="cursor-pointer">
    <span class="block font-medium">
      {{ label() }}
      @if (required()) {
        <span
          class="text-red-600 dark:text-red-400"
          aria-hidden="true">*</span>
        <span class="sr-only">(required)</span>
      }
    </span>
  </label>
</div>

<div
  [id]="inputId() + '-help'"
  class="min-h-5"
  aria-live="polite">
  @if (showError() && errorMessage(); as message) {
    <p-message
      severity="error"
      size="small"
      variant="simple">
      <span>{{ message }}</span>
    </p-message>
  } @else if (hint()) {
    <p class="text-xs text-gray-500 dark:text-zinc-400">{{ hint() }}</p>
  }
</div>
