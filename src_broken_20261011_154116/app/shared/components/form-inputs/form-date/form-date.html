<app-form-field-shell
  #shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()">
  <p-datepicker
    class="w-full"
    inputStyleClass="w-full"
    appendTo="body"
    [formField]="$any(field())"
    [inputId]="inputId()"
    [dateFormat]="dateFormat()"
    [showIcon]="showIcon()"
    [showTime]="showTime()"
    [timeOnly]="timeOnly()"
    [showButtonBar]="showButtonBar()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [placeholder]="placeholder() ?? ''"
    [invalid]="shell.showError()"
    [pt]="{ pcInputText: { root: aria() } }" />
</app-form-field-shell>
