<main
  class="auth-surface relative flex min-h-dvh flex-col items-center justify-center bg-zinc-50 p-3 sm:p-5 dark:bg-zinc-900">
  <div
    class="w-full rounded-2xl border border-zinc-200 bg-white p-6 shadow-md sm:p-8 dark:border-zinc-700 dark:bg-zinc-800"
    [class]="width() === 'lg' ? 'max-w-2xl md:max-w-4xl' : 'max-w-xl'">
    @if (logoLink(); as link) {
      <a
        [routerLink]="link"
        class="block rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
        aria-label="Skolenza home">
        <app-auth-header-logo />
      </a>
    } @else {
      <app-auth-header-logo />
    }

    <ng-content select="[card-icon]" />

    <h1 class="mb-2 text-center text-3xl font-bold text-zinc-900 dark:text-zinc-100">{{ heading() }}</h1>

    @if (subheading(); as subtitle) {
      <p class="mb-6 text-center text-base text-zinc-500 dark:text-zinc-400">{{ subtitle }}</p>
    }

    <ng-content />
  </div>
</main>
