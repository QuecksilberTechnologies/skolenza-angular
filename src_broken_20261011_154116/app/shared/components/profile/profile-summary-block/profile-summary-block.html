<div class="flex w-full min-w-0 flex-col gap-0">
  <div class="flex items-center gap-1.5 leading-0">
    <i class="{{ icon() }} text-gray-600 dark:text-gray-300"></i>
    <span class="block text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">{{ label() }}</span>
  </div>
  <div class="flex items-center truncate text-sm text-gray-900 sm:text-base dark:text-zinc-100">
    <ng-content>{{ value() || '-' }}</ng-content>
  </div>
</div>
