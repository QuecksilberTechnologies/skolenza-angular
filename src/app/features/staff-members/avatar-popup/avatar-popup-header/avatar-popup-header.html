<div class="flex items-center gap-3 border-b border-gray-200 pb-3 dark:border-zinc-700">
  <div class="relative shrink-0">
    <app-user-avatar size="large" [imagePath]="summary().profileImage" [name]="staffMember().firstName" />
    <span
      class="absolute right-0 bottom-0 block h-3 w-3 rounded-full ring-2 ring-white dark:ring-zinc-900"
      [class.bg-green-500]="summary().onlineStatus === 'Online'"
      [class.bg-red-400]="summary().onlineStatus === 'Offline'"
      [class.bg-gray-400]="
        summary().onlineStatus !== 'Online' && summary().onlineStatus !== 'Offline'
      "
      [attr.aria-label]="summary().onlineStatus || 'Unknown'"></span>
  </div>

  <div class="flex min-w-0 flex-1 flex-col">
    <span class="truncate font-semibold text-gray-900 dark:text-zinc-100">
      {{ staffMember().firstName }} {{ staffMember().middleName }} {{ staffMember().lastName }}
    </span>
    <span class="truncate text-xs text-gray-500 dark:text-zinc-400">{{ staffMember().officialEmail }}</span>
    @if (staffMember().employementCode) {
    <span
      class="mt-1 inline-flex items-center self-start rounded-md bg-primary-50 px-2 py-0.5 text-[11px] font-medium text-primary-700 ring-1 ring-primary-200 ring-inset dark:bg-primary-900/30 dark:text-primary-300 dark:ring-primary-700/50">
      {{ staffMember().employementCode }}
    </span>
    }
  </div>
</div>
