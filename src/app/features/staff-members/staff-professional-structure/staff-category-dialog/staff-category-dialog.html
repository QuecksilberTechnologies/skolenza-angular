<form class="grid grid-cols-1 gap-4" novalidate (submit)="$event.preventDefault(); save()">
  <app-form-select
    label="Category type"
    inputId="staff-category-type"
    placeholder="Select category type"
    required
    optionLabel="label"
    optionValue="id"
    [options]="categoryTypes()"
    [field]="$any(f.staffCategoryTypeId)"
    [submitted]="submitted()" />
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <app-form-text
      label="Code"
      inputId="staff-category-code"
      placeholder="e.g. TEACH-STAFF"
      required
      codeFormat
      [spellcheck]="false"
      [field]="f.code"
      [submitted]="submitted()" />
    <app-form-text
      label="Name"
      inputId="staff-category-name"
      placeholder="e.g. Teaching Staff"
      required
      [field]="f.name"
      [submitted]="submitted()" />
  </div>
  <app-form-textarea
    label="Description"
    inputId="staff-category-description"
    placeholder="Describe who belongs to this category"
    [field]="f.description"
    [submitted]="submitted()" />
  <app-form-multiselect
    label="Allowed job families"
    inputId="staff-category-job-families"
    placeholder="Select job families"
    optionLabel="name"
    optionValue="id"
    optionDisabled="disabled"
    [options]="jobFamilyOptions"
    [field]="f.staffJobFamilyMasterIds"
    [submitted]="submitted()" />
  <app-form-checkbox label="Active" inputId="staff-category-active" [field]="f.isActive" />

  <div class="flex justify-end gap-2">
    <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
    <p-button type="submit" label="Save" icon="pi pi-check" [loading]="isSaving()" />
  </div>
</form>
