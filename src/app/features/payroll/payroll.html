<div class="h-page overflow-hidden overflow-y-auto">
  @if (isAdmin()) {
  <!-- Stats Cards (Admin/Manager only) -->
  <div class="m-4 flex flex-col">
    @defer { @if (store.isLoading()) {
    <app-payroll-stats-loader />
    } @else {
    <app-payroll-stats [summary]="store.summary()" />
    } } @placeholder (minimum 300ms) {
    <app-payroll-stats-loader />
    }
  </div>
  }

  <!-- Tabs (show only if more than one tab) -->
  @if (tabs().length > 1) {
  <p-tabs
    [value]="activeTab()"
    class="mx-4">
    <p-tablist>
      @for (tab of tabs(); track tab.route) {
      <p-tab
        [value]="tab.route"
        [routerLink]="['./', tab.route]"
        routerLinkActive="active-tab"
        class="flex items-center !gap-2">
        <i [class]="tab.icon"></i>
        <span>{{ tab.label }}</span>
      </p-tab>
      }
    </p-tablist>
  </p-tabs>
  }

  <!-- Routed Content -->
  <div class="mx-4 mt-4 pb-4">
    <router-outlet />
  </div>
</div>
