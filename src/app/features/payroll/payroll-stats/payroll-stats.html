<div class="flex flex-wrap gap-4 md:gap-4">
  <!-- Total StaffMembers Paid -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-green-50 sm:h-12 sm:w-12 dark:bg-green-900/30">
        <i class="pi pi-users text-xl! text-green-500 sm:text-2xl! dark:text-green-300"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ summary().totalStaffMembersPaid }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">StaffMembers Paid</span>
      </div>
    </div>
  </p-card>

  <!-- Total Payroll Cost -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-50 sm:h-12 sm:w-12 dark:bg-blue-900/30">
        <i class="pi pi-indian-rupee text-xl! text-blue-500 sm:text-2xl! dark:text-blue-300"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ summary().totalPayrollCost | currency: 'INR' : 'symbol' : '1.0-0' }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Total Payroll</span>
      </div>
    </div>
  </p-card>

  <!-- Pending Payments -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-50 sm:h-12 sm:w-12 dark:bg-amber-900/30">
        <i class="pi pi-clock text-xl! text-amber-500 sm:text-2xl! dark:text-amber-300"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ summary().pendingPayments }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Pending</span>
      </div>
    </div>
  </p-card>

  <!-- Total StaffMembers -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-id-card text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ summary().totalStaffMembers }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Total StaffMembers</span>
      </div>
    </div>
  </p-card>
</div>
