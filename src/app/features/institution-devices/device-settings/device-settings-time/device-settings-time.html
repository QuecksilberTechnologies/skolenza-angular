<form (submit)="onSubmit(); $event.preventDefault()" class="form-invalid-visible flex flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (item of selectFields; track item.id) {
      <div class="space-y-1">
        <label [for]="item.id" class="block font-medium">{{ item.label }} <span class="text-red-600 dark:text-red-400" aria-hidden="true">*</span></label>
        <p-select
          [inputId]="item.id"
          class="w-full"
          [options]="store.optionsFor(item.key)"
          [loading]="store.isLoadingOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select"
          [invalid]="showError(item.field)"
          [formField]="$any(item.field)" />
        <div [id]="item.id + '-help'" class="min-h-5">
          @if (showError(item.field)) {
            <p-message severity="error" size="small" variant="simple">
              <span>{{ item.field().errors()[0].message }}</span>
            </p-message>
          }
        </div>
      </div>
    }
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    @for (toggle of toggleFields; track toggle.id) {
      <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 p-3 dark:border-zinc-700">
        <label [for]="toggle.id" class="font-medium">{{ toggle.label }}</label>
        <p-toggleswitch [inputId]="toggle.id" [formField]="$any(toggle.field)" />
      </div>
    }
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    @for (item of textFields; track item.id) {
      <div class="space-y-1">
        <label [for]="item.id" class="block font-medium">{{ item.label }}</label>
        <input
          [formField]="item.field"
          pInputText
          type="text"
          [id]="item.id"
          class="w-full"
          [placeholder]="item.placeholder" />
      </div>
    }
  </div>

  <div class="flex justify-end gap-2">
    <p-button
      type="button"
      label="Set clock now"
      icon="pi pi-clock"
      variant="outlined"
      severity="secondary"
      [loading]="isSyncing()"
      (onClick)="syncTimeNow()" />
    <p-button type="submit" label="Push time settings" icon="pi pi-cloud-upload" [loading]="isSaving()" />
  </div>
</form>
