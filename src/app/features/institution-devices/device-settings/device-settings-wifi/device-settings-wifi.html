<form (submit)="onSubmit(); $event.preventDefault()" class="form-invalid-visible flex flex-col gap-4">
  <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 p-3 md:max-w-sm dark:border-zinc-700">
    <label for="dhcpEnabled" class="font-medium">DHCP</label>
    <p-toggleswitch inputId="dhcpEnabled" [formField]="$any(f.dhcpEnabled)" />
  </div>

  @if (!model().dhcpEnabled) {
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      @for (item of textFields; track item.id) {
        <div class="space-y-1">
          <label [for]="item.id" class="block font-medium">{{ item.label }}</label>
          <input
            [formField]="item.field"
            pInputText
            type="text"
            [id]="item.id"
            class="w-full"
            [placeholder]="item.placeholder" />
        </div>
      }
    </div>
  }

  <div class="flex justify-end">
    <p-button type="submit" label="Push WiFi settings" icon="pi pi-cloud-upload" [loading]="isSaving()" />
  </div>
</form>
