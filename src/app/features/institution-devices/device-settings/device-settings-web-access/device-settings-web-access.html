<form (submit)="onSubmit(); $event.preventDefault()" class="form-invalid-visible flex flex-col gap-4">
  <div class="flex items-center justify-between gap-3 rounded-lg border border-gray-200 p-3 md:max-w-sm dark:border-zinc-700">
    <label for="localWebServerEnabled" class="font-medium">Local web UI/API</label>
    <p-toggleswitch inputId="localWebServerEnabled" [formField]="$any(f.localWebServerEnabled)" />
  </div>

  <div class="max-w-sm space-y-1">
    <label for="newWebServerPassword" class="block font-medium">New web console password</label>
    <input
      [formField]="f.newWebServerPassword"
      pInputText
      type="password"
      id="newWebServerPassword"
      class="w-full"
      [class.p-invalid]="showError(f.newWebServerPassword)"
      [attr.aria-invalid]="showError(f.newWebServerPassword)"
      placeholder="Leave blank to keep the current password" />
    <div id="newWebServerPassword-help" class="min-h-5">
      @if (showError(f.newWebServerPassword)) {
        <p-message severity="error" size="small" variant="simple">
          <span>{{ f.newWebServerPassword().errors()[0].message }}</span>
        </p-message>
      }
    </div>
  </div>

  <div class="flex justify-end">
    <p-button type="submit" label="Push web access settings" icon="pi pi-cloud-upload" [loading]="isSaving()" />
  </div>
</form>
