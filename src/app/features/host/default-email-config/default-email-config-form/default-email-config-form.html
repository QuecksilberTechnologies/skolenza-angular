<div class="relative h-full overflow-y-auto">
  <form
    (submit)="onSubmit(); $event.preventDefault()"
    class="flex min-h-full w-full flex-col">
    @if (isLoading()) {
      <div
        class="mx-auto flex w-full max-w-5xl flex-col gap-4 px-3 pt-3 pb-6 sm:px-4 sm:pt-4"
        role="status">
        <span class="sr-only">Loading configuration...</span>
        <app-section-card
          icon="pi pi-envelope"
          heading="SMTP account"
          subheading="The mail server the platform authenticates against.">
          <div class="mt-2 grid grid-cols-1 gap-4 md:grid-cols-2">
            <app-skeleton-field slot />
            <app-skeleton-field
              hint
              slot />
            <app-skeleton-field slot />
            <app-skeleton-field slot />
          </div>
        </app-section-card>
        <app-section-card
          icon="pi pi-send"
          heading="Sender"
          subheading="What recipients see in the From line.">
          <div class="mt-2 grid grid-cols-1 gap-4 md:grid-cols-2">
            <app-skeleton-field slot />
            <app-skeleton-field slot />
          </div>
        </app-section-card>
      </div>
    } @else {
      <div class="mx-auto flex w-full max-w-5xl flex-col gap-4 px-3 pt-3 pb-6 sm:px-4 sm:pt-4">
        <!-- SMTP account -->
        <app-section-card
          icon="pi pi-envelope"
          heading="SMTP account"
          subheading="The mail server the platform authenticates against.">
          @if (isEditMode) {
            <!-- Every field here hydrates except the password, which the API never returns. Say
                 so, or the one blank field in a filled section reads as a bug. -->
            <p
              class="mt-2 flex items-start gap-2 rounded-lg border border-sky-300 bg-sky-50 p-3 text-xs text-sky-800 dark:border-sky-700 dark:bg-sky-950 dark:text-sky-200"
              role="status">
              <i
                class="pi pi-info-circle mt-0.5"
                aria-hidden="true"></i>
              <span>
                The API never returns the stored password. Leave it blank to keep the current one.
              </span>
            </p>
          }
          <div class="mt-2 grid grid-cols-1 gap-4 md:grid-cols-2">
            <app-form-text
              label="Configuration name"
              inputId="configName"
              icon="pi pi-tag"
              placeholder="e.g. Default Gmail"
              required
              [field]="f.configName"
              [submitted]="submitted()" />

            <app-form-text
              label="SMTP host"
              inputId="smtpHost"
              icon="pi pi-server"
              placeholder="e.g. smtp.acme.com"
              required
              [field]="f.smtpHost"
              [submitted]="submitted()" />

            <app-form-number
              label="SMTP port"
              inputId="smtpPort"
              placeholder="e.g. 587"
              hint="587 for STARTTLS, 465 for implicit TLS"
              required
              [useGrouping]="false"
              [min]="1"
              [max]="65535"
              [field]="f.smtpPort"
              [submitted]="submitted()" />

            <app-form-text
              label="SMTP username"
              inputId="smtpUsername"
              placeholder="e.g. no-reply@acme.com"
              autocomplete="off"
              required
              [field]="f.smtpUsername"
              [submitted]="submitted()" />

            <app-form-password
              label="SMTP password"
              inputId="smtpPassword"
              icon="pi pi-lock"
              placeholder="Account password or app password"
              [hint]="
                isEditMode
                  ? 'Leave blank to keep the current password'
                  : 'Stored encrypted by the server'
              "
              autocomplete="new-password"
              [required]="!isEditMode"
              [field]="f.smtpPassword"
              [submitted]="submitted()" />
          </div>
        </app-section-card>

        <!-- Sender -->
        <app-section-card
          icon="pi pi-send"
          heading="Sender"
          subheading="What recipients see in the From line.">
          <div class="mt-2 grid grid-cols-1 gap-4 md:grid-cols-2">
            <app-form-text
              type="email"
              label="From email"
              inputId="fromEmail"
              icon="pi pi-envelope"
              placeholder="e.g. no-reply@acme.com"
              required
              [field]="f.fromEmail"
              [submitted]="submitted()" />

            <app-form-text
              label="From name"
              inputId="fromName"
              placeholder="e.g. Skolenza"
              required
              [field]="f.fromName"
              [submitted]="submitted()" />
          </div>
        </app-section-card>

        <!-- Availability -->
        <app-section-card
          icon="pi pi-sliders-h"
          heading="Availability"
          subheading="Which configuration new institutions inherit.">
          <fieldset class="mt-2 grid grid-cols-1 gap-4 md:grid-cols-2">
            <legend class="sr-only">Availability</legend>
            <app-form-switch
              label="Active"
              inputId="isActive"
              hint="Turn off to keep the record without sending mail through it"
              [field]="f.isActive" />
            <app-form-switch
              label="Default for new institutions"
              inputId="isDefault"
              hint="Copied into a institution's own email settings when it self-registers"
              [field]="f.isDefault" />
          </fieldset>
        </app-section-card>
      </div>
    }

    <app-form-action-bar
      [submitLabel]="isEditMode ? 'Save changes' : 'Add configuration'"
      [saving]="isSaving()"
      [disabled]="isSaving() || isLoading()"
      [errorMessage]="
        submitted() && f().invalid() ? 'Fix the highlighted fields before saving.' : ''
      "
      (cancelled)="onCancel()" />
  </form>
</div>
