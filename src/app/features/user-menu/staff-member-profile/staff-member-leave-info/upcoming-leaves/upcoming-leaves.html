<section class="mb-4">
  <h2 class="mb-2 text-lg font-semibold text-zinc-900 dark:text-zinc-50">Upcoming Leaves</h2>
  <div class="overflow-x-auto rounded-[0.8rem] border border-zinc-200 dark:border-zinc-800">
    <p-table
      [value]="upcomingLeaves()"
      [tableStyle]="{ 'min-width': '40rem' }">
      <ng-template #header>
        <tr>
          <th class="w-1/4 bg-gray-50! dark:bg-zinc-800!">Type</th>
          <th class="w-2/5 bg-gray-50! dark:bg-zinc-800!">Dates</th>
          <th class="bg-gray-50! dark:bg-zinc-800!">Status</th>
          <th class="w-24 bg-gray-50! text-right! dark:bg-zinc-800!">Days</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-leave>
        @let start = leave.startDate | date: 'mediumDate';
        @let end = leave.endDate | date: 'mediumDate';
        <tr>
          <td>{{ leave.type }}</td>
          <td>{{ start === end ? start : start + ' – ' + end }}</td>
          <td>
            <p-tag
              [value]="leave.status"
              [severity]="getStatusSeverity(leave.status)" />
          </td>
          <td class="text-right! tabular-nums">{{ leave.days }}</td>
        </tr>
      </ng-template>
      <ng-template #loadingbody />
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <app-table-empty-message
              icon="pi pi-calendar"
              message="No upcoming leaves"
              subMessage="You have no upcoming leaves scheduled" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
