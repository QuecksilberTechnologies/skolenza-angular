<section class="mb-4">
  <h2 class="mb-2 text-lg font-semibold text-zinc-900 dark:text-zinc-50">Leave History</h2>
  <div class="overflow-x-auto rounded-card border border-zinc-200 dark:border-zinc-800">
    <p-table
      [value]="leaveHistory()"
      [tableStyle]="{ 'min-width': '48rem' }">
      <ng-template #header>
        <tr>
          <th class="w-1/6 bg-gray-50! dark:bg-zinc-800!">Type</th>
          <th class="w-1/4 bg-gray-50! dark:bg-zinc-800!">Dates</th>
          <th class="bg-gray-50! dark:bg-zinc-800!">Reason</th>
          <th class="w-28 bg-gray-50! dark:bg-zinc-800!">Status</th>
          <th class="w-40 bg-gray-50! dark:bg-zinc-800!">Approved By</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-leave>
        @let start = leave.startDate | date: 'mediumDate';
        @let end = leave.endDate | date: 'mediumDate';
        <tr>
          <td>{{ leave.type }}</td>
          <td>{{ start === end ? start : start + ' – ' + end }}</td>
          <td>{{ leave.reason }}</td>
          <td>
            <p-tag
              [value]="leave.statusText"
              [severity]="getStatusSeverity(leave.statusText)" />
          </td>
          <td>{{ leave.approvedBy || '--' }}</td>
        </tr>
      </ng-template>
      <ng-template #loadingbody />
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <app-table-empty-message
              icon="pi pi-history"
              message="No leave history"
              subMessage="Your leave history will appear here" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
