<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <p class="text-sm text-gray-500 dark:text-zinc-400">
    Set the PIN this staffMember enters on {{ deviceName }}. The PIN is stored on the device only and
    is never shown again, so note it down before you save.
  </p>

  <div class="space-y-1">
    <label
      for="pin"
      class="block font-medium">
      PIN
      <span class="text-red-600 dark:text-red-400">*</span>
    </label>
    <input
      pInputText
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      class="w-full"
      placeholder="Enter PIN"
      aria-describedby="pin-help"
      [class.p-invalid]="showError(f.pin)"
      [attr.aria-invalid]="showError(f.pin)"
      [formField]="$any(f.pin)" />
    <div
      id="pin-help"
      class="min-h-5"
      aria-live="polite">
      @if (showError(f.pin)) {
        <p-message
          severity="error"
          size="small"
          variant="simple">
          <span>{{ f.pin().errors()[0].message }}</span>
        </p-message>
      }
    </div>
  </div>

  <div class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
    <p-button
      type="button"
      label="Cancel"
      [variant]="'text'"
      [severity]="'secondary'"
      (onClick)="onCancel()" />
    <p-button
      type="submit"
      label="Set PIN"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="isSaving()" />
  </div>
</form>
