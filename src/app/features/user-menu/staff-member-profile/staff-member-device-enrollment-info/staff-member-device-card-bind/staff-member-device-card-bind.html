<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <p class="text-sm text-gray-500 dark:text-zinc-400">
    Bind a host-issued card to the enrollment on {{ deviceName }}. Only cards issued to this institution
    and still available can be bound.
  </p>

  <div class="space-y-1">
    <label
      for="institutionCardId"
      class="block font-medium">
      Card
      <span class="text-red-600 dark:text-red-400">*</span>
    </label>
    <p-select
      inputId="institutionCardId"
      class="w-full"
      [options]="cards"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      placeholder="Select card"
      emptyMessage="No available cards"
      [invalid]="showError(f.institutionCardId)"
      [formField]="$any(f.institutionCardId)" />
    <div
      id="institutionCardId-help"
      class="min-h-5"
      aria-live="polite">
      @if (showError(f.institutionCardId)) {
        <p-message
          severity="error"
          size="small"
          variant="simple">
          <span>{{ f.institutionCardId().errors()[0].message }}</span>
        </p-message>
      }
    </div>
  </div>

  <div class="flex items-center justify-end gap-2 border-t border-zinc-200 pt-4 dark:border-zinc-700">
    <p-button
      type="button"
      label="Cancel"
      [variant]="'text'"
      [severity]="'secondary'"
      (onClick)="onCancel()" />
    <p-button
      type="submit"
      label="Bind card"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="isSaving()" />
  </div>
</form>
