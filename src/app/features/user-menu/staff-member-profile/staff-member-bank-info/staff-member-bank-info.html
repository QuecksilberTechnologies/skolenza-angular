<p-card class="flex min-h-[calc(100vh-10.2rem)] w-full flex-col gap-8 md:p-2">
  @let banks = staffMemberBanks(); @if (isLoading() && banks.length === 0) {
  <app-profile-loader />
  } @else { @if (banks && banks.length > 0) {
  <app-profile-header
    #profileHeader
    [actionLabel]="'Add Bank'"
    [id]="banks[0].id"
    [employementCode]="'N/A'"
    [completionPercentage]="completionPercentage()"
    [isInfoVerified]="banks[0]?.isInfoVerified || false"
    [isEditAllowed]="banks[0]?.isEditAllowed || false"
    [isVerifying]="isVerifying()"
    [isEditing]="isEditing()"
    [roleTypeId]="loginInfo?.user?.primaryRole?.roleTypeId"
    [tabInfoType]="tabInfoType"
    (create)="addEditBank()"
    (refresh)="getStaffMemberBanks()"
    (updateVerifyStatus)="updateVerifyStatus($event, banks[0].id)"
    (updateEditStatus)="updateEditStatus($event)" />

  <!-- Bank accounts listing -->
  @for (bank of banks; track $index) {
  <app-profile-info-card>
    <!-- Bank Name -->
    <app-profile-info-block
      label="Bank Name"
      [value]="bank.bankName"
      [logoSrc]="bank.bankName | getPaymentLogo" />

    <!-- Account Number -->
    <app-profile-info-block
      label="Account Number"
      [value]="!bank.accountNumberMasked ? mask(bank.accountNumber) : bank.accountNumber"
      [isMask]="true"
      [isMasked]="bank.accountNumberMasked"
      (toggleMask)="toggleMask(bank.id, 'accountNumber')" />

    <!-- IFSC Code -->
    <app-profile-info-block
      label="IFSC Code"
      [value]="!bank.ifscCodeMasked ? mask(bank.ifscCode) : bank.ifscCode"
      [isMask]="true"
      [isMasked]="bank.ifscCodeMasked"
      (toggleMask)="toggleMask(bank.id, 'ifscCode')" />

    <!-- Branch Name -->
    <app-profile-info-block
      label="Branch Name"
      [value]="bank.branchName" />

    <!-- Account Type -->
    <app-profile-info-block label="Account Type">
      @if (bank.accountType) {
      <span class="capitalize">{{ bank.accountType }}</span>
      } @else {
      <span>-</span>
      }
    </app-profile-info-block>

    <!-- UPI Id -->
    <app-profile-info-block
      label="UPI ID"
      [value]="!bank.upiIdMasked ? mask(bank.upiId) : bank.upiId"
      [logoSrc]="'UPI' | getPaymentLogo"
      [isMask]="true"
      [isMasked]="bank.upiIdMasked"
      (toggleMask)="toggleMask(bank.id, 'upiId')" />

    <!-- Primary Account -->
    <app-profile-info-block
      label="Primary Account"
      [value]="bank.isPrimaryAccount ? 'Yes' : 'No'" />

    <!-- Has Cheque Uploaded? -->
    <app-profile-info-block
      label="Has Cheque Uploaded?"
      [value]="bank.hasChequeDocUploaded ? 'Yes' : 'No'" />
    @if (bank?.hasChequeDocUploaded) {
    <app-profile-document-block
      label="Cancelled Cheque"
      [fileName]="bank.fileName"
      [filePath]="bank.filePath"
      [fileType]="bank.fileType" />
    }

    <app-profile-block-actions
      ngProjectAs="actions"
      [roleTypeId]="loginInfo?.user?.primaryRole?.roleTypeId"
      [completionPercentage]="bank?.completionPercentage"
      [isEditAllowed]="bank.isEditAllowed"
      (edit)="addEditBank(bank)"
      (remove)="removeBank(bank)" />
  </app-profile-info-card>
  } @empty {
  <app-profile-empty
    [message]="profileEmptyMessage"
    [description]="profileEmptyDescription"
    [tabIcon]="profileEmptyTabIcon"
    [roleTypeId]="loginInfo?.user?.primaryRole?.roleTypeId"
    (retry)="getStaffMemberBanks()"
    (add)="addEditBank()" />
  } } @else {
  <app-profile-empty
    [message]="profileEmptyMessage"
    [description]="profileEmptyDescription"
    [tabIcon]="profileEmptyTabIcon"
    [roleTypeId]="loginInfo?.user?.primaryRole?.roleTypeId"
    (retry)="getStaffMemberBanks()"
    (add)="addEditBank()" />
  } }
</p-card>

<p-confirmDialog />
