<section
  class="bg-surface-light p-3 sm:p-4 dark:bg-surface-dark"
  aria-labelledby="settings-panel-heading">
  <div class="max-w-3xl space-y-4 sm:space-y-6">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6">
      <!-- System Language -->
      <div>
        <label
          class="mb-1.5 block text-sm font-medium text-text-primary-light dark:text-text-primary-dark"
          for="language">
          System Language
        </label>
        <p class="mb-2 text-xs text-text-secondary-light dark:text-text-secondary-dark">
          Determines the text language of the interface.
        </p>
        <p-select
          [options]="languages"
          [ngModel]="getSelectedLanguage()"
          (ngModelChange)="onLanguageChange($event)"
          optionLabel="name"
          placeholder="Select a Language"
          class="w-full"
          inputId="language">
          <ng-template
            #selectedItem
            let-selectedOption>
            <div class="flex items-center gap-2">
              <img
                [src]="
                  'https://flagcdn.com/w20/' + selectedOption.countryCode.toLowerCase() + '.png'
                "
                [alt]="selectedOption.name + ' flag'"
                class="h-auto w-5 rounded-sm" />
              <span>{{ selectedOption.name }}</span>
            </div>
          </ng-template>
          <ng-template
            #item
            let-language>
            <div class="flex items-center gap-2">
              <img
                [src]="'https://flagcdn.com/w20/' + language.countryCode.toLowerCase() + '.png'"
                [alt]="language.name + ' flag'"
                class="h-auto w-5 rounded-sm" />
              <span>{{ language.name }}</span>
            </div>
          </ng-template>
        </p-select>
      </div>

      <!-- Date Format -->
      <div>
        <label
          class="mb-1.5 block text-sm font-medium text-text-primary-light dark:text-text-primary-dark"
          for="date-format">
          Date Format
        </label>
        <p class="mb-2 text-xs text-text-secondary-light dark:text-text-secondary-dark">
          Format used for attendance logs and payslips.
        </p>
        <p-select
          [options]="dateFormats"
          [ngModel]="getSelectedDateFormat()"
          (ngModelChange)="onDateFormatChange($event)"
          optionLabel="label"
          placeholder="Select a Date Format"
          class="w-full"
          inputId="date-format" />
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6">
      <!-- Time Format -->
      <div>
        <label
          class="mb-1.5 block text-sm font-medium text-text-primary-light dark:text-text-primary-dark"
          for="time-format">
          Time Format
        </label>
        <p class="mb-2 text-xs text-text-secondary-light dark:text-text-secondary-dark">
          Format used for shift schedules and time logs.
        </p>
        <p-select
          [options]="timeFormats"
          [ngModel]="getSelectedTimeFormat()"
          (ngModelChange)="onTimeFormatChange($event)"
          optionLabel="label"
          placeholder="Select a Time Format"
          class="w-full"
          inputId="time-format" />
      </div>

      <!-- Time Zone -->
      <div>
        <label
          class="mb-1.5 block text-sm font-medium text-text-primary-light dark:text-text-primary-dark"
          for="timezone">
          Time Zone
        </label>
        <p class="mb-2 text-xs text-text-secondary-light dark:text-text-secondary-dark">
          Needed for correct time tracking.
        </p>
        <p-select
          [options]="timezones"
          [ngModel]="getSelectedTimezone()"
          (ngModelChange)="onTimezoneChange($event)"
          optionLabel="label"
          placeholder="Select a Time Zone"
          class="w-full"
          inputId="timezone" />
      </div>
    </div>
  </div>
</section>
