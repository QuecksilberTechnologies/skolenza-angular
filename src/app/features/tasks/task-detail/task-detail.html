<p-confirmDialog />

@if (isLoading()) {
<div class="flex h-64 items-center justify-center text-gray-400">
  <i class="pi pi-spin pi-spinner text-2xl"></i>
</div>
} @else if (task(); as t) {
<div class="flex flex-col gap-4">
  <!-- Header -->
  <p-card>
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="flex min-w-0 flex-col gap-2">
        <div class="flex items-center gap-2 text-xs text-gray-400">
          <button
            type="button"
            (click)="back()"
            class="hover:text-primary-500">
            <i class="pi pi-arrow-left"></i>
            Back to tasks
          </button>
          <span>·</span>
          <span>{{ t.id }}</span>
        </div>
        <h1 class="text-xl font-semibold text-gray-900 dark:text-zinc-50">{{ t.title }}</h1>
        <div class="flex flex-wrap items-center gap-2">
          <app-task-status-tag [status]="t.status" />
          <app-task-priority-badge [priority]="t.priority" />
          @if (t.isRecurring) {
          <span class="flex items-center gap-1 text-xs text-gray-400">
            <i class="pi pi-replay"></i>
            Recurring
          </span>
          }
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <p-select
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="t.status"
          (ngModelChange)="onStatusChange($event)"
          styleClass="w-44"
          ariaLabel="Change status" />
        @if (canApprove()) {
        <p-button
          label="Approve"
          icon="pi pi-check-circle"
          severity="success"
          (onClick)="approve()" />
        } @if (canManage()) {
        <p-button
          label="Edit"
          icon="pi pi-pencil"
          [outlined]="true"
          (onClick)="edit()" />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          (onClick)="confirmDelete()"
          ariaLabel="Delete task" />
        }
      </div>
    </div>
  </p-card>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    <!-- Left: summary + checklist + comments -->
    <div class="flex flex-col gap-4 lg:col-span-2">
      <p-card>
        <app-task-summary [task]="t" />
      </p-card>

      @if (t.checklist.length) {
      <p-card>
        <app-task-checklist
          [items]="t.checklist"
          (itemToggle)="toggleChecklist($event)" />
      </p-card>
      }

      <p-card>
        <app-task-comments
          [comments]="t.comments"
          (add)="addComment($event)" />
      </p-card>
    </div>

    <!-- Right: attachments + activity -->
    <div class="flex flex-col gap-4">
      <p-card>
        <app-task-attachments
          [attachments]="t.attachments"
          [canUpload]="canManage()"
          (upload)="onUpload()" />
      </p-card>
      <p-card>
        <app-task-activity [activity]="t.activity" />
      </p-card>
    </div>
  </div>
</div>
}
