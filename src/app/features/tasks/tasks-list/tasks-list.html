<p-confirmDialog />

<p-card>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <app-task-filter-bar
        [search]="store.searchTerm()"
        [filters]="store.filters()"
        [categories]="meta().categories"
        [assignees]="meta().assignees"
        [filterCount]="store.appliedFilterCount()"
        (searchChange)="onSearch($event)"
        (filterChange)="onFilterChange($event)"
        (clear)="clearFilters()" />

      <div class="flex items-center gap-2">
        <p-button
          label="Export"
          icon="pi pi-download"
          severity="secondary"
          [outlined]="true"
          (onClick)="exportCsv()" />
        @if (canManage()) {
        <p-button
          label="New Task"
          icon="pi pi-plus"
          (onClick)="create()" />
        }
      </div>
    </div>

    <p-table
      #dt
      [value]="store.pagedTasks()"
      [lazy]="true"
      (onLazyLoad)="onLazyLoad($event)"
      [totalRecords]="store.totalRecords()"
      [rows]="store.pageSize()"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 20, 50]"
      [loading]="store.isLoading()"
      [customSort]="true"
      dataKey="id"
      styleClass="p-datatable-sm"
      [tableStyle]="{ 'min-width': '60rem' }"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} tasks"
      [showCurrentPageReport]="true">
      <ng-template #header>
        <tr>
          <th pSortableColumn="title">
            Title
            <p-sortIcon field="title" />
          </th>
          <th pSortableColumn="status">
            Status
            <p-sortIcon field="status" />
          </th>
          <th pSortableColumn="priority">
            Priority
            <p-sortIcon field="priority" />
          </th>
          <th>Assignee</th>
          <th pSortableColumn="dueDate">
            Due
            <p-sortIcon field="dueDate" />
          </th>
          <th class="w-48">Progress</th>
          <th class="w-16"></th>
        </tr>
      </ng-template>

      <ng-template
        #body
        let-task>
        <tr
          class="cursor-pointer"
          (click)="view(task)">
          <td>
            <div class="flex flex-col">
              <span class="font-medium text-gray-900 dark:text-zinc-100">{{ task.title }}</span>
              <span class="text-xs text-gray-400">{{ task.id }} · {{ task.category }}</span>
            </div>
          </td>
          <td><app-task-status-tag [status]="task.status" /></td>
          <td><app-task-priority-badge [priority]="task.priority" /></td>
          <td class="text-sm whitespace-nowrap">{{ task.assigneeName }}</td>
          <td class="text-sm whitespace-nowrap">{{ task.dueDate | date: 'MMM d, y' }}</td>
          <td><app-task-progress [value]="task.progress" /></td>
          <td (click)="$event.stopPropagation()">
            <p-button
              icon="pi pi-ellipsis-v"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              (onClick)="openRowMenu(task); menu.toggle($event)"
              ariaLabel="Task actions" />
            <p-menu
              #menu
              [model]="actionMenuItems"
              [popup]="true"
              appendTo="body" />
          </td>
        </tr>
      </ng-template>

      <ng-template #loadingbody>
        <tr>
          <td colspan="7"><app-table-loader /></td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="7">
            <app-table-empty-message message="No tasks match your filters." />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-card>
