<div class="h-page overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4">
    <p-table
      #dt
      [value]="roles()"
      [loading]="isLoadingRoles() || isDeletingRole()"
      [showLoader]="false"
      [lazy]="true"
      [paginator]="true"
      [showCurrentPageReport]="true"
      [rows]="pageSize()"
      [rowsPerPageOptions]="[10, 25, 50]"
      [totalRecords]="totalRecords()"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [globalFilterFields]="['roleName']"
      [selectionMode]="'single'"
      [sortMode]="'single'"
      [sortOrder]="-1"
      [scrollable]="true"
      scrollDirection="horizontal"
      [tableStyle]="{ 'min-width': '52rem' }"
      paginatorDropdownAppendTo="body"
      [(contextMenuSelection)]="selectedRow"
      [contextMenu]="actionContextMenu"
      (onLazyLoad)="getRoles($event)">
      <ng-template #caption>
        <app-table-inline-filters>
          <!-- Basic filter  -->
          <p-select
            [options]="roleTypes()"
            optionLabel="name"
            optionValue="id"
            placeholder=" Select Role"
            [appendTo]="'body'"
            class="w-full min-w-52"
            [showClear]="true"
            (onChange)="onRoleTypeChange($event.value)">
            <ng-template
              let-roleType
              #item>
              <div class="w-52 truncate">{{ roleType.name }}</div>
            </ng-template>
          </p-select>

          <p-select
            [options]="statusOptions"
            optionLabel="status"
            optionValue="value"
            placeholder=" Select Status"
            [appendTo]="'body'"
            class="w-full min-w-52"
            [ngModel]="appliedFilters()?.status ?? null"
            (onChange)="onStatusChange($event.value)" />

          <!-- Advance filter -->
          <app-table-search-filter [filterCount]="appliedFilterCount()" />

          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input (searchTerm)="searchRoles($event)" />
            @if ((loginInfo()?.user?.primaryRole?.roleTypeId ?? 2) !== 2) {
            <p-splitbutton
              class="w-full lg:w-auto"
              label="Add Role"
              icon="pi pi-plus"
              [model]="roleSplitButtonItems"
              appendTo="body"
              expandAriaLabel="More role actions"
              (onClick)="upsertRole()" />
            }
          </div>
        </app-table-inline-filters>
      </ng-template>
      <ng-template #colgroup>
        <colgroup>
          <col style="width: 13rem" />
          <col style="width: 10rem" />
          <col style="width: 13rem" />
          <col style="width: 9rem" />
          <col style="width: 7rem" />
        </colgroup>
      </ng-template>
      <ng-template #header>
        <tr>
          <th
            pSortableColumn="roleName"
            class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Name
              <p-sortIcon field="roleName" />
            </div>
          </th>
          <th
            pSortableColumn="roleTypeName"
            class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Role Type
              <p-sortIcon field="roleTypeName" />
            </div>
          </th>
          <th
            pSortableColumn="remark"
            class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Remark
              <p-sortIcon field="remark" />
            </div>
          </th>
          <th
            pSortableColumn="isActive"
            class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Status
              <p-sortIcon field="isActive" />
            </div>
          </th>
          <th class="px-3! py-2.5! align-middle whitespace-nowrap">Actions</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-role>
        <tr [pContextMenuRow]="role">
          <td class="px-3! py-2.5! align-middle">
            <div class="truncate">{{ role.roleName }}</div>
          </td>
          <td class="px-3! py-2.5! align-middle">
            <div class="truncate">{{ role.roleTypeName }}</div>
          </td>
          <td class="px-3! py-2.5! align-middle">
            <div class="truncate">{{ role.remark || '-' }}</div>
          </td>
          <td class="px-3! py-2.5! align-middle whitespace-nowrap">
            <p-tag
              [value]="role.isActive ? 'Active' : 'Inactive'"
              [severity]="role.isActive ? 'success' : 'danger'" />
          </td>
          <td class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              @if (canUpdate()) {
              <p-button
                class="text-xl!"
                [icon]="role.isActive ? 'pi pi-check-circle' : 'pi pi-ban'"
                [severity]="role.isActive ? 'success' : 'danger'"
                [pTooltip]="role.isActive ? 'Deactivate' : 'Activate'"
                tooltipPosition="left"
                [showDelay]="300"
                [loading]="updatingStatusRoleId() === role.id"
                [ariaLabel]="(role.isActive ? 'Deactivate ' : 'Activate ') + (role.roleName || 'role')"
                (onClick)="confirmToggleStatus(role)" />
              }
              <app-table-action-button
                [disabled]="!role?.id"
                [ariaLabel]="'Actions for ' + (role?.roleName || 'role')"
                (action)="selectedRow = role; actionMenu.toggle($event)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @if (roles().length === 0) {
        <tr>
          <td colspan="5">
            <app-table-loader />
          </td>
        </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <app-table-empty-message
              icon="pi pi-shield"
              message="No roles found"
              subMessage="Create a new role to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems"
  appendTo="body" />
<p-confirmDialog />
