<div class="rounded-xl border border-zinc-200 bg-white p-5 dark:border-zinc-800 dark:bg-zinc-900">
  <div class="mb-3 flex items-start justify-between gap-4">
    <span class="text-xs font-medium text-zinc-400">{{ detail().ticketNumber }}</span>
    <div class="flex shrink-0 items-center gap-1">
      <p-button
        label="Edit"
        icon="pi pi-pencil"
        variant="text"
        severity="secondary"
        size="small"
        (onClick)="editClick.emit()" />
      <p-button
        label="Copy link"
        icon="pi pi-link"
        variant="text"
        severity="secondary"
        size="small"
        (onClick)="copyLinkClick.emit()" />
    </div>
  </div>
  <h1 class="mb-3 text-xl font-bold text-zinc-900 dark:text-zinc-50">{{ detail().title }}</h1>
  <div class="flex flex-wrap items-center gap-4 text-sm">
    <app-property-picker-cell
      label="Status"
      [currentValue]="detail().status"
      [options]="statusOptions"
      (valueChange)="store.setTicketDetailStatus($event)" />
    <app-property-picker-cell
      label="Priority"
      [currentValue]="detail().priority"
      [options]="priorityOptions"
      (valueChange)="store.setTicketDetailPriority($event)" />
    <span class="text-xs text-zinc-400">
      Opened by
      <strong class="text-zinc-700 dark:text-zinc-300">{{ detail().requester.name }}</strong>
      · {{ detail().createdAt | date: 'dd MMM yyyy, HH:mm' }}
    </span>
  </div>
</div>
