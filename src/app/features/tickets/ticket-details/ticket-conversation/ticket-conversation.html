<div
  class="flex flex-col"
  role="log"
  aria-live="polite">
  @for (msg of conversations(); track msg.id; let last = $last) {
  <div
    class="flex gap-3"
    [attr.aria-label]="
        'Comment by ' + msg.sender + ' (' + (msg.role === 'agent' ? 'Assignee' : 'Requester') + ')'
      ">
    <!-- Timeline avatar + connector -->
    <div class="flex flex-col items-center">
      <app-user-avatar [name]="msg.initial" avatarClass="h-8! w-8! text-xs! ring-2 ring-white dark:ring-zinc-900" />
      @if (!last) {
      <div class="my-1 min-h-4 w-0.5 flex-1 bg-zinc-200 dark:bg-zinc-700"></div>
      }
    </div>

    <!-- Event content -->
    <div class="flex-1 pb-5">
      <div class="mb-2 flex items-baseline gap-2">
        <span class="text-sm font-semibold text-zinc-900 dark:text-zinc-100">{{ msg.sender }}</span>
        <span
          class="rounded px-1.5 py-0.5 text-[10px] font-medium tracking-wide uppercase"
          [class]="
              msg.role === 'agent'
                ? 'bg-orange-50 text-orange-700 dark:bg-orange-900/20 dark:text-orange-400'
                : 'bg-zinc-100 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400'
            ">
          {{ msg.role === 'agent' ? 'Agent' : 'Requester' }}
        </span>
        <span class="text-xs text-zinc-400">commented</span>
        <span class="text-xs text-zinc-400">{{ msg.timestamp }}</span>
      </div>
      <div
        class="rounded-lg border p-3 text-sm"
        [class]="
            msg.role === 'agent'
              ? 'bg-orange-50 dark:bg-orange-900/10 border-orange-100 dark:border-orange-800/30 text-zinc-700 dark:text-zinc-300'
              : 'bg-zinc-50 dark:bg-zinc-800/40 border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300'
          ">
        {{ msg.message }}
      </div>
    </div>
  </div>
  }
</div>
