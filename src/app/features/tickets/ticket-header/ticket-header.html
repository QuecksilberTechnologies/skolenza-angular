<div class="h-[calc(100vh-4.6rem)] overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4">
    <p-table
      #dt
      [value]="headers()"
      [lazy]="true"
      [showLoader]="false"
      [paginator]="true"
      [rows]="pageSize()"
      [totalRecords]="totalRecords()"
      [loading]="isLoading()"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [rowsPerPageOptions]="[10, 25, 50]"
      [rowHover]="true"
      [scrollable]="true"
      scrollDirection="horizontal"
      [tableStyle]="{ 'min-width': '48rem' }"
      paginatorDropdownAppendTo="body"
      [(contextMenuSelection)]="selectedRow"
      [contextMenu]="actionContextMenu"
      (onLazyLoad)="getHeaders($event)">
      <ng-template #caption>
        <app-table-inline-filters>
          <!-- Basic filter -->
          <p-select
            [options]="classificationOptions()"
            optionLabel="classificationName"
            optionValue="id"
            placeholder="All Classifications"
            [ngModel]="
              headerSelectedClassificationId() !== null ? +headerSelectedClassificationId()! : null
            "
            [showClear]="true"
            appendTo="body"
            (onChange)="onClassificationChange($event.value)"
            class="w-full min-w-0 lg:min-w-52" />

          <!-- Advance filter -->
          <app-table-search-filter [filterCount]="0" />

          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input
              placeholder="Search headers..."
              (searchTerm)="onSearch($event)" />
            <p-button
              label="Add Header"
              icon="pi pi-plus"
              styleClass="w-full lg:w-auto"
              (onClick)="createEditHeader()" />
          </div>
        </app-table-inline-filters>
      </ng-template>
      <ng-template #colgroup>
        <colgroup>
          <col style="width: 16rem" />
          <col style="width: 14rem" />
          <col style="width: 24rem" />
          <col style="width: 8rem" />
          <col style="width: 6rem" />
        </colgroup>
      </ng-template>
      <ng-template #header>
        <tr>
          <th
            pSortableColumn="headerName"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Header Name
            <p-sortIcon field="headerName" />
          </th>
          <th
            pSortableColumn="classificationName"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Classification
            <p-sortIcon field="classificationName" />
          </th>
          <th
            pSortableColumn="description"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Description
            <p-sortIcon field="description" />
          </th>
          <th
            pSortableColumn="isActive"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Status
            <p-sortIcon field="isActive" />
          </th>
          <th class="!px-3 !py-2.5 align-middle whitespace-nowrap">Actions</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-header>
        <tr [pContextMenuRow]="header">
          <td class="!px-3 !py-2.5 align-middle">{{ header.headerName }}</td>
          <td class="!px-3 !py-2.5 align-middle">{{ header.ticketClassificationName || '-' }}</td>
          <td class="!px-3 !py-2.5 align-middle">{{ header.description || '-' }}</td>
          <td class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <p-tag
              [value]="header.isActive ? 'Active' : 'Inactive'"
              [severity]="header.isActive ? 'success' : 'warn'" />
          </td>
          <td class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <p-button
              class="text-xl!"
              type="button"
              icon="pi pi-ellipsis-h"
              [rounded]="false"
              severity="secondary"
              [disabled]="!header?.id"
              (onClick)="selectedRow = header; actionMenu.toggle($event)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @if (headers().length === 0) {
        <tr>
          <td colspan="5">
            <app-table-loader />
          </td>
        </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <app-table-empty-message
              icon="pi pi-list"
              message="No headers found."
              subMessage="Create a new header to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems"
  appendTo="body" />
<p-confirmDialog />
