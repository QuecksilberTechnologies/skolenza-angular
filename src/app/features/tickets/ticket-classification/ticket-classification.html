<div class="h-page overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4">
    <p-table
      #dt
      [value]="classifications()"
      [lazy]="true"
      [showLoader]="false"
      [paginator]="true"
      [rows]="pageSize()"
      [totalRecords]="totalRecords()"
      [loading]="isLoading()"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [rowsPerPageOptions]="[10, 25, 50]"
      [rowHover]="true"
      [scrollable]="true"
      scrollDirection="horizontal"
      [tableStyle]="{ 'min-width': '40rem' }"
      paginatorDropdownAppendTo="body"
      [(contextMenuSelection)]="selectedRow"
      [contextMenu]="actionContextMenu"
      (onLazyLoad)="getClassifications($event)">
      <ng-template #caption>
        <app-table-inline-filters>
          <!-- Basic filter -->

          <!-- Advance filter -->
          <app-table-search-filter [filterCount]="0" />

          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input
              placeholder="Search classifications..."
              (searchTerm)="onSearch($event)" />
            <p-button
              label="Add Classification"
              icon="pi pi-plus"
              styleClass="w-full lg:w-auto"
              (onClick)="createEditClassification()" />
          </div>
        </app-table-inline-filters>
      </ng-template>
      <ng-template #colgroup>
        <colgroup>
          <col style="width: 16rem" />
          <col style="width: 24rem" />
          <col style="width: 8rem" />
          <col style="width: 6rem" />
        </colgroup>
      </ng-template>
      <ng-template #header>
        <tr>
          <th
            pSortableColumn="classificationName"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Name
            <p-sortIcon field="classificationName" />
          </th>
          <th
            pSortableColumn="description"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Description
            <p-sortIcon field="description" />
          </th>
          <th
            pSortableColumn="isActive"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            Status
            <p-sortIcon field="isActive" />
          </th>
          <th class="!px-3 !py-2.5 align-middle whitespace-nowrap">Actions</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-classification>
        <tr [pContextMenuRow]="classification">
          <td class="!px-3 !py-2.5 align-middle">{{ classification.classificationName }}</td>
          <td class="!px-3 !py-2.5 align-middle">{{ classification?.description || '-' }}</td>
          <td class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <p-tag
              [value]="classification.isActive ? 'Active' : 'Inactive'"
              [severity]="classification.isActive ? 'success' : 'warn'" />
          </td>
          <td class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <div class="flex gap-2">
              <p-button
                class="text-xl!"
                type="button"
                icon="pi pi-ellipsis-h"
                [rounded]="false"
                severity="secondary"
                [disabled]="!classification?.id"
                (onClick)="selectedRow = classification; actionMenu.toggle($event)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @if (classifications().length === 0) {
        <tr>
          <td colspan="4">
            <app-table-loader />
          </td>
        </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <app-table-empty-message
              icon="pi pi-folder"
              message="No classifications found."
              subMessage="Create a new classification to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems"
  appendTo="body" />
<p-confirmDialog />
