<div class="flex min-h-[calc(100vh-10rem)] items-center justify-center px-4 transition-colors duration-300">
  <div class="w-full max-w-2xl text-center">
    <!-- Illustration -->
    <div class="mb-8">
      <div class="relative mx-auto h-64 w-64">
        <!-- Animated circle background using theme color -->
        <div class="absolute inset-0 animate-pulse rounded-full bg-primary-100 dark:bg-primary-900"></div>
        <!-- 404 Text with theme color -->
        <div class="absolute inset-0 flex items-center justify-center">
          <span class="text-9xl font-extrabold text-primary-500 drop-shadow-lg dark:text-primary-300">404</span>
        </div>
        <!-- Decorative elements using theme palette -->
        <div
          class="absolute -top-4 -right-4 h-16 w-16 animate-bounce rounded-full bg-primary-300 opacity-20 dark:bg-primary-700"></div>
        <div
          class="absolute -bottom-4 -left-4 h-16 w-16 animate-bounce rounded-full bg-primary-500 opacity-20 dark:bg-primary-400"
          style="animation-delay: 0.5s"></div>
      </div>
    </div>

    <!-- Message -->
    <h1 class="my-8 text-4xl font-bold text-gray-900 dark:text-gray-100">Page Not Found</h1>
    <div class="mb-8 space-y-2 text-lg text-gray-600 dark:text-gray-300">
      <p>
        <span class="font-semibold text-primary-600 dark:text-primary-400">Lost in the HR universe?</span>
        <span class="mt-1 block">This page is on vacation—just like your well-deserved leave!</span>
      </p>
      <p>
        <span>
          If you were searching for
          <span class="font-medium text-primary-500 dark:text-primary-300">talent</span>
          ,
          <span class="font-medium text-primary-500 dark:text-primary-300">payroll</span>
          , or your next
          <span class="text-primary-400 italic dark:text-primary-200">coffee break</span>
          , try heading back to the
          <span class="underline decoration-primary-400 dark:decoration-primary-600">dashboard</span>
        </span>
      </p>
    </div>

    <!-- Navigation Options -->
    <div class="space-y-4">
      <!-- Action Buttons -->
      <div class="flex flex-col justify-center gap-4 sm:flex-row">
        <p-button
          icon="pi pi-home"
          label="Go to Homepage"
          [routerLink]="['/']" />
        <p-button
          icon="pi pi-arrow-left"
          label="Go Back"
          [severity]="'secondary'"
          [outlined]="true"
          (click)="goBack()" />
      </div>
    </div>
  </div>
</div>
