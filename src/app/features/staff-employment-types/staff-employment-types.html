<div class="h-page overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4">
    <p-table
      #dt
      [value]="store.staffEmploymentTypes()"
      [loading]="store.isLoading()"
      [showLoader]="false"
      [lazy]="true"
      [paginator]="true"
      [showCurrentPageReport]="true"
      [rows]="store.pageSize()"
      [rowsPerPageOptions]="[10, 25, 50]"
      [totalRecords]="store.totalRecords()"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [selectionMode]="'single'"
      [scrollable]="true"
      scrollDirection="horizontal"
      [tableStyle]="{ 'min-width': '52rem' }"
      paginatorDropdownAppendTo="body"
      [contextMenuSelection]="selectedRow()"
      (contextMenuSelectionChange)="selectedRow.set($event)"
      [contextMenu]="actionContextMenu"
      (onLazyLoad)="store.loadStaffEmploymentTypes($event)">
      <ng-template #caption>
        <!-- `GET /StaffEmploymentType/get` takes paging alone, so this page offers no filter or sort. -->
        <app-table-inline-filters>
          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            @if (canAddStaffEmploymentType()) {
            <p-splitbutton
              class="w-full lg:w-auto"
              label="Add StaffMember Type"
              icon="pi pi-plus"
              [model]="staffEmploymentTypeSplitButtonItems"
              appendTo="body"
              expandAriaLabel="More staffMember type actions"
              (onClick)="createEditStaffEmploymentType()" />
            }
          </div>
        </app-table-inline-filters>
      </ng-template>
      <ng-template #colgroup>
        <colgroup>
          <col style="width: 14rem" />
          <col style="width: 18rem" />
          <col style="width: 14rem" />
          <col style="width: 9rem" />
          <col style="width: 7rem" />
        </colgroup>
      </ng-template>
      <ng-template #header>
        <tr>
          <th class="px-3! py-2.5! align-middle whitespace-nowrap">Name</th>
          <th class="px-3! py-2.5! align-middle whitespace-nowrap">Description</th>
          <th class="px-3! py-2.5! align-middle whitespace-nowrap">Remark</th>
          <th class="px-3! py-2.5! align-middle whitespace-nowrap">Status</th>
          <th class="px-3! py-2.5! align-middle whitespace-nowrap">Actions</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-staffEmploymentType>
        <tr [pContextMenuRow]="staffEmploymentType">
          <td class="px-3! py-2.5! align-middle">
            <div class="truncate">{{ staffEmploymentType.typeName }}</div>
          </td>
          <td class="px-3! py-2.5! align-middle">
            <div class="truncate">{{ staffEmploymentType.description || '-' }}</div>
          </td>
          <td class="px-3! py-2.5! align-middle">
            <div class="truncate">{{ staffEmploymentType.remark || '-' }}</div>
          </td>
          <td class="px-3! py-2.5! align-middle whitespace-nowrap">
            <p-tag
              [value]="staffEmploymentType.isActive ? 'Active' : 'Inactive'"
              [severity]="staffEmploymentType.isActive ? 'success' : 'danger'" />
          </td>
          <td class="px-3! py-2.5! align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              @if (canUpdate()) {
              <p-button
                class="text-xl!"
                [icon]="staffEmploymentType.isActive ? 'pi pi-check-circle' : 'pi pi-ban'"
                [severity]="staffEmploymentType.isActive ? 'success' : 'danger'"
                [pTooltip]="staffEmploymentType.isActive ? 'Deactivate' : 'Activate'"
                tooltipPosition="left"
                [showDelay]="300"
                [loading]="staffEmploymentType.isUpdatingStatus"
                [ariaLabel]="
                  (staffEmploymentType.isActive ? 'Deactivate ' : 'Activate ') +
                  (staffEmploymentType.typeName || 'staffMember type')
                "
                (onClick)="confirmToggleStatus(staffEmploymentType)" />
              }
              <app-table-action-button
                [ariaLabel]="'Actions for ' + (staffEmploymentType.typeName || 'staffMember type')"
                (action)="openActionMenu(staffEmploymentType, $event)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @if (store.staffEmploymentTypes().length === 0) {
        <tr>
          <td colspan="5">
            <app-table-loader />
          </td>
        </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <app-table-empty-message
              icon="pi pi-tags"
              message="No staffMember types found"
              subMessage="Add a new staffMember type to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems()"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems()"
  appendTo="body" />
<p-confirmDialog />
