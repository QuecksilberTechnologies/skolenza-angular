<div class="h-[calc(100vh-4.6rem)] overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4">
    <p-table
      #dt
      [value]="store.reportTypes()"
      [loading]="store.isLoading()"
      [showLoader]="false"
      [lazy]="true"
      [paginator]="true"
      [showCurrentPageReport]="true"
      [rows]="store.pageSize()"
      [rowsPerPageOptions]="[10, 25, 50]"
      [totalRecords]="store.totalRecords()"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [globalFilterFields]="['typeName']"
      [selectionMode]="'single'"
      [sortMode]="'single'"
      [sortOrder]="-1"
      [scrollable]="true"
      scrollDirection="horizontal"
      [tableStyle]="{ 'min-width': '42rem' }"
      paginatorDropdownAppendTo="body"
      [contextMenuSelection]="selectedRow()"
      (contextMenuSelectionChange)="selectedRow.set($event)"
      [contextMenu]="actionContextMenu"
      (onLazyLoad)="loadReportTypes($event)">
      <ng-template #caption>
        <app-table-inline-filters>
          <!-- Basic filter -->
          <p-select
            [options]="reportTypeStatusOptions"
            optionLabel="status"
            optionValue="value"
            placeholder=" Select Status"
            [appendTo]="'body'"
            class="w-full min-w-52"
            [ngModel]="store.appliedFilters()?.status ?? null"
            (onChange)="onStatusChange($event.value)" />

          <!-- Advance filter -->
          <app-table-search-filter [filterCount]="store.appliedFilterCount()" />

          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input (searchTerm)="searchReportTypes($event)" />
            @if ((loginInfo()?.user?.primaryRole?.roleTypeId ?? 2) !== 2) {
            <p-button
              label="Add Report Type"
              icon="pi pi-plus"
              class="w-full lg:w-auto"
              (onClick)="openDialog()" />
            }
          </div>
        </app-table-inline-filters>
      </ng-template>
      <ng-template #colgroup>
        <colgroup>
          <col style="width: 14rem" />
          <col style="width: 24rem" />
          <col style="width: 8rem" />
          <col style="width: 10rem" />
        </colgroup>
      </ng-template>
      <ng-template #header>
        <tr>
          <th
            pSortableColumn="typeName"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Type Name
              <p-sortIcon field="typeName" />
            </div>
          </th>
          <th
            pSortableColumn="description"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Description
              <p-sortIcon field="description" />
            </div>
          </th>
          <th
            pSortableColumn="isActive"
            class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              Status
              <p-sortIcon field="isActive" />
            </div>
          </th>
          <th class="!px-3 !py-2.5 align-middle whitespace-nowrap">Actions</th>
        </tr>
      </ng-template>
      <ng-template
        #body
        let-reportType>
        <tr [pContextMenuRow]="reportType">
          <td class="!px-3 !py-2.5 align-middle">
            <div class="truncate">{{ reportType.typeName }}</div>
          </td>
          <td class="!px-3 !py-2.5 align-middle">
            <div class="truncate">{{ reportType.description || '-' }}</div>
          </td>
          <td class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <p-tag
              [value]="reportType.isActive ? 'Active' : 'Inactive'"
              [severity]="reportType.isActive ? 'success' : 'danger'" />
          </td>
          <td class="!px-3 !py-2.5 align-middle whitespace-nowrap">
            <div class="flex items-center gap-2">
              @if ((loginInfo()?.user?.primaryRole?.roleTypeId ?? 2) !== 2) {
              <p-button
                class="text-xl!"
                [icon]="reportType.isActive ? 'pi pi-check-circle' : 'pi pi-ban'"
                [severity]="reportType.isActive ? 'success' : 'danger'"
                [pTooltip]="reportType.isActive ? 'Deactivate' : 'Activate'"
                tooltipPosition="left"
                [showDelay]="300"
                [loading]="reportType.isUpdatingStatus"
                [ariaLabel]="
                  (reportType.isActive ? 'Deactivate ' : 'Activate ') +
                  (reportType.typeName || 'report type')
                "
                (onClick)="confirmToggleStatus(reportType)" />
              }
              <app-table-action-button
                [ariaLabel]="'Actions for ' + (reportType.typeName || 'report type')"
                (action)="selectedRow.set(reportType); actionMenu.toggle($event)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        @if (store.reportTypes().length === 0) {
        <tr>
          <td colspan="4">
            <app-table-loader />
          </td>
        </tr>
        }
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <app-table-empty-message
              icon="pi pi-chart-bar"
              message="No report types found"
              subMessage="Add a new report type to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems"
  appendTo="body" />
<p-confirmDialog />
