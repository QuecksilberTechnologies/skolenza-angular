<div class="flex max-w-[28rem] min-w-[28rem] flex-col">
  <!-- Header -->
  <div class="flex items-start justify-between gap-3 border-b border-gray-200 pb-3 dark:border-zinc-700">
    <div class="flex items-center gap-2.5">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-primary-50 dark:bg-primary-900/30">
        <i class="pi pi-calendar !text-base text-primary-600 dark:text-primary-400"></i>
      </div>
      <div>
        <h3 class="text-base leading-tight font-semibold text-gray-900 dark:text-white">Leave Policies</h3>
        <p class="max-w-[20rem] truncate text-sm font-medium text-primary-600 dark:text-primary-400">
          {{ policyType()?.policyName || 'Selected Policy Type' }}
        </p>
      </div>
    </div>
    <p-button
      icon="pi pi-times"
      [size]="'small'"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="onClose()" />
  </div>

  <!-- Content -->
  <div class="flex flex-col items-center py-10 text-center">
    <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 dark:bg-zinc-800">
      <i class="pi pi-clock !text-xl text-gray-400 dark:text-zinc-500"></i>
    </div>
    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Coming soon</p>
    <p class="mt-1 text-xs text-gray-400 dark:text-gray-500">Leave policy mapping details will be available shortly</p>
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-end border-t border-gray-200 pt-3 dark:border-zinc-700">
    <p-button
      label="Close"
      size="small"
      severity="secondary"
      [outlined]="true"
      (onClick)="onClose()" />
  </div>
</div>
