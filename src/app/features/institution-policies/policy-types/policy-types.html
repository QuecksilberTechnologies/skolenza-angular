<div class="h-page overflow-hidden overflow-y-auto">
  <p-card class="m-3 overflow-x-auto sm:m-4 dark:border-zinc-800 dark:bg-zinc-900">
    <p-table
      #dt
      dataKey="id"
      [value]="store.policyTypes()"
      [loading]="store.isLoading()"
      [showGridlines]="false"
      [showLoader]="false"
      [scrollable]="true"
      scrollDirection="horizontal"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [rowsPerPageOptions]="[10, 25, 50]"
      paginatorDropdownAppendTo="body"
      [tableStyle]="{ 'min-width': '40rem' }"
      [style]="{ background: 'transparent' }"
      [globalFilterFields]="['name', 'code']"
      [selectionMode]="'single'"
      [sortMode]="'single'"
      [contextMenu]="actionContextMenu"
      [contextMenuSelection]="selectedRow()"
      (contextMenuSelectionChange)="selectedRow.set($event)">
      <ng-template #caption>
        <app-table-inline-filters>
          <!-- Status filter -->
          <p-select
            [options]="statusOptions"
            optionLabel="status"
            optionValue="value"
            placeholder="Select Status"
            ariaLabel="Filter by status"
            [appendTo]="'body'"
            class="w-full min-w-0 lg:min-w-48"
            [ngModel]="store.isActive()"
            (onChange)="onStatusChange($event.value)" />

          <div
            ngProjectAs="right"
            class="flex w-full flex-col gap-2 lg:w-auto lg:flex-row">
            <app-table-search-input [debounceMs]="0"
              class="min-w-0 flex-1 lg:flex-none"
              (searchTerm)="searchPolicyTypes(dt, $event)" />
            <p-splitbutton
              [disabled]="!canAdd()"
              label="Add Policy Type"
              icon="pi pi-plus"
              class="w-full lg:w-auto"
              [model]="addMenuItems()"
              appendTo="body"
              expandAriaLabel="More policy type actions"
              (onClick)="upsertPolicyType()" />
          </div>
        </app-table-inline-filters>
      </ng-template>

      <ng-template #header>
        <tr class="bg-gray-50 dark:bg-zinc-800">
          <th
            class="!px-3 !py-3 align-middle text-gray-700 dark:text-zinc-100 whitespace-nowrap"
            pSortableColumn="name">
            Name
            <p-sortIcon field="name" />
          </th>
          <th
            class="!px-3 !py-3 align-middle text-gray-700 dark:text-zinc-100 whitespace-nowrap"
            pSortableColumn="code">
            Code
            <p-sortIcon field="code" />
          </th>
          <th class="hidden !px-3 !py-3 align-middle text-gray-700 lg:table-cell dark:text-zinc-100">
            Category
          </th>
          <th class="!px-3 !py-3 align-middle text-gray-700 dark:text-zinc-100 whitespace-nowrap">Status</th>
          @if (canUseRowActions()) {
          <th class="!px-3 !py-3 align-middle text-gray-700 dark:text-zinc-100 whitespace-nowrap">
            <div class="flex justify-center">Actions</div>
          </th>
          }
        </tr>
      </ng-template>

      <ng-template
        #body
        let-policyType>
        <tr
          [pContextMenuRow]="policyType"
          [pContextMenuRowDisabled]="!canUseRowActions()">
          <td class="!px-3 !py-3 align-middle font-medium whitespace-nowrap">{{ policyType.name }}</td>
          <td class="!px-3 !py-3 align-middle whitespace-nowrap">{{ policyType.code }}</td>
          <td class="hidden !px-3 !py-3 align-middle text-gray-700 lg:table-cell dark:text-zinc-100">
            {{ categoryName(policyType.categoryId) }}
          </td>
          <td class="!px-3 !py-3 align-middle whitespace-nowrap">
            <p-tag
              [value]="policyType.isActive ? 'Active' : 'Inactive'"
              [severity]="policyType.isActive ? 'success' : 'danger'" />
          </td>
          @if (canUseRowActions()) {
          <td class="!px-3 !py-3 align-middle whitespace-nowrap">
            <div class="flex justify-center gap-2">
              <app-table-action-button
                [ariaLabel]="'Actions for ' + policyType.name"
                [disabled]="policyType.isUpdatingStatus"
                (action)="selectedRow.set(policyType); actionMenu.toggle($event)" />
            </div>
          </td>
          }
        </tr>
      </ng-template>

      <ng-template #loadingbody>
        @if (store.policyTypes().length === 0) {
        <tr>
          <td [attr.colspan]="columnCount()"><app-table-loader /></td>
        </tr>
        }
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td [attr.colspan]="columnCount()">
            <app-table-empty-message
              icon="pi pi-tags"
              message="No policy types found"
              subMessage="Create a policy type to get started" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-menu
  #actionMenu
  [model]="actionMenuItems()"
  [popup]="true"
  appendTo="body" />
<p-contextMenu
  #actionContextMenu
  [model]="actionMenuItems()"
  appendTo="body" />
<p-confirmDialog />
