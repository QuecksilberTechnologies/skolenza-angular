<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex h-full min-h-0 w-full flex-col">
  <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-1 pt-1 pb-4">
    <app-form-text
      label="Title"
      inputId="documentTitle"
      placeholder="e.g. Maharashtra Leave Policy"
      required
      [field]="f.documentTitle" />

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-form-select
        label="Document type"
        inputId="policyDocumentTypeId"
        placeholder="Select a type"
        required
        optionLabel="name"
        optionValue="id"
        [options]="documentTypes"
        [field]="f.policyDocumentTypeId" />

      <app-form-text
        label="Language code"
        inputId="languageCode"
        placeholder="e.g. en"
        hint="ISO language code of the document's contents."
        required
        [spellcheck]="false"
        [field]="f.languageCode" />
    </div>

    <app-form-file
      label="Document"
      inputId="policyDocument"
      hint="PDF, DOC or DOCX, up to 10 MB."
      required
      dragDrop
      [accept]="acceptedTypes"
      [maxFileSize]="maxFileSize"
      [field]="f.file" />

    <app-form-switch
      label="Visible to staffMembers"
      inputId="isStaffMemberVisible"
      hint="Hidden documents stay available to policy administrators only."
      [field]="f.isStaffMemberVisible" />
  </div>

  <app-form-action-bar
    dialog
    submitLabel="Upload"
    submitIcon="pi pi-upload"
    savingLabel="Uploading..."
    [saving]="isSaving()"
    (cancelled)="onCancel()" />
</form>
