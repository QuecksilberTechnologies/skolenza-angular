<section class="max-h-[calc(100dvh-16rem)] overflow-y-auto">
  <form
    [formGroup]="leaveRuleForm"
    class="grid grid-cols-1 gap-4">
    <div class="space-y-1">
      <label
        for="policyLeaveTypeId"
        class="block font-medium">
        Policy Leave Type
        <span class="text-red-600 dark:text-red-400">*</span>
      </label>
      <p-select
        formControlName="policyLeaveTypeId"
        id="policyLeaveTypeId"
        [options]="leaveTypes()"
        optionLabel="leaveName"
        optionValue="id"
        [loading]="isLoadingLeaveTypes()"
        placeholder="Select leave type"
        [appendTo]="'body'"
        [invalid]="isInvalid('policyLeaveTypeId')"
        class="w-full" />
      @if ( leaveRuleForm.get('policyLeaveTypeId')?.invalid && leaveRuleForm.get('policyLeaveTypeId')?.touched ) { @if
      (leaveRuleForm.get('policyLeaveTypeId')?.errors?.['required']) {
      <p-message
        severity="error"
        size="small"
        variant="simple">
        Policy leave type is required.
      </p-message>
      } }
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div class="flex items-center leading-0">
        <p-checkbox
          inputId="applySandwichRule"
          formControlName="applySandwichRule"
          class="mr-2"
          [binary]="true" />
        <label
          for="applySandwichRule"
          class="block font-medium">
          Apply Sandwich Rule
        </label>
      </div>

      <div class="flex items-center leading-0">
        <p-checkbox
          inputId="isHalfDayAllowed"
          formControlName="isHalfDayAllowed"
          class="mr-2"
          [binary]="true" />
        <label
          for="isHalfDayAllowed"
          class="block font-medium">
          Is Half Day Allowed
        </label>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div class="space-y-1">
        <label
          for="halfDayNoticeHours"
          class="block font-medium">
          Half Day Notice Hours
        </label>
        <input
          formControlName="halfDayNoticeHours"
          pInputText
          type="number"
          id="halfDayNoticeHours"
          class="w-full"
          [invalid]="isInvalid('halfDayNoticeHours')" />
      </div>

      <div class="space-y-1">
        <label
          for="noticePeriodDays"
          class="block font-medium">
          Notice Period Days
        </label>
        <input
          formControlName="noticePeriodDays"
          pInputText
          type="number"
          id="noticePeriodDays"
          class="w-full"
          [invalid]="isInvalid('noticePeriodDays')" />
      </div>

      <div class="space-y-1">
        <label
          for="maxContinuousLeaves"
          class="block font-medium">
          Max Continuous Leaves
        </label>
        <input
          formControlName="maxContinuousLeaves"
          pInputText
          type="number"
          id="maxContinuousLeaves"
          class="w-full"
          [invalid]="isInvalid('maxContinuousLeaves')" />
      </div>

      <div class="space-y-1">
        <label
          for="minGapBetweenLeaves"
          class="block font-medium">
          Min Gap Between Leaves
        </label>
        <input
          formControlName="minGapBetweenLeaves"
          pInputText
          type="number"
          id="minGapBetweenLeaves"
          class="w-full"
          [invalid]="isInvalid('minGapBetweenLeaves')" />
      </div>
    </div>

    <div class="space-y-1">
      <label
        for="remark"
        class="block font-medium">
        Remark
      </label>
      <textarea
        formControlName="remark"
        pTextarea
        rows="3"
        cols="20"
        id="remark"
        class="w-full"
        [invalid]="isInvalid('remark')"></textarea>
    </div>
  </form>

  <!-- <pre>{{ leaveRuleForm.value|json }}</pre> -->
</section>

<div class="mt-6 flex justify-end gap-2">
  <p-button
    [severity]="'secondary'"
    label="Cancel"
    (click)="onCancel()" />
  <p-button
    [severity]="'primary'"
    [label]="isSaving() ? 'Saving...' : 'Save'"
    [loading]="isSaving()"
    [disabled]="leaveRuleForm.invalid || isSaving()"
    (onClick)="onSubmit()" />
</div>
