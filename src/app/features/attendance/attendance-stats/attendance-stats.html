<div class="flex flex-wrap gap-4 md:gap-4">
  <!-- Present -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-users text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ stats().present || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Present</span>
      </div>
    </div>
  </p-card>

  <!-- Absent -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-users text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ stats().absent || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Absent</span>
      </div>
    </div>
  </p-card>

  <!-- Half Day -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-image text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ stats().halfDay || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">Half Day</span>
      </div>
    </div>
  </p-card>

  <!-- On Leave -->
  <p-card
    class="h-[7.4rem] max-w-full min-w-[calc(50%-0.5rem)] flex-1 rounded-xl border-0 bg-white shadow sm:max-w-[calc(50%-0.5rem)] sm:min-w-[180px] lg:max-w-none dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center gap-3 p-2 sm:gap-4">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-50 sm:h-12 sm:w-12 dark:bg-primary-900/30">
        <i class="pi pi-users text-xl! text-primary-500 sm:text-2xl! dark:text-primary-200"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-2xl! leading-tight font-medium text-gray-900 sm:text-3xl! dark:text-zinc-100">
          {{ stats().onLeave || 0 }}
        </span>
        <span class="text-sm font-medium text-gray-500 sm:text-base dark:text-zinc-400">On Leave</span>
      </div>
    </div>
  </p-card>
</div>
