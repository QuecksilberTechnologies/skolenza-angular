<div class="mx-auto max-w-5xl p-3 sm:p-4">
  @if (store.isLoading()) {
  <div class="flex flex-col gap-4">
    <p-skeleton height="9rem" />
    <p-skeleton height="14rem" />
  </div>
  } @else if (store.okr(); as okr) {
  <!-- Summary -->
  <app-okr-summary
    [okr]="okr"
    [canManage]="canManage"
    (edit)="edit()" />

  <!-- Key results -->
  <p-card class="mb-5 block">
    <div class="mb-4 flex items-center gap-2">
      <i
        class="pi pi-list-check text-sm text-primary-500"
        aria-hidden="true"></i>
      <h2 class="text-sm font-semibold tracking-wide text-gray-900 dark:text-zinc-100">Key Results</h2>
    </div>
    <app-okr-key-results [keyResults]="okr.keyResults" />
  </p-card>

  <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
    <!-- Activity timeline -->
    <p-card class="block">
      <div class="mb-4 flex items-center gap-2">
        <i
          class="pi pi-history text-sm text-primary-500"
          aria-hidden="true"></i>
        <h2 class="text-sm font-semibold tracking-wide text-gray-900 dark:text-zinc-100">Activity Timeline</h2>
      </div>
      <app-okr-timeline [activities]="store.extras()?.activities ?? []" />
    </p-card>

    <!-- Linked goals + attachments -->
    <div class="flex flex-col gap-5">
      <app-okr-linked-goals
        [goals]="store.extras()?.linkedGoals ?? []"
        (open)="openLinkedGoal($event)" />

      <app-okr-attachments
        [attachments]="store.attachments()"
        (upload)="onUpload($event)"
        (download)="download($event)" />
    </div>
  </div>

  <!-- Comments -->
  <p-card class="mt-5 block">
    <div class="mb-4 flex items-center gap-2">
      <i
        class="pi pi-comments text-sm text-primary-500"
        aria-hidden="true"></i>
      <h2 class="text-sm font-semibold tracking-wide text-gray-900 dark:text-zinc-100">Comments</h2>
    </div>
    <app-okr-comments
      [comments]="store.comments()"
      (addComment)="addComment($event)" />
  </p-card>
  } @else if (store.hasLoadError()) {
  <p-card class="block">
    <div class="flex flex-col items-center justify-center py-12 text-center">
      <i class="pi pi-exclamation-triangle mb-3 text-3xl text-red-500"></i>
      <p class="text-gray-600 dark:text-zinc-300">Could not load this OKR.</p>
      <div class="mt-2 flex gap-2">
        <p-button
          label="Try again"
          icon="pi pi-refresh"
          (onClick)="store.reload()" />
        <p-button
          label="Back to OKRs"
          [text]="true"
          (onClick)="back()" />
      </div>
    </div>
  </p-card>
  } @else {
  <p-card class="block">
    <div class="flex flex-col items-center justify-center py-12 text-center">
      <i class="pi pi-exclamation-triangle mb-3 text-3xl text-amber-500"></i>
      <p class="text-gray-600 dark:text-zinc-300">OKR not found.</p>
      <p-button
        label="Back to OKRs"
        [text]="true"
        class="mt-2"
        (onClick)="back()" />
    </div>
  </p-card>
  }
</div>
