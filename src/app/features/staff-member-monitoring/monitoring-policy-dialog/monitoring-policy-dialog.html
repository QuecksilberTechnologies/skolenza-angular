<form
  (submit)="onSubmit(); $event.preventDefault()"
  class="flex w-full flex-col gap-4">
  <p class="m-0 text-sm text-zinc-600 dark:text-zinc-300">
    Applies to every desktop agent in your organisation. Saving replaces the current policy.
  </p>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-number
      label="Minimum capture interval (seconds)"
      inputId="minimumCaptureIntervalSeconds"
      hint="At least 60"
      required
      [min]="60"
      [useGrouping]="false"
      [field]="f.minimumCaptureIntervalSeconds"
      [submitted]="submitted()" />

    <app-form-number
      label="Maximum capture interval (seconds)"
      inputId="maximumCaptureIntervalSeconds"
      hint="Screenshots are taken at a random point in this range"
      required
      [min]="60"
      [useGrouping]="false"
      [field]="f.maximumCaptureIntervalSeconds"
      [submitted]="submitted()" />

    <app-form-number
      label="Heartbeat interval (seconds)"
      inputId="heartbeatIntervalSeconds"
      hint="At least 15"
      required
      [min]="15"
      [useGrouping]="false"
      [field]="f.heartbeatIntervalSeconds"
      [submitted]="submitted()" />

    <app-form-number
      label="Delayed after (seconds)"
      inputId="delayedAfterSeconds"
      hint="With no heartbeat for this long, the agent shows as Delayed"
      required
      [min]="16"
      [useGrouping]="false"
      [field]="f.delayedAfterSeconds"
      [submitted]="submitted()" />

    <app-form-number
      label="Unreachable after (seconds)"
      inputId="unreachableAfterSeconds"
      hint="With no heartbeat for this long, the agent shows as Unreachable"
      required
      [min]="17"
      [useGrouping]="false"
      [field]="f.unreachableAfterSeconds"
      [submitted]="submitted()" />

    <app-form-number
      label="Offline retention (days)"
      inputId="offlineRetentionDays"
      hint="How long the agent keeps screenshots it could not upload"
      required
      [min]="1"
      [field]="f.offlineRetentionDays"
      [submitted]="submitted()" />

    <app-form-number
      label="Offline storage limit (GB)"
      inputId="maximumOfflineGb"
      hint="Disk space the agent may use for queued screenshots"
      required
      [min]="0.01"
      [maxFractionDigits]="2"
      [field]="f.maximumOfflineGb"
      [submitted]="submitted()" />

    <app-form-number
      label="Image quality"
      inputId="imageQuality"
      hint="1 to 100. Lower values make smaller files"
      required
      [min]="1"
      [max]="100"
      [field]="f.imageQuality"
      [submitted]="submitted()" />
  </div>

  <app-form-switch
    label="Capture all monitors"
    inputId="captureAllMonitors"
    hint="Off captures the primary monitor only"
    [field]="f.captureAllMonitors" />

  <app-form-action-bar
    dialog
    submitLabel="Save policy"
    [saving]="isSaving()"
    [disabled]="isSaving()"
    [errorMessage]="submitted() && f().invalid() ? 'Fix the highlighted fields before saving.' : ''"
    (cancelled)="onCancel()" />
</form>
