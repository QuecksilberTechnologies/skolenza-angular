<div class="mb-6 flex items-center justify-center gap-2.5">
  <div class="relative h-15 w-[13rem]">
    @if (customLogo(); as logo) {
    <img
      [src]="logo"
      alt=""
      class="absolute inset-0 h-full w-full object-contain" />
    } @else {
    <img
      ngSrc="images/skolenza-logo-on-light.png"
      fill
      priority
      placeholder="data:image/png;base64,iVBORw0K..."
      class="logo object-contain mix-blend-multiply dark:hidden"
      alt="" />
    <img
      ngSrc="images/skolenza-logo-on-dark.png"
      fill
      priority
      placeholder="data:image/png;base64,iVBORw0K..."
      class="logo hidden object-contain dark:block"
      alt="" />
    }
  </div>
</div>
