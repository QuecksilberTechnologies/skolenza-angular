<button
  #trigger
  type="button"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  aria-haspopup="dialog"
  [class]="triggerClass()"
  [pTooltip]="tooltip()"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="triggerAriaLabel()"
  (click)="open.set(!open())">
  <ng-content>
    <span
      class="pi pi-plus !text-[12px] sm:!text-[14px]"
      aria-hidden="true"></span>
  </ng-content>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayFlexibleDimensions]="true"
  [cdkConnectedOverlayGrowAfterOpen]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayScrollStrategy]="closeOnScroll"
  (overlayOutsideClick)="close()"
  (overlayKeydown)="$event.key === 'Escape' ? close() : null"
  (detach)="open.set(false)">
  <app-popup
    cdkTrapFocus
    contentClass="overflow-hidden"
    [cdkTrapFocusAutoCapture]="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="color-picker-title"
    ariaLabel="Color picker"
    closeAriaLabel="Close color picker"
    (closed)="close()">
    <app-color-picker-panel
      [value]="value()"
      (colorPicked)="pick($event)" />
  </app-popup>
</ng-template>
