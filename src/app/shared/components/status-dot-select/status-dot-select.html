<p-select
  [id]="selectId()"
  [inputId]="inputId()"
  [formControlName]="controlName()"
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [showClear]="showClear()"
  [invalid]="invalid()"
  [dropdownIcon]="dropdownIcon()"
  [appendTo]="'body'"
  class="w-full"
  (onChange)="selectionChange.emit($event)">
  <ng-template
    #selectedItem
    let-selectedOption>
    @if (selectedOption) {
    <div class="flex items-center gap-2">
      <i class="pi pi-circle-on {{ iconClass() }} {{ selectedOption.color }}"></i>
      <div class="{{ labelClass() }}">{{ selectedOption.label }}</div>
    </div>
    }
  </ng-template>
  <ng-template
    #item
    let-option>
    <div class="flex items-center gap-2">
      <i class="pi pi-circle-on {{ iconClass() }} {{ option.color }}"></i>
      <div class="{{ labelClass() }}">{{ option.label }}</div>
    </div>
  </ng-template>
</p-select>
