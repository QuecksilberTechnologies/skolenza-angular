<div class="flex h-full flex-col">
  <!-- Header -->
  <section class="flex items-center justify-between border-b border-zinc-200 px-4 py-3 dark:border-zinc-700">
    <div class="flex items-center justify-between gap-2">
      <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-primary-100 dark:bg-primary-900">
        <i class="pi pi-filter text-2xl text-primary-600 dark:text-primary-300"></i>
      </span>
      <div>
        <div class="text-lg font-semibold text-gray-800 dark:text-zinc-100">Department Filter</div>
        <div class="text-sm text-gray-500 dark:text-zinc-400">
          Use the filters below to find specific department in your team.
        </div>
      </div>
    </div>
    <p-button
      type="button"
      icon="pi pi-times"
      rounded="true"
      [variant]="'text'"
      [size]="'small'"
      [severity]="'secondary'"
      (onClick)="onCancel()" />
  </section>

  <!-- Content -->
  <section class="h-[calc(100dvh-8.8rem)] overflow-y-auto bg-gray-50 p-4 dark:bg-zinc-900">
    <form
      [formGroup]="departmentFilterForm"
      class="grid grid-cols-1 gap-4">
      <!-- Department -->
      <div class="space-y-1">
        <label
          for="department"
          class="block font-semibold">
          Department
        </label>
        <app-select-field
          selectId="department"
          controlName="department"
          optionLabel="departmentName"
          optionValue="id"
          placeholder="Select Department"
          [options]="departmentOptions()"
          [loading]="isLoadingDepartments()" />
      </div>

      <!-- Status -->
      <div class="space-y-1">
        <label
          for="status"
          class="block font-semibold">
          Status
        </label>
        <app-select-field
          selectId="status"
          controlName="status"
          optionLabel="statusName"
          optionValue="id"
          placeholder="Select Status"
          [options]="statusNameOptions" />
      </div>
    </form>
  </section>

  <!-- Footer -->
  <section class="mt-auto flex justify-between gap-2 border-t border-zinc-200 px-4 py-3 dark:border-zinc-700">
    <div>
      <p-button
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        [label]="isSaving() ? 'Resetting...' : 'Reset Filters'"
        [loading]="isSaving()"
        (onClick)="onReset()" />
    </div>

    <div class="flex justify-end gap-2">
      <p-button
        label="Cancel"
        severity="secondary"
        (onClick)="onCancel()" />
      <p-button
        [label]="isSaving() ? 'Applying...' : 'Apply'"
        [loading]="isSaving()"
        [disabled]="departmentFilterForm.invalid || isSaving()"
        (onClick)="onApply()" />
    </div>
  </section>
</div>
