<div class="space-y-3">
  <!-- Search bar + hint skeleton -->
  <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
    <p-skeleton
      width="18rem"
      height="2.4rem"
      styleClass="rounded-md!" />
    <p-skeleton
      width="26rem"
      height="0.9rem"
      styleClass="rounded-md!" />
  </div>

  <!-- Matrix grid skeleton -->
  <div class="overflow-hidden rounded-2xl border border-zinc-200 dark:border-zinc-700">
    <!-- Header row -->
    <div
      class="grid gap-0 border-b border-zinc-200 bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-800"
      style="grid-template-columns: minmax(180px, 1.2fr) repeat(5, minmax(140px, 1fr))">
      <div class="flex items-center gap-2.5 border-r border-zinc-200 p-3 dark:border-zinc-700">
        <p-skeleton
          shape="square"
          width="1.25rem"
          height="1.25rem"
          styleClass="rounded-sm!" />
        <p-skeleton
          width="5rem"
          height="0.9rem"
          styleClass="rounded-md!" />
      </div>
      @for (_ of columns; track $index; let last = $last) {
      <div
        class="flex flex-col items-center gap-2 px-3 py-2.5"
        [class.border-r]="!last"
        [class.border-zinc-200]="!last"
        [class.dark:border-zinc-700]="!last">
        <p-skeleton
          width="6rem"
          height="1rem"
          styleClass="rounded-md!" />
        <p-skeleton
          shape="square"
          width="1.25rem"
          height="1.25rem"
          styleClass="rounded-sm!" />
        <p-skeleton
          width="2.2rem"
          height="0.7rem"
          styleClass="rounded-md!" />
      </div>
      }
    </div>

    <!-- Group separator -->
    <div
      class="flex items-center gap-2 border-b border-zinc-200 bg-zinc-100/80 px-4 py-2 dark:border-zinc-700 dark:bg-zinc-800/80">
      <span class="h-3.5 w-1 rounded-full bg-zinc-300 dark:bg-zinc-600"></span>
      <p-skeleton
        width="4rem"
        height="0.7rem"
        styleClass="rounded-md!" />
    </div>

    <!-- Body rows -->
    @for (_ of rows; track $index; let lastRow = $last) {
    <div
      class="grid gap-0"
      [class.border-b]="!lastRow"
      [class.border-zinc-200]="!lastRow"
      [class.dark:border-zinc-700]="!lastRow"
      style="grid-template-columns: minmax(180px, 1.2fr) repeat(5, minmax(140px, 1fr))">
      <div class="flex items-center gap-2.5 border-r border-zinc-200 px-4 py-3 dark:border-zinc-700">
        <p-skeleton
          shape="square"
          width="1.25rem"
          height="1.25rem"
          styleClass="rounded-sm!" />
        <p-skeleton
          shape="circle"
          size="1rem" />
        <p-skeleton
          width="4.5rem"
          height="0.9rem"
          styleClass="rounded-md!" />
      </div>
      @for (_ of columns; track $index; let lastCell = $last) {
      <div
        class="flex items-center justify-center px-2 py-3"
        [class.border-r]="!lastCell"
        [class.border-zinc-200]="!lastCell"
        [class.dark:border-zinc-700]="!lastCell">
        <p-skeleton
          shape="square"
          width="1.25rem"
          height="1.25rem"
          styleClass="rounded-sm!" />
      </div>
      }
    </div>
    }
  </div>

  <!-- Action bar skeleton -->
  <div class="mt-5 flex items-center justify-end">
    <p-skeleton
      width="8rem"
      height="2.4rem"
      styleClass="rounded-md!" />
  </div>
</div>
