<div class="flex flex-col items-center justify-center py-12">
  <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-primary-50 dark:bg-zinc-800">
    <i [class]="`${icon()} text-3xl! text-primary dark:text-primary-400`" aria-hidden="true"></i>
  </div>
  <p class="mb-1 text-lg font-medium text-gray-700 dark:text-zinc-100">{{ message() }}</p>
  <p class="text-sm text-gray-500 dark:text-zinc-400">{{ subMessage() }}</p>
  <ng-content />
</div>
