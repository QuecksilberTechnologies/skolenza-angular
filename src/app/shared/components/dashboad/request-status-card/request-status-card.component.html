<app-dashboard-card [title]="title()">
  <p-table
    [value]="requestStatus"
    [showLoader]="false"
    [paginator]="false"
    [rows]="5"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [rowsPerPageOptions]="[5, 10, 25]"
    [tableStyle]="{ 'min-width': '40rem' }"
    [globalFilterFields]="['id', 'type', 'description', 'days', 'status']">
    <ng-template #header>
      <tr>
        <th
          pSortableColumn="id"
          style="width: 10%">
          #Id
          <p-sortIcon field="id" />
        </th>
        <th
          pSortableColumn="type"
          style="width: 20%">
          Request Type
          <p-sortIcon field="type" />
        </th>
        <!-- <th pSortableColumn="description" style="width: 35%">
          Description <p-sortIcon field="description" />
        </th> -->
        <th
          pSortableColumn="days"
          style="width: 15%">
          Days
          <p-sortIcon field="days" />
        </th>
        <th
          pSortableColumn="status"
          style="width: 20%">
          Status
          <p-sortIcon field="status" />
        </th>
      </tr>
    </ng-template>
    <ng-template
      #body
      let-request>
      <tr>
        <td class="font-medium text-primary">{{ request.id }}</td>
        <td>{{ request.type }}</td>
        <!-- <td>{{ request.description }}</td> -->
        <td class="flex items-center">
          <i class="pi pi-calendar mr-1 !text-lg text-gray-500"></i>
          {{ request.days }}
        </td>
        <td>
          <p-tag
            [severity]="request.status === 'Approved' ? 'success' : 'warn'"
            [value]="request.status" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td
          colspan="5"
          class="p-4 text-center">
          No requests found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</app-dashboard-card>
