<div class="flex min-w-0 flex-col justify-center overflow-hidden">
  <!-- @let pageIco = pageHeaderInfo()?.pageIcon;
       @if (pageIco) {
       <i [class]="`${pageIco} !font-semibold text-gray-700 dark:text-zinc-100`"></i>
       } -->

  <h4 class="text-lg leading-tight font-bold whitespace-nowrap text-gray-900 dark:text-zinc-100">
    {{ pageHeaderInfo()?.pageTitle }}
  </h4>

  @if (!pageHeaderInfo()?.isBreadcrumbShow) {
  <p class="overflow-hidden text-sm text-ellipsis whitespace-nowrap text-gray-500 md:block dark:text-zinc-400">
    {{ pageHeaderInfo()?.pageDescription }}
  </p>
  } @if (pageHeaderInfo()?.isBreadcrumbShow) {
  <p-breadcrumb
    styleClass="page-breadcrumb !p-0 text-sm lg:flex"
    [model]="breadcrumbItems()" />
  }
</div>
