<!-- Box, wrapper elements and min-heights are copied from pricing-card.html, and every wrapper is the
     measured height of the element it stands in for, so the card lands in the exact space the
     shimmer held. Bars sit shorter than their wrapper — a bar filling the whole line box would
     leave no visible gap between rows. Change one, change the other. -->
<div
  class="flex h-full flex-col gap-4 rounded-2xl border border-surface-200 bg-surface-0 p-5 shadow-lg sm:p-6 dark:border-zinc-700 dark:bg-zinc-800">
  <!-- Plan name — the real h3 reserves two clamped lines -->
  <div class="flex min-h-[3.5rem] items-center justify-center">
    <p-skeleton
      height="1.5rem"
      width="70%" />
  </div>

  <!-- Price, billing period, then the footnote block the real card also reserves -->
  <div class="text-center">
    <div class="flex h-[2.5rem] items-center justify-center">
      <p-skeleton
        height="1.75rem"
        width="45%" />
    </div>
    <div class="flex h-[1.5rem] items-center justify-center">
      <p-skeleton
        height="1rem"
        width="35%" />
    </div>
    <div class="mt-1 flex min-h-[2.5rem] items-center justify-center">
      <p-skeleton
        height="1rem"
        width="55%" />
    </div>
  </div>

  <!-- CTA -->
  <p-skeleton
    height="2.65rem"
    width="100%"
    class="rounded-md" />

  <!-- Feature list — FEATURE_PREVIEW_COUNT rows plus the "+ N more modules" disclosure -->
  <div class="min-h-[12rem]">
    <ul class="list-none space-y-1.5 p-0">
      @for (width of featureWidths; track $index) {
      <li class="flex h-[1.5rem] items-center gap-2">
        <p-skeleton
          shape="circle"
          size="1rem"
          class="shrink-0" />
        <p-skeleton
          height="1rem"
          [width]="width" />
      </li>
      }
    </ul>

    <div class="mt-2 flex h-[1.25rem] items-center">
      <p-skeleton
        height="1rem"
        width="40%" />
    </div>
  </div>
</div>
