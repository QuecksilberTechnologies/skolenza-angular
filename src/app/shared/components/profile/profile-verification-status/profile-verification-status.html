<div class="flex justify-end">
  <span class="flex items-center gap-2">
    <span class="font-normal">Review:</span>
    @if (isInfoVerified() === true) {
    <span class="flex items-center gap-1 font-medium text-green-700 dark:text-green-400">
      <i
        class="pi pi-check-circle"
        style="font-size: 0.9em"></i>
      Completed
    </span>
    } @else {
    <span class="flex items-center gap-1 font-medium text-amber-700 dark:text-amber-400">
      <i
        class="pi pi-clock"
        style="font-size: 0.9em"></i>
      Pending
    </span>
    }
  </span>
</div>
