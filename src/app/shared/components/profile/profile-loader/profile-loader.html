<div class="flex min-h-[calc(100dvh-19rem)] flex-col">
  <!-- Header Section: StaffMember ID, Verification Status, Progress, Add Button -->
  <div class="mb-4 flex items-center justify-between">
    <!-- Left: StaffMember ID -->
    <div class="flex items-center gap-2">
      <p-skeleton
        height="1.25rem"
        width="5rem"
        borderRadius="0.5rem" />
      <p-skeleton
        height="1.25rem"
        width="6rem"
        borderRadius="0.5rem" />
    </div>

    <!-- Right: Verification Status, Progress Knob, Add Button -->
    <div class="flex items-center gap-4">
      <!-- Verification Status -->
      <div class="flex items-center gap-2">
        <p-skeleton
          height="1.25rem"
          width="5rem"
          borderRadius="0.5rem" />
        <p-skeleton
          shape="circle"
          size="1rem" />
        <p-skeleton
          height="1.25rem"
          width="4rem"
          borderRadius="0.5rem" />
      </div>

      <!-- Progress Knob -->
      <p-skeleton
        shape="circle"
        size="2rem" />

      <!-- Add Education Button -->
      <p-skeleton
        height="2.25rem"
        width="9rem"
        borderRadius="0.375rem" />
    </div>
  </div>

  <!-- Education Entry Card -->
  <div class="mb-4 rounded-2xl border border-gray-200 bg-white p-6 dark:border-zinc-700 dark:bg-zinc-900">
    <!-- Top Right: Progress Knob, Edit, Delete -->
    <div class="mb-6 flex items-center justify-end gap-2">
      <p-skeleton
        shape="circle"
        size="2rem" />
      <p-skeleton
        shape="circle"
        size="2rem" />
      <p-skeleton
        shape="circle"
        size="2rem" />
    </div>

    <!-- Two Column Grid: Label-Value Pairs -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <!-- Left Column -->
      <div class="flex flex-col gap-4">
        <!-- Degree -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="4rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="80%"
            borderRadius="0.5rem" />
        </div>

        <!-- Institute Name -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="6rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="70%"
            borderRadius="0.5rem" />
        </div>

        <!-- End Date -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="5rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="6rem"
            borderRadius="0.5rem" />
        </div>

        <!-- Score -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="3.5rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="3rem"
            borderRadius="0.5rem" />
        </div>

        <!-- Education Gap -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="6.5rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="2.5rem"
            borderRadius="0.5rem" />
        </div>
      </div>

      <!-- Right Column -->
      <div class="flex flex-col gap-4">
        <!-- Document -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="5rem"
            borderRadius="0.5rem" />
          <div class="flex items-center gap-2">
            <p-skeleton
              height="1.25rem"
              width="1.25rem"
              borderRadius="0.25rem" />
            <p-skeleton
              height="1.5rem"
              width="9rem"
              borderRadius="0.5rem" />
          </div>
        </div>

        <!-- Start Date -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="5.5rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="6rem"
            borderRadius="0.5rem" />
        </div>

        <!-- Score Type -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="5.5rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="4rem"
            borderRadius="0.5rem" />
        </div>

        <!-- Grade Division -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="6.5rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="3.5rem"
            borderRadius="0.5rem" />
        </div>

        <!-- Remark -->
        <div class="flex flex-col gap-1">
          <p-skeleton
            height="1rem"
            width="4rem"
            borderRadius="0.5rem" />
          <p-skeleton
            height="1.5rem"
            width="7rem"
            borderRadius="0.5rem" />
        </div>
      </div>
    </div>
  </div>
</div>
