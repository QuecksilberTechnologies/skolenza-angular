<div class="flex min-h-[calc(100dvh-19rem)] flex-col items-center justify-center gap-4">
  <!-- Icon -->
  <span [class]="`${tabIcon()} text-3xl! text-primary dark:text-primary-400`"></span>

  <!-- Message -->
  <div class="space-y-2">
    <div class="mb-1 text-center text-lg font-semibold text-gray-700 dark:text-zinc-100">{{ message() }}</div>
    <div class="mb-2 text-center text-sm text-gray-500 dark:text-zinc-400">{{ description() }}</div>
  </div>

  <!-- Actions -->
  <div class="space-x-2">
    <p-button
      label="Add"
      icon="pi pi-plus"
      (onClick)="onAdd()" />
    <p-button
      label="Retry"
      icon="pi pi-refresh"
      severity="secondary"
      (onClick)="onRetry()" />
  </div>
</div>
