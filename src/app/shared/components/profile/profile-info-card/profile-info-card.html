<div class="mb-4 rounded-card border border-zinc-200 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none">
  <div class="mb-2.5 flex items-start justify-between gap-2">
    <div class="min-w-0">
      <h2 class="text-lg font-semibold text-zinc-900 dark:text-zinc-50">
        <ng-content select="sectionTitle" />
      </h2>
      <ng-content select="[cardSubtitle]" />
    </div>
    <ng-content select="actions" />
  </div>

  <div class="grid w-full grid-cols-1 gap-2.5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    <ng-content />
  </div>
  <ng-content select="[documents]" />
</div>
