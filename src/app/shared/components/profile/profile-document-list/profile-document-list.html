@if (documents().length) {
<div class="mt-1 border-t border-gray-200 pt-3 dark:border-zinc-700">
  <span class="mb-2 block text-base font-medium text-gray-500 dark:text-zinc-400">{{ label() }}</span>
  <div class="flex flex-wrap gap-2">
    @for (document of documents(); track $index) {
    <a
      [href]="document.filePath"
      target="_blank"
      rel="noopener noreferrer"
      class="group inline-flex items-center gap-2.5 rounded-lg border border-gray-200 bg-white px-3 py-2 transition-colors hover:border-blue-400 hover:bg-blue-50 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:border-blue-500 dark:hover:bg-blue-950"
      [title]="document.documentTypeName || document.fileName || 'Document'">
      <i
        class="pi pi-file-pdf text-xl! text-gray-400 transition-colors group-hover:text-blue-500 dark:group-hover:text-blue-400"></i>
      <div class="flex flex-col">
        <span class="max-w-48 truncate text-sm text-gray-700 dark:text-zinc-300">{{ document.fileName || '-' }}</span>
        @if (document.documentTypeName) {
        <span class="text-xs text-gray-400 dark:text-zinc-500">{{ document.documentTypeName }}</span>
        }
      </div>
      <i
        class="pi pi-external-link text-xs! text-gray-400 transition-colors group-hover:text-blue-500 dark:group-hover:text-blue-400"></i>
    </a>
    }
  </div>
</div>
}
