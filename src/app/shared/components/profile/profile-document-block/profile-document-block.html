<div>
  <span class="mb-1 block text-base font-medium text-gray-500 dark:text-zinc-400">{{ label() }}</span>
  <div class="flex flex-col items-start">
    @if (isPdf()) {
    <a
      [href]="filePath()"
      target="_blank"
      rel="noopener noreferrer"
      class="group inline-flex items-center gap-2.5 rounded-lg border border-gray-200 bg-white px-3 py-2 transition-colors hover:border-blue-400 hover:bg-blue-50 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:border-blue-500 dark:hover:bg-blue-950"
      [title]="fileName() || 'Document'">
      <i
        class="pi pi-file-pdf text-xl text-gray-400 transition-colors group-hover:text-blue-500 dark:group-hover:text-blue-400"></i>
      <span class="max-w-48 truncate text-sm text-gray-700 dark:text-zinc-300">{{ fileName() || '-' }}</span>
      <i
        class="pi pi-external-link text-xs! text-gray-400 transition-colors group-hover:text-blue-500 dark:group-hover:text-blue-400"></i>
    </a>
    } @else {
    <a
      [href]="filePath()"
      target="_blank"
      rel="noopener noreferrer"
      class="group inline-flex items-center gap-2.5 rounded-lg border border-gray-200 bg-white px-3 py-2 transition-colors hover:border-blue-400 hover:bg-blue-50 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:border-blue-500 dark:hover:bg-blue-950"
      [title]="fileName() || 'Document'">
      <i
        class="pi pi-image text-xl text-gray-400 transition-colors group-hover:text-blue-500 dark:group-hover:text-blue-400"></i>
      <span class="max-w-48 truncate text-sm text-gray-700 dark:text-zinc-300">{{ fileName() || '-' }}</span>
      <i
        class="pi pi-external-link text-xs text-gray-400 transition-colors group-hover:text-blue-500 dark:group-hover:text-blue-400"></i>
    </a>
    }
  </div>
</div>
