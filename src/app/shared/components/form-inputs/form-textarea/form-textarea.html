<app-form-field-shell
  #shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()">
  <textarea
    pTextarea
    class="w-full resize-none"
    [id]="inputId()"
    [rows]="rows()"
    [autoResize]="autoResize()"
    [placeholder]="placeholder() ?? ''"
    [disabled]="disabled()"
    [attr.maxlength]="maxlength() ?? null"
    [value]="field()().value()"
    [class.p-invalid]="shell.showError()"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="shell.showError()"
    [attr.aria-describedby]="inputId() + '-help'"
    (input)="onInput($event)"
    (blur)="onBlur()"></textarea>
</app-form-field-shell>
