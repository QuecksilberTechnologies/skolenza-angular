<app-form-field-shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()"
  groupLabel>
  <div
    role="radiogroup"
    class="flex gap-4"
    [class.flex-col]="orientation() === 'vertical'"
    [class.flex-wrap]="orientation() === 'horizontal'"
    [attr.aria-labelledby]="inputId() + '-label'"
    [attr.aria-describedby]="inputId() + '-help'"
    [attr.aria-required]="required() || null">
    @for (option of options(); track option.value; let i = $index) {
      <div class="flex items-start gap-2">
        <p-radiobutton
          [formField]="$any(field())"
          [inputId]="inputId() + '-' + i"
          [name]="inputId()"
          [value]="option.value" />
        <label
          [for]="inputId() + '-' + i"
          class="cursor-pointer">
          <span class="block font-medium">{{ option.label }}</span>
          @if (option.hint) {
            <span class="block text-xs text-gray-500 dark:text-zinc-400">{{ option.hint }}</span>
          }
        </label>
      </div>
    }
  </div>
</app-form-field-shell>
