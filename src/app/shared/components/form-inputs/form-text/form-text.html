<app-form-field-shell
  #shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()">
  @if (icon(); as iconClass) {
    <p-iconfield class="block">
      <p-inputicon [class]="iconClass + ' text-zinc-400 dark:text-zinc-500'" />
      <ng-container [ngTemplateOutlet]="control" />
    </p-iconfield>
  } @else {
    <ng-container [ngTemplateOutlet]="control" />
  }
</app-form-field-shell>

<ng-template #control>
  <input
    pInputText
    appTrimInput
    class="w-full"
    [formField]="field()"
    [id]="inputId()"
    [type]="type()"
    [placeholder]="placeholder() ?? ''"
    [pAutoFocus]="autofocus()"
    [class.p-invalid]="shell.showError()"
    [attr.autocomplete]="autocomplete()"
    [attr.spellcheck]="spellcheck()"
    [attr.autocapitalize]="spellcheck() ? null : 'none'"
    [attr.autocorrect]="spellcheck() ? null : 'off'"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="shell.showError()"
    [attr.aria-describedby]="inputId() + '-help'"
    (input)="onInput($event)"
    (blur)="onBlur()" />
</ng-template>
