<app-form-field-shell
  #shell
  [field]="field()"
  [inputId]="inputId()"
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [hintIcon]="hintIcon()"
  [submitted]="submitted()">
  @if (icon(); as iconClass) {
    <p-iconfield class="block">
      <p-inputicon [class]="iconClass + ' text-zinc-400 dark:text-zinc-500'" />
      <ng-container [ngTemplateOutlet]="control" />
    </p-iconfield>
  } @else {
    <ng-container [ngTemplateOutlet]="control" />
  }
</app-form-field-shell>

<ng-template #control>
  <p-password
    class="w-full"
    inputStyleClass="w-full"
    [formField]="$any(field())"
    [inputId]="inputId()"
    [toggleMask]="toggleMask()"
    [feedback]="feedback()"
    [placeholder]="placeholder() ?? ''"
    [invalid]="shell.showError()"
    [autocomplete]="autocomplete()"
    [pt]="{ pcInputText: { root: aria() } }" />
</ng-template>
