<div
  class="animate-pulse py-2"
  role="status"
  aria-label="Loading menu">
  <ul role="list">
    @for (width of linkWidths; track $index) {
    <li class="flex items-center gap-2 px-4 py-2">
      <p-skeleton
        shape="circle"
        width="0.75rem"
        height="0.75rem" />
      <p-skeleton
        height="0.85rem"
        [width]="width" />
    </li>
    }
    <li class="flex items-center gap-2 border-t border-gray-200 px-4 py-2 dark:border-zinc-700">
      <p-skeleton
        shape="circle"
        width="0.75rem"
        height="0.75rem" />
      <p-skeleton
        height="0.85rem"
        width="4rem" />
    </li>
  </ul>
</div>
