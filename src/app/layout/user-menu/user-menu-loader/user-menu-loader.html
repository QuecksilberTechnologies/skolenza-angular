<div
  class="animate-pulse"
  role="status"
  aria-label="Loading menu">
  @for (width of linkWidths; track $index) {
  <div
    class="flex items-center gap-2 px-4 py-2"
    aria-hidden="true">
    <p-skeleton
      shape="circle"
      width="0.75rem"
      height="0.75rem" />
    <p-skeleton
      height="0.85rem"
      [width]="width" />
  </div>
  }
</div>
