<p-card class="p-4 bg-white dark:bg-zinc-900 rounded-lg min-h-[20rem]">
  <div class="font-semibold mb-2 flex items-center justify-between">
    <span class="font-semibold mb-4 text-xl text-gray-900 dark:text-zinc-100">
      {{ title() }}
    </span>
    <span class="text-xs text-slate-400 dark:text-zinc-400">{{ activityHeatmap().period }}</span>
  </div>
  <div class="text-2xl font-bold text-gray-900 dark:text-zinc-100">
    {{ activityHeatmap().totalActivities }}
  </div>
  <div class="text-xs text-green-600 dark:text-green-400 mb-4">
    {{ activityHeatmap().change }} this month
  </div>
  <div class="grid grid-cols-7 gap-2 mt-2">
    @for (cell of activityHeatmap().data; track cell.day + cell.time) {
      <div
        [class]="
          'w-8 h-8 rounded flex items-center justify-center text-xs cursor-pointer ' +
          (cell.intensity === 'low'
            ? 'bg-primary-100 dark:bg-primary-900'
            : cell.intensity === 'medium'
              ? 'bg-primary-300 dark:bg-primary-700'
              : 'bg-primary-500 dark:bg-primary-700')
        "
        title="{{ cell.day }}\n{{ cell.time }}\nLeave Requests: {{
          cell.leaveRequests
        }}\nInterviews: {{ cell.interviews }}\nOnboarding: {{ cell.onboarding }}"
      >
        {{ cell.leaveRequests + cell.interviews + cell.onboarding }}
      </div>
    }
  </div>
</p-card>
