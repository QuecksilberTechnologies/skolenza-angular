<div class="chats-container p-2 w-[360px] bg-white dark:bg-zinc-900 rounded-lg">
  <div class="chats-header flex justify-between items-center mb-2">
    <h3 class="text-lg font-semibold m-0 text-gray-900 dark:text-zinc-100">Messages</h3>
    <button
      class="text-xs text-success hover:underline focus:underline outline-none bg-transparent border-0 p-0 dark:text-success-300"
      (click)="markAllMessagesAsRead()"
    >
      Mark all as read
    </button>
  </div>

  <div class="search-container mb-3">
    <input
      type="text"
      pInputText
      [(ngModel)]="searchQuery"
      placeholder="Search messages..."
      class="w-full text-sm px-2 py-1 border border-gray-200 dark:border-zinc-700 rounded focus:border-success outline-none bg-white dark:bg-zinc-800 text-gray-900 dark:text-zinc-100 placeholder-gray-400 dark:placeholder-zinc-400"
    />
  </div>

  <div
    class="chats-list max-h-[320px] overflow-y-auto divide-y divide-gray-100 dark:divide-zinc-800"
  >
    @for (message of filteredMessages; track message.id) {
      <div
        role="button"
        tabindex="0"
        class="flex items-center gap-3 py-2 px-1 group cursor-pointer focus:bg-gray-50 dark:focus:bg-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-800 transition"
        (click)="onAppClick($event)"
        (keydown.enter)="onAppClick($event)"
        (keydown.space)="onAppClick($event)"
      >
        <div class="relative flex-shrink-0">
          <img
            [ngSrc]="`images/teams/${message.sender.avatar}`"
            priority
            placeholder="data:image/png;base64,iVBORw0K..."
            [alt]="message.sender.name"
            width="32"
            height="32"
            class="w-8 h-8 rounded-full object-cover"
          />
          @if (!message.isRead) {
            <span
              class="absolute -right-1 -bottom-1 w-2 h-2 rounded-full bg-success border-2 border-white dark:border-zinc-900"
            ></span>
          }
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-center">
            <span
              class="font-medium text-gray-800 dark:text-zinc-100 group-hover:underline truncate"
              >{{ message.sender.name }}</span
            >
            <span class="text-xs text-gray-400 dark:text-zinc-400 ml-2 whitespace-nowrap">{{
              message.time
            }}</span>
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-sm text-gray-600 dark:text-zinc-300 truncate">{{
              message.content
            }}</span>
            @if (message.attachments?.length) {
              <i
                class="pi pi-paperclip text-xs text-gray-400 dark:text-zinc-400 ml-1"
                aria-label="Attachment"
              ></i>
            }
            @if (message.reactions?.length) {
              <i
                class="pi pi-smile text-xs text-gray-400 dark:text-zinc-400 ml-1"
                aria-label="Reactions"
              ></i>
            }
          </div>
        </div>
      </div>
    } @empty {
      <div class="text-center text-gray-400 dark:text-zinc-400 py-6 text-sm">No messages found</div>
    }
  </div>

  <div class="chats-footer flex justify-end mt-3 pt-2">
    <button
      class="text-xs text-success hover:underline focus:underline outline-none bg-transparent border-0 p-0 flex items-center gap-1 dark:text-success-300"
    >
      View All Messages
      <i class="pi pi-arrow-right text-xs"></i>
    </button>
  </div>
</div>
