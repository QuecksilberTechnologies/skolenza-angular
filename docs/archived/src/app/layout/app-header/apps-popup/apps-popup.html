<div class="apps-container p-2 w-[280px] bg-white dark:bg-zinc-900 rounded-lg">
  <div class="apps-header flex justify-between items-center mb-4">
    <div class="flex items-center gap-3">
      <h3 class="text-xl font-semibold m-0 text-gray-900 dark:text-zinc-100">Applications</h3>
    </div>
  </div>

  <div class="all-apps-section">
    <div class="grid grid-cols-1 gap-1">
      <!-- topMenus -->
      @for (topMenu of topMenus(); track topMenu.moduleId) {
        <a
          class="app-item group relative flex items-center gap-3 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-zinc-800 hover:cursor-pointer transition-colors duration-200"
          (click)="onAppClick($event, topMenu)"
          (keydown.enter)="onAppClick($event, topMenu)"
          tabindex="0"
          role="button"
        >
          <div
            class="app-icon w-10 h-10 flex items-center justify-center bg-primary-emphasis dark:bg-primary/30 text-white rounded-lg"
          >
            <i class="pi pi-th-large"></i>
          </div>
          <div class="app-info flex-1">
            <p
              class="app-name text-base group-hover:text-primary-600 dark:group-hover:text-primary-400 truncate font-medium text-gray-900 dark:text-zinc-100"
            >
              {{ topMenu.displayName }}
            </p>
          </div>
        </a>
      } @empty {
        <div
          class="col-span-5 text-center text-gray-500 dark:text-zinc-400 py-6 bg-gray-50 dark:bg-zinc-800 rounded-lg"
        >
          <i class="pi pi-microsoft !text-2xl mb-2 text-gray-400 dark:text-zinc-500"></i>
          <p class="text-sm">No applications found</p>
        </div>
      }
